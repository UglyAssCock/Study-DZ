name: master-5-sites-harvester

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'links.txt'
      - '.github/workflows/auto_import.yml'
  workflow_dispatch:
    inputs:
      extra_url:
        description: 'Paste 1 or more category/exam URLs here (optional)'
        required: false
        default: ''
      max_files_per_run:
        description: 'Max new PDFs to save in this run (default 10000)'
        required: true
        default: '10000'

concurrency:
  group: study-dz-harvester
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest-study-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Scraper and PDF Libraries
        run: pip install requests beautifulsoup4 pillow lxml pypdf

      - name: Harvest Up To 10000 PDFs and Merge BAC, BEM, and 5eme With Corrections
        env:
          MAX_FILES: ${{ github.event.inputs.max_files_per_run }}
          EXTRA_URL: ${{ github.event.inputs.extra_url }}
        shell: python
        run: |
          import os
          import re
          import io
          import time
          import shutil
          import hashlib
          import threading
          import urllib.parse
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader, PdfWriter

          start_time = time.time()
          MAX_RUNTIME_SECONDS = 50 * 60

          def is_time_up():
              return (time.time() - start_time) > MAX_RUNTIME_SECONDS

          os.makedirs("files", exist_ok=True)
          content_hashes_file = "files/content_hashes.txt"

          subprocess.run(["git", "config", "user.name", "StudyDZ-Harvester"], check=False)
          subprocess.run(["git", "config", "user.email", "bot@studydz.app"], check=False)

          scoped_hashes = set()
          seen_paths = set()

          def get_scope_from_path(filepath):
              bn = os.path.basename(filepath).lower()
              for st in ["_tc_st_", "_tc_l_", "_se_", "_mt_", "_tm_", "_ge_", "_lp_", "_le_", "_tc_st.", "_tc_l.", "_se.", "_mt.", "_tm.", "_ge.", "_lp.", "_le."]:
                  if st in bn:
                      return st.strip("_.")
              return "general"

          for root, _, fnames in os.walk("files"):
              for fn in sorted(fnames):
                  if not fn.lower().endswith(".pdf"):
                      continue
                  p = os.path.join(root, fn)
                  lower_fn = fn.lower()
                  if lower_fn.startswith(("bac_", "bem_", "5eme_")) and not lower_fn.endswith("_merged.pdf"):
                      try:
                          os.remove(p)
                          continue
                      except Exception:
                          pass
                  try:
                      with open(p, "rb") as pf:
                          raw = pf.read()
                      if len(raw) >= 1500 and raw[:4] == b"%PDF":
                          md5_h = hashlib.md5(raw).hexdigest()
                          scope = get_scope_from_path(p)
                          scoped_hashes.add((scope, md5_h))
                          seen_paths.add(p.replace("\\", "/"))
                  except Exception:
                      pass

          lock = threading.Lock()
          saved_total = 0

          def write_index_and_push(msg):
              with lock:
                  all_rel_pdfs = []
                  for r_dir, _, f_list in os.walk("files"):
                      for fn in sorted(f_list):
                          if fn.lower().endswith(".pdf"):
                              all_rel_pdfs.append(os.path.join(r_dir, fn).replace("\\", "/"))
                  with open("files/index.txt", "w", encoding="utf-8") as idx_f:
                      idx_f.write("\n".join(all_rel_pdfs))
                  subprocess.run(["git", "add", "-A", "files/"], check=False)
                  res = subprocess.run(["git", "diff", "--staged", "--quiet"])
                  if res.returncode != 0:
                      subprocess.run(["git", "commit", "-m", msg], check=False)
                      subprocess.run(["git", "pull", "--no-rebase", "-X", "ours"], check=False)
                      subprocess.run(["git", "push", "origin", "HEAD:main"], check=False)

          def get_sibling_streams(level, subject, current_stream):
              all_6 = ["se", "mt", "tm", "ge", "lp", "le"]
              sci_4 = ["se", "mt", "tm", "ge"]
              lit_2 = ["lp", "le"]

              if level in ["bac", "3as"]:
                  if subject in ["islamic", "amazigh"]:
                      return all_6
                  if subject in ["arabic", "french", "english", "hisgeo"] and current_stream in sci_4:
                      return sci_4
                  if subject == "hisgeo" and current_stream in lit_2:
                      return lit_2
                  if subject == "philo":
                      if current_stream in ["se", "mt"]:
                          return ["se", "mt"]
                      if current_stream in ["tm", "ge"]:
                          return ["tm", "ge"]
                  if subject == "physics" and current_stream in ["mt", "tm"]:
                      return ["mt", "tm"]
              elif level == "2as":
                  if subject in ["islamic", "amazigh"]:
                      return all_6
                  if subject in ["arabic", "french", "english", "hisgeo"]:
                      return lit_2 if current_stream in lit_2 else sci_4
                  if subject in ["math", "physics"] and current_stream in ["se", "mt", "tm"]:
                      return ["se", "mt", "tm"]
                  if subject == "science" and current_stream in ["se", "mt"]:
                      return ["se", "mt"]
                  if subject == "philo" and current_stream in lit_2:
                      return lit_2
              elif level == "1as":
                  if subject != "engineering" and current_stream in ["tc_st", "tc_l"]:
                      return ["tc_st", "tc_l"]
              return [current_stream] if current_stream else []

          backfilled_count = 0
          for root, _, fnames in os.walk("files"):
              for fn in sorted(fnames):
                  if not fn.lower().endswith(".pdf"):
                      continue
                  src_path = os.path.join(root, fn).replace("\\", "/")
                  m_bac = re.match(r'^bac_(\d{4})_([a-z0-9_]+)_(se|mt|tm|ge|lp|le)_merged\.pdf$', fn.lower())
                  if m_bac:
                      yr, subj, st = m_bac.group(1), m_bac.group(2), m_bac.group(3)
                      for sib in get_sibling_streams("bac", subj, st):
                          if sib == st:
                              continue
                          dst_path = os.path.join(root, f"bac_{yr}_{subj}_{sib}_merged.pdf").replace("\\", "/")
                          if not os.path.exists(dst_path):
                              try:
                                  shutil.copy2(src_path, dst_path)
                                  with open(dst_path, "rb") as df:
                                      d_md5 = hashlib.md5(df.read()).hexdigest()
                                  scoped_hashes.add((sib, d_md5))
                                  seen_paths.add(dst_path)
                                  backfilled_count += 1
                              except Exception:
                                  pass
                      continue

                  m_hs = re.match(r'^(1as|2as|3as)_([a-z0-9_]+)_(tc_st|tc_l|se|mt|tm|ge|lp|le)_(.+\.pdf)$', fn.lower())
                  if m_hs:
                      lvl, subj, st, rest = m_hs.group(1), m_hs.group(2), m_hs.group(3), m_hs.group(4)
                      for sib in get_sibling_streams(lvl, subj, st):
                          if sib == st:
                              continue
                          dst_path = os.path.join(root, f"{lvl}_{subj}_{sib}_{rest}").replace("\\", "/")
                          if not os.path.exists(dst_path):
                              try:
                                  shutil.copy2(src_path, dst_path)
                                  with open(dst_path, "rb") as df:
                                      d_md5 = hashlib.md5(df.read()).hexdigest()
                                  scoped_hashes.add((sib, d_md5))
                                  seen_paths.add(dst_path)
                                  backfilled_count += 1
                              except Exception:
                                  pass

          if backfilled_count > 0:
              print(f"Distributed {backfilled_count} existing shared PDFs across sibling branches.")
              write_index_and_push(f"Distributed {backfilled_count} shared subject PDFs across branches")

          try:
              max_to_save = int(os.environ.get("MAX_FILES", "10000").strip() or "10000")
          except Exception:
              max_to_save = 10000
          if max_to_save < 10000:
              max_to_save = 10000

          base_headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36"
          }

          def get_headers_for(target_url):
              parsed = urllib.parse.urlparse(target_url)
              origin = f"{parsed.scheme}://{parsed.netloc}/" if parsed.scheme and parsed.netloc else "https://eddirasa.com/"
              return {**base_headers, "Referer": origin}

          def url_hash(u):
              return hashlib.md5(urllib.parse.unquote(u).strip().encode("utf-8")).hexdigest()[:12]

          def merge_two_pdfs_bytes(subject_bytes, correction_bytes):
              try:
                  writer = PdfWriter()
                  r1 = PdfReader(io.BytesIO(subject_bytes))
                  for page in r1.pages:
                      writer.add_page(page)
                  r2 = PdfReader(io.BytesIO(correction_bytes))
                  for page in r2.pages:
                      writer.add_page(page)
                  out = io.BytesIO()
                  writer.write(out)
                  merged = out.getvalue()
                  return merged if len(merged) >= 1500 else None
              except Exception:
                  return None

          def register_unique_pdf_bytes(raw_bytes, out_filepath, allow_overwrite=False):
              if not out_filepath or not raw_bytes or len(raw_bytes) < 1500 or raw_bytes[:4] != b"%PDF":
                  return False
              md5_hex = hashlib.md5(raw_bytes).hexdigest()
              norm_path = out_filepath.replace("\\", "/")
              scope = get_scope_from_path(norm_path)

              with lock:
                  if (scope, md5_hex) in scoped_hashes:
                      return False
                  if not allow_overwrite and (norm_path in seen_paths or os.path.exists(norm_path)):
                      stem, ext = os.path.splitext(norm_path)
                      norm_path = f"{stem}_{md5_hex[:4]}{ext}"

                  os.makedirs(os.path.dirname(norm_path), exist_ok=True)
                  with open(norm_path, "wb") as f:
                      f.write(raw_bytes)
                  scoped_hashes.add((scope, md5_hex))
                  seen_paths.add(norm_path)
                  with open(content_hashes_file, "a", encoding="utf-8") as cf:
                      cf.write(f"{scope}:{md5_hex}\n")
              print("Saved unique PDF:", norm_path)
              return True

          level_rules = [
              ("1ap", ["first-primary", "1ere-primaire", "الأولى ابتدائي", "الأولى إبتدائي", "اولى ابتدائي", "1 ابتدائي", "سنة أولى ابتدائي", "/1ap/"]),
              ("2ap", ["second-primary", "2eme-primaire", "الثانية ابتدائي", "الثانية إبتدائي", "ثانية ابتدائي", "2 ابتدائي", "سنة ثانية ابتدائي", "/2ap/"]),
              ("3ap", ["third-primary", "3eme-primaire", "الثالثة ابتدائي", "الثالثة إبتدائي", "ثالثة ابتدائي", "3 ابتدائي", "سنة ثالثة ابتدائي", "/3ap/"]),
              ("4ap", ["fourth-primary", "4eme-primaire", "الرابعة ابتدائي", "الرابعة إبتدائي", "رابعة ابتدائي", "4 ابتدائي", "سنة رابعة ابتدائي", "/4ap/"]),
              ("5ap", ["fifth-primary", "5eme-primaire", "الخامسة ابتدائي", "الخامسة إبتدائي", "خامسة ابتدائي", "5 ابتدائي", "سنة خامسة ابتدائي", "/5ap/", "cinqueme", "cinquieme", "cinq-solutions"]),
              ("1am", ["first-middle", "first-medium", "first-am", "1ere-moyen", "الأولى متوسط", "اولى متوسط", "1 متوسط", "سنة أولى متوسط", "/1am/"]),
              ("2am", ["second-middle", "second-medium", "second-am", "2eme-moyen", "الثانية متوسط", "ثانية متوسط", "2 متوسط", "سنة ثانية متوسط", "/2am/"]),
              ("3am", ["third-middle", "third-medium", "third-am", "3eme-moyen", "الثالثة متوسط", "ثالثة متوسط", "3 متوسط", "سنة ثالثة متوسط", "/3am/"]),
              ("4am", ["fourth-middle", "fourth-medium", "fourth-am", "4eme-moyen", "الرابعة متوسط", "رابعة متوسط", "4 متوسط", "سنة رابعة متوسط", "/4am/"]),
              ("1as", ["first-secondary", "first-as", "1ere-secondaire", "الأولى ثانوي", "اولى ثانوي", "1 ثانوي", "سنة أولى ثانوي", "/1as/"]),
              ("2as", ["second-secondary", "second-as", "2eme-secondaire", "الثانية ثانوي", "ثانية ثانوي", "2 ثانوي", "سنة ثانية ثانوي", "/2as/"]),
              ("3as", ["third-secondary", "third-as", "3eme-secondaire", "الثالثة ثانوي", "ثالثة ثانوي", "3 ثانوي", "سنة ثالثة ثانوي", "/3as/"]),
          ]

          subject_url_slugs = [
              ("physics", ["/physics/", "/physics", "/physique", "/phys/", "-physique-", "-physics-", "-physique"]),
              ("science", ["natural-sciences", "sciences-naturelles", "primary/sciences", "1am/sciences", "2am/sciences", "3am/sciences", "4am/sciences", "1as/sciences", "2as/sciences", "3as/sciences", "-sciences-", "-science-", "-science", "-sienc"]),
              ("arabic", ["/arabic/", "/arabic", "/arabe", "-arabic-", "-arabe-", "-arabic", "-arabe"]),
              ("french", ["/francais/", "/francais", "/french/", "/french", "-francais-", "-french-", "-francais", "-french"]),
              ("english", ["/english/", "/english", "/anglais", "-english-", "-anglais-", "-english", "-anglais"]),
              ("hisgeo", ["his-geo", "hisgeo", "history-geography", "histoire-geographie", "/history/", "/history", "/histoire"]),
              ("islamic", ["islamic-education", "sciences-islamiques", "/islamic/", "/islamic", "/islamia", "-islamic-", "-islamia-", "-islamic"]),
              ("philo", ["/philo/", "/philo", "/philosophy/", "/philosophy", "/philosophie", "-philosophy-", "-philo-"]),
              ("civics", ["civic-education", "education-civique", "/civic/", "/civic", "/civics/", "-civic-", "-civil", "-civ-"]),
              ("cs", ["/informatique/", "/informatique", "computer-science", "-informatique-"]),
              ("accounting", ["/accounting/", "/accounting", "/comptabilite", "/gestion", "-accounting-", "-gestion-"]),
              ("economy", ["/economy/", "/economy", "/economics/", "/economie", "-economy-", "-economie-"]),
              ("law", ["/law/", "/law", "/droit", "-law-", "-droit-"]),
              ("engineering", ["civil-engineering", "electrical-engineering", "mechanical-engineering", "process-engineering", "/engineering/", "/technology/", "/technology", "genie-civil", "genie-electrique", "genie-mecanique", "genie-des-procedes", "/technologie"]),
              ("amazigh", ["/amazigh/", "/amazigh", "/tamazight", "-tamazigh-", "-tamazight-", "-amazigh-", "-tamazight", "-amazig", "-tam-"]),
              ("third_lang", ["/espagnol", "/allemand", "/italien", "/spanish/", "/spanish", "/german/", "/german", "/italian/", "/italian", "-espagnol-", "-allemand-", "-italien-"]),
              ("art", ["art-education", "music-education"]),
              ("math", ["/maths/", "/maths", "/math/", "/mathematiques", "-math-", "-maths-", "-maths", "-math"]),
          ]

          subject_text_rules = [
              ("physics", ["العلوم الفيزيائية", "الفيزياء", "فيزياء"]),
              ("science", ["العلوم الطبيعية", "علوم الطبيعة", "علوم طبيعية", "التربية العلمية"]),
              ("arabic", ["اللغة العربية", "الأدب العربي"]),
              ("french", ["اللغة الفرنسية", "فرنسية"]),
              ("english", ["اللغة الإنجليزية", "اللغة الانجليزية", "إنجليزية", "انجليزية"]),
              ("hisgeo", ["التاريخ والجغرافيا", "التاريخ و الجغرافيا", "تاريخ جغرافيا", "تاريخ وجغرافيا"]),
              ("islamic", ["العلوم الإسلامية", "التربية الإسلامية", "التربية الاسلامية", "شريعة"]),
              ("philo", ["الفلسفة", "فلسفة"]),
              ("civics", ["التربية المدنية", "مدنية"]),
              ("cs", ["الإعلام الآلي", "الاعلام الالي", "معلوماتية"]),
              ("accounting", ["التسيير المحاسبي", "محاسبة"]),
              ("economy", ["الاقتصاد والمناجمنت", "الإقتصاد والمناجمنت"]),
              ("law", ["القانون"]),
              ("engineering", ["الهندسة المدنية", "الهندسة الكهربائية", "الهندسة الميكانيكية", "هندسة الطرائق", "التكنولوجيا", "تكنولوجيا"]),
              ("amazigh", ["اللغة الأمازيغية", "أمازيغية", "امازيغية"]),
              ("third_lang", ["اللغة الإيطالية", "اللغة الإسبانية", "اللغة الألمانية", "اسبانية", "المانية", "ايطالية"]),
              ("art", ["التربية التشكيلية", "التربية الموسيقية", "التربية الفنية"]),
              ("math", ["الرياضيات", "موضوع الرياضيات", "تصحيح الرياضيات", "مادة الرياضيات", "اختبار الرياضيات"]),
          ]

          def detect_trimester_strict(text, fallback_trim="t1"):
              t = text.lower()
              if any(w in t for w in ["term-3", "trimestre-3", "3-trimestre", "3eme-trimestre", "_t3", "-t3", "/t3/"]):
                  return "t3"
              if any(w in t for w in ["term-2", "trimestre-2", "2-trimestre", "2eme-trimestre", "_t2", "-t2", "/t2/"]):
                  return "t2"
              if any(w in t for w in ["term-1", "trimestre-1", "1-trimestre", "1er-trimestre", "_t1", "-t1", "/t1/"]):
                  return "t1"
              if any(w in t for w in ["الفصل الثالث", "الثلاثي الثالث", "فصل 3", "الفصل 3"]):
                  return "t3"
              if any(w in t for w in ["الفصل الثاني", "الثلاثي الثاني", "فصل 2", "الفصل 2"]):
                  return "t2"
              if any(w in t for w in ["الفصل الأول", "الفصل الاول", "الثلاثي الأول", "فصل 1", "الفصل 1"]):
                  return "t1"
              return fallback_trim

          def detect_category_strict(text, fallback_cat="exam"):
              t = text.lower()
              for slogan in ["دروس وفروض واختبارات", "فروض واختبارات", "دروس مفصلة", "موقع الدراسة", "تمارين مع الحل"]:
                  t = t.replace(slogan, " ")

              if any(w in t for w in ["/books", "/book", "/livres", "/manuel"]):
                  return "book"
              if any(w in t for w in ["/summaries", "/summary", "/resumes", "/resume"]):
                  return "resume"
              if any(w in t for w in ["/lessons", "/lesson", "/notes", "/note", "/cours"]):
                  return "lesson"
              if any(w in t for w in ["/tests-", "/tests/", "/devoirs"]):
                  return "test"
              if any(w in t for w in ["/exams-", "/exams/", "/examens"]):
                  return "exam"

              if any(w in t for w in ["الكتاب المدرسي", "كتاب ", "كتب "]):
                  return "book"
              if any(w in t for w in ["ملخص", "ملخصات"]):
                  return "resume"
              if any(w in t for w in ["درس ", "دروس ", "مذكرة ", "مذكرات "]):
                  return "lesson"
              if any(w in t for w in ["فرض ", "فروض "]):
                  return "test"
              if any(w in t for w in ["اختبار", "إختبار", "امتحان"]):
                  return "exam"
              return fallback_cat

          def detect_all_matching_streams(t, t_space, level, subject, archive_type, parent_streams=None):
              all_6 = ["se", "mt", "tm", "ge", "lp", "le"]
              sci_4 = ["se", "mt", "tm", "ge"]
              lit_2 = ["lp", "le"]

              if level not in ["1as", "2as", "3as"] and archive_type != "bac":
                  return []

              if level == "1as":
                  has_st = any(w in t_space for w in ["جذع مشترك علوم", "ج م ع"]) or ("science-1as" in t) or (subject == "engineering")
                  has_l = any(w in t_space for w in ["جذع مشترك آداب", "ج م آ", "ج م ا"]) or ("literary-1as" in t)
                  if has_st and not has_l:
                      return ["tc_st"]
                  if has_l and not has_st:
                      return ["tc_l"]
                  if parent_streams:
                      return parent_streams
                  return ["tc_st"] if subject == "engineering" else ["tc_st", "tc_l"]

              if subject == "engineering":
                  return ["tm"]
              if subject in ["accounting", "economy", "law"]:
                  return ["ge"]
              if subject == "third_lang":
                  return ["le"]

              if subject in ["islamic", "amazigh"]:
                  return all_6

              explicit = []
              if any(w in t_space for w in ["علوم تجريبية", "شعبة علوم تجريبية", "شعبة ع ت"]) or any(w in t for w in ["-se/", "-se-", "-se"]) or re.search(r'/bac-20\d\d/sciences/', t):
                  explicit.append("se")
              if any(w in t_space for w in ["شعبة رياضيات", "شعبة الرياضيات"]) or re.search(r'شعبة\s+ر(?:\s|$|-|\|)', t_space) or any(w in t for w in ["exams-math", "tests-math", "/mathematics/", "-mt-", "-mt/", "bac-math-"]) or re.search(r'باك\s*20\d\d\s*رياضيات', t_space):
                  explicit.append("mt")
              if any(w in t_space for w in ["تقني رياضي", "التقني الرياضي", "شعبة ت ر"]) or any(w in t for w in ["technical-mathematics", "tech-math", "-tm-", "-tm/"]):
                  explicit.append("tm")
              if any(w in t_space for w in ["تسيير واقتصاد", "تسيير و اقتصاد", "تسيير و إقتصاد", "تسيير وإقتصاد", "شعبة ت إ", "شعبة ت ا"]) or any(w in t for w in ["exams-management", "tests-management", "management-economics", "management", "-ge-", "-ge/"]):
                  explicit.append("ge")
              if any(w in t_space for w in ["آداب وفلسفة", "اداب وفلسفة", "آداب و فلسفة", "شعبة آ ف", "شعبة ا ف"]) or any(w in t for w in ["exams-literary", "tests-literary", "literature-philosophy", "-lp-", "-lp/"]):
                  explicit.append("lp")
              if any(w in t_space for w in ["لغات أجنبية", "لغات اجنبية", "شعبة ل أ", "شعبة ل ا"]) or any(w in t for w in ["foreign-languages", "-le-", "-le/"]):
                  explicit.append("le")

              is_all_sci = any(w in t_space for w in ["شعب علمية", "الشعب العلمية"]) or any(w in t for w in ["-sci-", "-sc-", "exams-science", "tests-science"])
              is_all_lit = any(w in t_space for w in ["شعب أدبية", "الشعب الأدبية"])
              is_all_branches = any(w in t_space for w in ["كل الشعب", "جميع الشعب"])

              if is_all_branches:
                  return all_6

              if subject in ["arabic", "french", "english", "hisgeo"]:
                  if any(s in explicit for s in lit_2) or is_all_lit:
                      if subject == "hisgeo":
                          return lit_2
                      return explicit if explicit else lit_2
                  if any(s in explicit for s in sci_4) or is_all_sci:
                      return sci_4

              if subject == "philo":
                  if any(s in explicit for s in ["se", "mt"]) and not any(s in explicit for s in ["tm", "ge"]):
                      return ["se", "mt"]
                  if any(s in explicit for s in ["tm", "ge"]) and not any(s in explicit for s in ["se", "mt"]):
                      return ["tm", "ge"]
                  if is_all_sci:
                      return sci_4
                  if explicit:
                      return explicit
                  if level == "2as":
                      return lit_2

              if subject == "physics":
                  if any(s in explicit for s in ["mt", "tm"]) and "se" not in explicit:
                      return ["mt", "tm"]
                  if level == "2as" and (is_all_sci or not explicit):
                      return ["se", "mt", "tm"]

              if subject == "science" and level == "2as" and (is_all_sci or not explicit):
                  return ["se", "mt"]

              if explicit:
                  return explicit
              if is_all_sci:
                  return ["se", "mt", "tm"] if (level == "2as" and subject in ["math", "physics"]) else sci_4
              if is_all_lit:
                  return lit_2
              if parent_streams:
                  return parent_streams
              return ["se"]

          def analyze_metadata(text, parent_meta=None):
              t = urllib.parse.unquote(text).lower()
              for slogan in ["دروس وفروض واختبارات", "موقع الدراسة الجزائري", "الموقع الأول لتحضير الفروض والاختبارات في الجزائر"]:
                  t = t.replace(slogan, " ")
              t_space = t.replace("-", " ")

              is_solution = any(
                  w in t
                  for w in ["التصحيح فقط", "تصحيح موضوع", "_sol.", "-sol.", "corrige-", "correction-examen-", "correction-bac-", "correction-bem-", "-correction", "/تصحيح-"]
              )

              has_trimester = any(
                  w in t
                  for w in [
                      "term-1", "term-2", "term-3",
                      "trimestre-1", "trimestre-2", "trimestre-3",
                      "الفصل الأول", "الفصل الاول", "الفصل الثاني", "الفصل الثالث",
                      "الثلاثي الأول", "الثلاثي الثاني", "الثلاثي الثالث",
                  ]
              )

              archive_type = None
              if not has_trimester and not (parent_meta and parent_meta.get("has_trimester")):
                  if any(w in t for w in ["بكالوريا", "البكالوريا", "/bac-", "/bac/", "/bac", "bac-solutions", "-باك-", "bacdz.net"]):
                      archive_type = "bac"
                  elif any(w in t for w in ["شهادة التعليم المتوسط", "البيام", "/bem-", "/bem/", "/bem", "bem-solutions"]):
                      archive_type = "bem"
                  elif any(w in t for w in ["شهادة التعليم الابتدائي", "شهادة التعليم الإبتدائي", "السانكيام", "/5eme-", "/5eme/", "cinqueme", "cinquieme", "cinq-solutions"]):
                      archive_type = "5eme"

              ym = re.search(r'(200[89]|201[0-9]|202[0-6])', t)
              year = ym.group(1) if (ym and archive_type) else (parent_meta.get("year") if (parent_meta and archive_type) else None)

              level = None
              for code, keys in level_rules:
                  if any(k in t or k in t_space for k in keys):
                      level = code
                      break

              if not level:
                  if parent_meta and parent_meta.get("level"):
                      level = parent_meta["level"]
                  elif archive_type == "bac":
                      level = "3as"
                  elif archive_type == "bem":
                      level = "4am"
                  elif archive_type == "5eme":
                      level = "5ap"
                  else:
                      level = "3as"

              subject = None
              if re.search(r'/(?:bac|bem)-20\d\d/(?:[a-z-]+/)?sciences/?(?:$|\s)', t):
                  subject = "science"
              if not subject:
                  for code, slugs in subject_url_slugs:
                      if any(s in t for s in slugs):
                          subject = code
                          break
              if not subject:
                  for code, words in subject_text_rules:
                      if any(w in t_space for w in words):
                          subject = code
                          break
              if not subject and ("رياضيات" in t_space):
                  subject = "math"
              if not subject and parent_meta:
                  subject = parent_meta.get("subject")

              parent_streams = parent_meta.get("streams") if parent_meta else None
              streams = detect_all_matching_streams(t, t_space, level, subject, archive_type, parent_streams=parent_streams)

              fallback_t = parent_meta.get("trimester", "t1") if parent_meta else "t1"
              trimester = detect_trimester_strict(t_space, fallback_trim=fallback_t)

              fallback_c = parent_meta.get("category", "exam") if parent_meta else "exam"
              category = detect_category_strict(t_space, fallback_cat=fallback_c)

              return {
                  "skip": False,
                  "is_solution": is_solution,
                  "has_trimester": has_trimester or (parent_meta.get("has_trimester", False) if parent_meta else False),
                  "year": year,
                  "archive_type": archive_type,
                  "level": level,
                  "subject": subject,
                  "streams": streams,
                  "trimester": trimester,
                  "category": category,
              }

          def build_filepaths(meta, unique_tag=""):
              subj = meta["subject"] or "math"
              paths = []

              if meta["archive_type"] and meta["year"]:
                  folder = os.path.join("files", meta["archive_type"])
                  os.makedirs(folder, exist_ok=True)
                  if meta["archive_type"] == "bac":
                      target_streams = meta.get("streams") or ["se"]
                      for st in target_streams:
                          paths.append(os.path.join(folder, f"bac_{meta['year']}_{subj}_{st}_merged.pdf").replace("\\", "/"))
                      return paths
                  return [os.path.join(folder, f"{meta['archive_type']}_{meta['year']}_{subj}_merged.pdf").replace("\\", "/")]

              sfx = f"_{unique_tag}" if unique_tag else ""
              folder = os.path.join("files", meta["level"])
              os.makedirs(folder, exist_ok=True)

              if meta["level"] in ["1as", "2as", "3as"]:
                  target_streams = meta.get("streams") or (["tc_st"] if meta["level"] == "1as" else ["se"])
                  for st in target_streams:
                      if meta["category"] == "book":
                          paths.append(os.path.join(folder, f"{meta['level']}_{subj}_{st}_book{sfx}.pdf").replace("\\", "/"))
                      else:
                          paths.append(os.path.join(folder, f"{meta['level']}_{subj}_{st}_{meta['trimester']}_{meta['category']}{sfx}.pdf").replace("\\", "/"))
                  return paths

              if meta["category"] == "book":
                  return [os.path.join(folder, f"{meta['level']}_{subj}_book{sfx}.pdf").replace("\\", "/")]
              return [os.path.join(folder, f"{meta['level']}_{subj}_{meta['trimester']}_{meta['category']}{sfx}.pdf").replace("\\", "/")]

          def extract_direct_pdf_url(raw_link, base_url):
              if not raw_link or raw_link.startswith("#") or raw_link.startswith("javascript"):
                  return None
              full_link = urllib.parse.urljoin(base_url, raw_link.replace(r"\/", "/"))
              sub_q = urllib.parse.parse_qs(urllib.parse.urlparse(full_link).query)
              if "file" in sub_q:
                  return urllib.parse.urljoin(full_link, sub_q["file"][0])
              if ".pdf" in full_link.lower() and "docs.google.com" not in full_link.lower():
                  return full_link
              if "dzexams.com" in full_link.lower() and any(k in full_link.lower() for k in ["/telecharger/", "/download/", "/pdf/"]):
                  return full_link
              gd_match = (
                  re.search(r'/file/d/([a-zA-Z0-9_-]+)', full_link)
                  or re.search(r'[?&]id=([a-zA-Z0-9_-]+)', full_link)
              )
              if gd_match:
                  return f"https://drive.google.com/uc?export=download&id={gd_match.group(1)}"
              return None

          def convert_soup_images_to_pdf_bytes(soup, page_url):
              req_h = get_headers_for(page_url)
              content_box = (
                  soup.find("div", class_=re.compile(r"entry-content|post-content|article|main|sujet"))
                  or soup
              )
              pil_imgs = []
              for img in content_box.find_all("img"):
                  src = img.get("data-src") or img.get("src") or ""
                  if not src or any(
                      skip in src.lower()
                      for skip in ["logo", "avatar", "icon", "gravatar", "emoji", "banner", "ads", "button"]
                  ):
                      continue
                  src = urllib.parse.urljoin(page_url, src)
                  try:
                      ir = requests.get(src, headers=req_h, timeout=15)
                      if ir.status_code == 200:
                          im = Image.open(io.BytesIO(ir.content)).convert("RGB")
                          w, h = im.size
                          if w >= 380 and h >= 380:
                              pil_imgs.append(im)
                  except Exception:
                      pass
              if pil_imgs:
                  buf = io.BytesIO()
                  pil_imgs[0].save(
                      buf,
                      "PDF",
                      resolution=100.0,
                      save_all=True,
                      append_images=pil_imgs[1:],
                  )
                  val = buf.getvalue()
                  if len(val) >= 1500 and val[:4] == b"%PDF":
                      return val
              return None

          def extract_first_pdf_bytes_from_page(page_url):
              try:
                  req_h = get_headers_for(page_url)
                  r = requests.get(page_url, headers=req_h, timeout=20)
                  if r.status_code != 200:
                      return None
                  if r.content[:4] == b"%PDF":
                      return r.content
                  soup = BeautifulSoup(r.text, "html.parser")
                  candidates = []
                  for tag in soup.find_all(["a", "button", "iframe", "embed", "object"]):
                      for attr in ["href", "src", "data", "data-pdf", "data-file", "data-url", "data-src", "data-href"]:
                          pdf_u = extract_direct_pdf_url(tag.get(attr) or "", page_url)
                          if pdf_u and pdf_u not in candidates:
                              candidates.append(pdf_u)
                  clean_html = r.text.replace(r"\/", "/")
                  abs_pdfs = re.findall(r'https?://[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  rel_pdfs = re.findall(r'(?:/wp-content/uploads/|/uploads/|/files/|/storage/|/telecharger/)[^\s"\'\\`]+', clean_html, flags=re.IGNORECASE)
                  for u in abs_pdfs + [urllib.parse.urljoin(page_url, rp) for rp in rel_pdfs]:
                      if u not in candidates:
                          candidates.append(u)
                  for c_url in candidates:
                      pr = requests.get(c_url, headers=req_h, timeout=20)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          return pr.content
                  return convert_soup_images_to_pdf_bytes(soup, page_url)
              except Exception:
                  pass
              return None

          def save_bytes_to_all_targets(pdf_bytes, target_paths, allow_overwrite=False):
              saved_count = 0
              for tp in target_paths:
                  if register_unique_pdf_bytes(pdf_bytes, tp, allow_overwrite=allow_overwrite):
                      saved_count += 1
              return saved_count

          def download_or_convert_to_pdfs(page_url, out_filepaths):
              if not out_filepaths or is_time_up():
                  return 0
              try:
                  page_url = urllib.parse.unquote(page_url)
                  req_h = get_headers_for(page_url)
                  is_archive_merged = any("_merged.pdf" in p.lower() for p in out_filepaths)

                  r = requests.get(page_url, headers=req_h, timeout=20)
                  if r.status_code != 200:
                      return 0
                  if r.content[:4] == b"%PDF":
                      if is_archive_merged:
                          return 0
                      return save_bytes_to_all_targets(r.content, out_filepaths)

                  soup = BeautifulSoup(r.text, "html.parser")
                  subject_pdfs = []
                  correction_pdfs = []
                  companion_correction_pages = []

                  if "/موضوع-" in page_url and "/تصحيح-" not in page_url:
                      companion_correction_pages.append(page_url.replace("/موضوع-", "/تصحيح-", 1))

                  if "/examen-" in page_url and "/correction-examen-" not in page_url:
                      auto_corr_url = page_url.replace("/examen-", "/correction-examen-", 1)
                      companion_correction_pages.append(auto_corr_url)
                      if "-arabic-" in auto_corr_url:
                          companion_correction_pages.append(auto_corr_url.replace("-arabic-", "-arabe-"))
                      elif "-arabe-" in auto_corr_url:
                          companion_correction_pages.append(auto_corr_url.replace("-arabe-", "-arabic-"))

                  if "/bac-" in page_url and "/correction-bac-" not in page_url:
                      auto_corr_url = page_url.replace("/bac-", "/correction-bac-", 1)
                      companion_correction_pages.append(auto_corr_url)
                      if "-se-english-" in auto_corr_url:
                          companion_correction_pages.append(auto_corr_url.replace("-se-english-", "-sci-english-"))
                      if "-tamazigh-" in auto_corr_url:
                          companion_correction_pages.append(auto_corr_url.replace("-tamazigh-", "-tamazight-"))

                  if "/eddirasa-bac-" in page_url and "/eddirasa-correction-bac-" not in page_url:
                      companion_correction_pages.append(page_url.replace("/eddirasa-bac-", "/eddirasa-correction-bac-", 1))

                  if "/bem-" in page_url and "/correction-bem-" not in page_url and not page_url.rstrip("/").endswith("-correction"):
                      if "educationdz.com" in page_url:
                          companion_correction_pages.append(page_url.rstrip("/") + "-correction")
                      else:
                          companion_correction_pages.append(page_url.replace("/bem-", "/correction-bem-", 1))

                  for tag in soup.find_all(["a", "button", "iframe", "embed", "object"]):
                      tag_text = tag.get_text(" ", strip=True)
                      tag_id_cls = " ".join(tag.get("class") or []) + " " + (tag.get("id") or "")
                      raw_href = tag.get("href") or tag.get("data-url") or tag.get("data-href") or ""
                      if raw_href and any(w in tag_text for w in ["تصحيح الموضوع", "عرض التصحيح", "الحل النموذجي", "تصحيح موضوع", "التصحيح", "حل"]):
                          full_corr_page = urllib.parse.unquote(urllib.parse.urljoin(page_url, raw_href.replace(r"\/", "/")))
                          if not full_corr_page.lower().endswith(".pdf") and full_corr_page != page_url and full_corr_page not in companion_correction_pages:
                              companion_correction_pages.append(full_corr_page)

                      for attr in ["href", "src", "data", "data-pdf", "data-file", "data-url", "data-src", "data-href"]:
                          pdf_u = extract_direct_pdf_url(tag.get(attr) or "", page_url)
                          if not pdf_u:
                              continue
                          is_corr_tag = (
                              any(w in tag_text for w in ["التصحيح", "الحل", "حل"])
                              or any(w in pdf_u.lower() for w in ["_cor", "-cor", "corr-", "_sol", "-sol", "corrige", "correction", "solution"])
                              or any(w in tag_id_cls.lower() for w in ["corr", "sol", "solution"])
                          )
                          if is_corr_tag:
                              if pdf_u not in correction_pdfs:
                                  correction_pdfs.append(pdf_u)
                          else:
                              if pdf_u not in subject_pdfs:
                                  subject_pdfs.append(pdf_u)

                  clean_html = r.text.replace(r"\/", "/")
                  abs_pdfs = re.findall(r'https?://[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  rel_pdfs = re.findall(r'(?:/wp-content/uploads/|/uploads/|/files/|/storage/|/telecharger/)[^\s"\'\\`]+', clean_html, flags=re.IGNORECASE)
                  for u in abs_pdfs + [urllib.parse.urljoin(page_url, rp) for rp in rel_pdfs]:
                      if any(w in u.lower() for w in ["_cor", "-cor", "corr-", "_sol", "-sol", "corrige", "correction", "solution"]):
                          if u not in correction_pdfs:
                              correction_pdfs.append(u)
                      else:
                          if u not in subject_pdfs:
                              subject_pdfs.append(u)

                  # On dzexams.com, when both subject and solution PDFs are embedded in the same page, the 2nd PDF is the correction
                  if "dzexams.com" in page_url and len(subject_pdfs) >= 2 and not correction_pdfs:
                      correction_pdfs.append(subject_pdfs[1])
                      subject_pdfs = [subject_pdfs[0]]

                  for pdf_candidate in subject_pdfs:
                      pr = requests.get(pdf_candidate, headers=req_h, timeout=20)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          final_pdf_bytes = pr.content
                          merged_done = False

                          if correction_pdfs:
                              for corr_u in correction_pdfs:
                                  if corr_u == pdf_candidate:
                                      continue
                                  try:
                                      cr = requests.get(corr_u, headers=req_h, timeout=20)
                                      if cr.status_code == 200 and cr.content[:4] == b"%PDF":
                                          merged_res = merge_two_pdfs_bytes(pr.content, cr.content)
                                          if merged_res:
                                              final_pdf_bytes = merged_res
                                              merged_done = True
                                              break
                                  except Exception:
                                      pass

                          if not merged_done and companion_correction_pages:
                              for comp_url in companion_correction_pages:
                                  corr_bytes = extract_first_pdf_bytes_from_page(comp_url)
                                  if corr_bytes:
                                      merged_res = merge_two_pdfs_bytes(pr.content, corr_bytes)
                                      if merged_res:
                                          final_pdf_bytes = merged_res
                                          merged_done = True
                                          break

                          if is_archive_merged and not merged_done:
                              continue

                          cnt = save_bytes_to_all_targets(final_pdf_bytes, out_filepaths, allow_overwrite=is_archive_merged)
                          if cnt > 0:
                              return cnt

                  img_pdf_bytes = convert_soup_images_to_pdf_bytes(soup, page_url)
                  if img_pdf_bytes:
                      if is_archive_merged:
                          for comp_url in companion_correction_pages:
                              corr_bytes = extract_first_pdf_bytes_from_page(comp_url)
                              if corr_bytes:
                                  merged_img_pdf = merge_two_pdfs_bytes(img_pdf_bytes, corr_bytes)
                                  if merged_img_pdf:
                                      cnt = save_bytes_to_all_targets(merged_img_pdf, out_filepaths, allow_overwrite=True)
                                      if cnt > 0:
                                          return cnt
                          return 0
                      return save_bytes_to_all_targets(img_pdf_bytes, out_filepaths)

              except Exception:
                  pass
              return 0

          def process_single_article_url(url, title_hint="", parent_meta=None):
              global saved_total
              if saved_total >= max_to_save or is_time_up():
                  return False

              url = urllib.parse.unquote(url)
              if "/تصحيح-" in url:
                  url = url.replace("/تصحيح-", "/موضوع-", 1)
              elif "/correction-examen-" in url:
                  url = url.replace("/correction-examen-", "/examen-", 1)
              elif "/eddirasa-correction-bac-" in url:
                  url = url.replace("/eddirasa-correction-bac-", "/eddirasa-bac-", 1)
              elif "/correction-bac-" in url:
                  url = url.replace("/correction-bac-", "/bac-", 1)
                  url = url.replace("-sci-english-", "-se-english-").replace("-tamazight-", "-tamazigh-")
              elif "/correction-bem-" in url:
                  url = url.replace("/correction-bem-", "/bem-", 1)
              elif url.rstrip("/").endswith("-correction"):
                  url = re.sub(r'-correction/?$', '', url)

              clean_hint = title_hint.strip()
              if clean_hint in ["الحل", "التصحيح", "عرض التصحيح", "تحميل التصحيح"]:
                  return False

              combined = title_hint + " " + url
              meta = analyze_metadata(combined, parent_meta=parent_meta)

              # Always inspect title/H1/breadcrumb when URL uses an opaque ID (such as dzexams.com/ar/annales/... or /ar/sujets/...)
              needs_page_inspection = (
                  not meta.get("subject")
                  or any(k in url for k in ["/annales/", "/sujets/"])
                  or (meta.get("archive_type") and not meta.get("year"))
              )
              if needs_page_inspection:
                  try:
                      r = requests.get(url, headers=get_headers_for(url), timeout=15)
                      if r.status_code == 200 and r.content[:4] != b"%PDF":
                          soup = BeautifulSoup(r.text, "html.parser")
                          page_title = soup.title.string if soup.title else ""
                          h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1"])])
                          bc_el = soup.find(["ol", "ul", "nav"], class_=re.compile(r"breadcrumb", re.I))
                          bc_txt = bc_el.get_text(" ", strip=True) if bc_el else ""
                          combined = f"{page_title} {h1_txt} {bc_txt} {combined}"
                          meta = analyze_metadata(combined, parent_meta=parent_meta)
                  except Exception:
                      pass

              if meta.get("is_solution") or not meta.get("subject"):
                  return False

              num_match = re.search(r'رقم\s*(\d+)', title_hint)
              short_tag = num_match.group(1) if num_match else url_hash(url)[:5]

              out_paths = build_filepaths(meta, short_tag)
              missing_paths = [p for p in out_paths if not os.path.exists(p)]
              if not missing_paths:
                  return False

              added_now = download_or_convert_to_pdfs(url, missing_paths)
              if added_now > 0:
                  with lock:
                      prev_batch = saved_total // 25
                      saved_total += added_now
                      new_batch = saved_total // 25
                      curr = saved_total
                  if new_batch > prev_batch:
                      write_index_and_push(f"Imported batch: +{curr} unique PDFs")
                  return True
              return False

          def crawl_hub_url(hub_url):
              global saved_total
              if saved_total >= max_to_save or is_time_up():
                  return

              unquoted_hub = urllib.parse.unquote(hub_url)
              if (
                  any(k in unquoted_hub for k in ["/annales/", "/sujets/", "/examen-", "/correction-examen-", "/bac-", "/correction-bac-", "/eddirasa-bac-", "/eddirasa-correction-bac-", "/bem-", "/correction-bem-", "/موضوع-", "/تصحيح-"])
                  and not any(h in unquoted_hub for h in ["bac-solutions", "bem-solutions"])
              ):
                  process_single_article_url(unquoted_hub, "", None)
                  return

              print("Crawling URL:", unquoted_hub)
              try:
                  r = requests.get(unquoted_hub, headers=get_headers_for(unquoted_hub), timeout=22)
                  if r.status_code != 200:
                      return

                  soup = BeautifulSoup(r.text, "html.parser")
                  page_title = soup.title.string if soup.title else ""
                  h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1"])])

                  parent_context = unquoted_hub + " " + page_title + " " + h1_txt
                  parent_meta = analyze_metadata(parent_context)
                  is_bac_or_bem_hub = parent_meta.get("archive_type") in ["bac", "bem"]

                  for nav_tag in soup.find_all(["nav", "header", "footer", "aside"]):
                      nav_tag.decompose()

                  article_items = []
                  seen_sub_urls = set()

                  for a in soup.find_all("a"):
                      href = a.get("href") or a.get("data-url") or a.get("data-href") or ""
                      txt = a.get_text(" ", strip=True)
                      if not href or href.startswith("#") or href.startswith("javascript"):
                          continue
                      if txt in ["الحل", "التصحيح", "عرض التصحيح"] or any(
                          skip in txt for skip in ["إضافة موضوع", "اتصل بنا", "سياسة الخصوصية", "حسابي", "منتدى", "طالع أيضًا", "حساب معدل"]
                      ):
                          continue

                      full_u = urllib.parse.unquote(urllib.parse.urljoin(unquoted_hub, href.replace(r"\/", "/")))
                      if full_u.rstrip("/") == unquoted_hub.rstrip("/") or full_u in seen_sub_urls:
                          continue

                      if is_bac_or_bem_hub and (full_u.lower().endswith(".pdf") or txt == "الموضوع"):
                          continue

                      context_txt = txt
                      if txt in ["الموضوع والتصحيح", "عرض الموضوع"] and a.parent:
                          card_box = a.find_parent(["li", "div", "tr", "article"]) or a.parent
                          context_txt = card_box.get_text(" ", strip=True)

                      sub_trim = detect_trimester_strict(full_u + " " + context_txt, fallback_trim=parent_meta["trimester"])
                      if parent_meta.get("has_trimester") and sub_trim != parent_meta["trimester"] and "رقم" not in context_txt:
                          continue

                      is_child_path = full_u.startswith(unquoted_hub.rstrip("/")) or any(k in full_u for k in ["/annales/", "/sujets/"])
                      has_study_word = any(
                          w in (context_txt + " " + full_u).lower()
                          for w in [
                              "اختبار", "إختبار", "فرض", "درس", "ملخص", "مذكرة", "موضوع", "نموذج", "رقم",
                              "كتاب", "بكالوريا", "شهادة", "exam", "test", "devoir", "sujet", ".pdf", "file="
                          ]
                      )
                      if is_child_path or has_study_word:
                          seen_sub_urls.add(full_u)
                          article_items.append((full_u, context_txt))

                  if article_items:
                      with ThreadPoolExecutor(max_workers=10) as executor:
                          futures = []
                          for sub_u, sub_txt in article_items:
                              if saved_total >= max_to_save or is_time_up():
                                  break
                              futures.append(
                                  executor.submit(process_single_article_url, sub_u, sub_txt, parent_meta)
                              )
                          for _ in as_completed(futures):
                              pass
                  else:
                      process_single_article_url(unquoted_hub, page_title, parent_meta)

              except Exception as e:
                  print("Error crawling URL:", unquoted_hub, e)

          user_urls = []
          extra_u = os.environ.get("EXTRA_URL", "").strip()
          if extra_u:
              for part in re.split(r'[\s,]+', extra_u):
                  if part.startswith("http") and part not in user_urls:
                      user_urls.append(part.strip())

          if os.path.exists("links.txt"):
              with open("links.txt", "r", encoding="utf-8") as lf:
                  for line in lf:
                      clean_l = line.strip()
                      if clean_l.startswith("http") and clean_l not in user_urls:
                          user_urls.append(clean_l)

          for u in user_urls:
              if saved_total >= max_to_save or is_time_up():
                  break
              crawl_hub_url(u)

          write_index_and_push(f"Harvest completed (+{saved_total} unique PDFs)")
          print("Finished harvest! Total new unique PDFs added:", saved_total)
