name: master-5-sites-harvester

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:
    inputs:
      site_choice:
        description: 'Site: ALL (كل المواقع), eddirasa, dzexams, dzmadrassa, bacdz, educationdz'
        required: true
        default: 'ALL'
      target_filter:
        description: 'Target: ALL (كل المستويات), bac, bem, 5eme, 3as, 2as, 1as, 4am, 3am, 2am, 1am, 5ap'
        required: true
        default: 'ALL'
      max_files_per_run:
        description: 'Max new PDFs to save in this run (e.g. 50)'
        required: true
        default: '50'
      extra_url:
        description: 'Optional: Paste any specific URL here'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  harvest-study-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Scraper Libraries
        run: pip install requests beautifulsoup4 pillow

      - name: Crawl All 5 Algerian Study Websites Into files/
        env:
          SITE_CHOICE: ${{ github.event.inputs.site_choice }}
          TARGET_FILTER: ${{ github.event.inputs.target_filter }}
          MAX_FILES: ${{ github.event.inputs.max_files_per_run }}
          EXTRA_URL: ${{ github.event.inputs.extra_url }}
        shell: python
        run: |
          import os
          import re
          import io
          import hashlib
          import urllib.parse
          import subprocess
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          os.makedirs("files", exist_ok=True)

          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
          }

          subprocess.run(["git", "config", "user.name", "StudyDZ-Harvester"], check=False)
          subprocess.run(["git", "config", "user.email", "bot@studydz.app"], check=False)

          def git_commit_and_push(msg):
              subprocess.run(["git", "add", "files/"], check=False)
              res = subprocess.run(["git", "diff", "--staged", "--quiet"])
              if res.returncode != 0:
                  subprocess.run(["git", "commit", "-m", msg], check=False)
                  subprocess.run(["git", "push"], check=False)

          try:
              max_to_save = int(os.environ.get("MAX_FILES", "50").strip() or "50")
          except Exception:
              max_to_save = 50

          site_choice = (os.environ.get("SITE_CHOICE", "ALL").strip() or "ALL").lower()
          target_filter = (os.environ.get("TARGET_FILTER", "ALL").strip() or "ALL").lower()

          level_rules = [
              ("1ap", ["الأولى ابتدائي", "اولى ابتدائي", "1 ابتدائي", "1 إبتدائي", "1ap"]),
              ("2ap", ["الثانية ابتدائي", "ثانية ابتدائي", "2 ابتدائي", "2 إبتدائي", "2ap"]),
              ("3ap", ["الثالثة ابتدائي", "ثالثة ابتدائي", "3 ابتدائي", "3 إبتدائي", "3ap"]),
              ("4ap", ["الرابعة ابتدائي", "رابعة ابتدائي", "4 ابتدائي", "4 إبتدائي", "4ap"]),
              ("5ap", ["الخامسة ابتدائي", "خامسة ابتدائي", "5 ابتدائي", "5 إبتدائي", "5ap"]),
              ("1am", ["الأولى متوسط", "اولى متوسط", "1 متوسط", "1am"]),
              ("2am", ["الثانية متوسط", "ثانية متوسط", "2 متوسط", "2am"]),
              ("3am", ["الثالثة متوسط", "ثالثة متوسط", "3 متوسط", "3am"]),
              ("4am", ["الرابعة متوسط", "رابعة متوسط", "4 متوسط", "4am"]),
              ("1as", ["الأولى ثانوي", "اولى ثانوي", "1 ثانوي", "1as"]),
              ("2as", ["الثانية ثانوي", "ثانية ثانوي", "2 ثانوي", "2as"]),
              ("3as", ["الثالثة ثانوي", "ثالثة ثانوي", "3 ثانوي", "3as"]),
          ]

          subject_rules = [
              ("science", ["العلوم الطبيعية", "علوم الطبيعة", "علوم طبيعية", "snv", "sciences", "sci"]),
              ("physics", ["العلوم الفيزيائية", "الفيزياء", "فيزياء", "physique", "phys"]),
              ("math", ["الرياضيات", "رياضيات", "mathematiques", "mathematics", "math"]),
              ("arabic", ["اللغة العربية", "الأدب العربي", "عربية", "arabe", "arabic"]),
              ("french", ["اللغة الفرنسية", "فرنسية", "francais", "french"]),
              ("english", ["اللغة الإنجليزية", "اللغة الانجليزية", "إنجليزية", "انجليزية", "anglais", "english"]),
              ("hisgeo", ["التاريخ والجغرافيا", "التاريخ و الجغرافيا", "تاريخ", "جغرافيا", "histoire", "hisgeo", "history"]),
              ("islamic", ["العلوم الإسلامية", "التربية الإسلامية", "التربية الاسلامية", "شريعة", "islamia", "islamic"]),
              ("philo", ["الفلسفة", "فلسفة", "philosophie", "philo"]),
              ("civics", ["التربية المدنية", "مدنية", "civique", "civics"]),
              ("cs", ["الإعلام الآلي", "الاعلام الالي", "معلوماتية", "informatique"]),
              ("accounting", ["التسيير المحاسبي", "محاسبة", "comptabilite", "gestion"]),
              ("economy", ["الاقتصاد والمناجمنت", "الإقتصاد والمناجمنت", "اقتصاد", "economie"]),
              ("law", ["القانون", "القانــــون", "droit", "law"]),
              ("engineering", ["الهندسة", "هندسة", "تكنولوجيا", "genie"]),
              ("amazigh", ["اللغة الأمازيغية", "أمازيغية", "امازيغية", "tamazight"]),
              ("third_lang", ["اللغة الإيطالية", "اللغة الإسبانية", "اللغة الألمانية", "اسبانية", "المانية", "ايطالية", "spanish", "german", "italian"]),
              ("art", ["التربية التشكيلية", "التربية الموسيقية", "تشكيلية", "موسيقية"]),
          ]

          stream_rules = [
              ("lp", ["آداب وفلسفة", "اداب وفلسفة", "آداب و فلسفة", "اداب و فلسفة", "literature-philosophy", "آداب-وفلسفة"]),
              ("se", ["علوم تجريبية", "العلوم التجريبية", "علوم-تجريبية", "/sciences/"]),
              ("tm", ["تقني رياضي", "التقني الرياضي", "تقني-رياضي", "tech-math"]),
              ("ge", ["تسيير واقتصاد", "تسيير و اقتصاد", "تسيير-واقتصاد", "management"]),
              ("le", ["لغات أجنبية", "لغات اجنبية", "لغات-أجنبية", "foreign-languages"]),
              ("mt", ["شعبة رياضيات", "شعبة الرياضيات", "/mathematics/"]),
          ]

          def analyze_metadata(text):
              t = text.lower()
              is_solution = any(
                  w in t
                  for w in ["التصحيح فقط", "تصحيح موضوع", "الحل النموذجي", "_sol", "-sol", "corrige"]
              )

              ym = re.search(r'(200[89]|201[0-9]|202[0-6])', t)
              year = ym.group(1) if ym else None

              archive_type = None
              if any(w in t for w in ["بكالوريا", "البكالوريا", "/bac-", "/bac/"]):
                  archive_type = "bac"
              elif any(w in t for w in ["شهادة التعليم المتوسط", "البيام", "بيام", "/bem-", "/bem/"]):
                  archive_type = "bem"
              elif any(w in t for w in ["شهادة التعليم الابتدائي", "شهادة التعليم الإبتدائي", "السانكيام", "5eme", "cinquieme"]):
                  archive_type = "5eme"

              level = "3as"
              for code, keys in level_rules:
                  if any(k in t for k in keys):
                      level = code
                      break

              subject = None
              for code, keys in subject_rules:
                  if any(k in t for k in keys):
                      subject = code
                      break

              stream = "se"
              for code, keys in stream_rules:
                  if any(k in t for k in keys):
                      stream = code
                      break

              trimester = "t1"
              if any(w in t for w in ["الفصل الثاني", "الثلاثي الثاني", "ف2", "t2", "2eme"]):
                  trimester = "t2"
              elif any(w in t for w in ["الفصل الثالث", "الثلاثي الثالث", "ف3", "t3", "3eme"]):
                  trimester = "t3"

              category = "exam"
              if any(w in t for w in ["كتاب", "الكتاب المدرسي", "livre", "book"]):
                  category = "book"
              elif any(w in t for w in ["ملخص", "ملخصات", "resume"]):
                  category = "resume"
              elif any(w in t for w in ["فرض", "فروض", "devoir", "test"]):
                  category = "test"
              elif any(w in t for w in ["درس", "دروس", "cours", "lesson"]):
                  category = "lesson"

              return {
                  "is_solution": is_solution,
                  "year": year,
                  "archive_type": archive_type,
                  "level": level,
                  "subject": subject,
                  "stream": stream,
                  "trimester": trimester,
                  "category": category,
              }

          def matches_user_filter(meta):
              if target_filter == "all":
                  return True
              if target_filter in ["bac", "bem", "5eme"]:
                  return meta["archive_type"] == target_filter
              return meta["level"] == target_filter

          def build_filename(meta, unique_tag=""):
              subj = meta["subject"] or "math"
              sfx = f"_{unique_tag}" if unique_tag else ""
              if meta["archive_type"] and meta["year"]:
                  if meta["archive_type"] == "bac":
                      return f"bac_{meta['year']}_{subj}_{meta['stream']}.pdf"
                  return f"{meta['archive_type']}_{meta['year']}_{subj}.pdf"

              if meta["category"] == "book":
                  return f"{meta['level']}_{subj}_book{sfx}.pdf"

              return f"{meta['level']}_{subj}_{meta['trimester']}_{meta['category']}{sfx}.pdf"

          def download_or_convert_to_pdf(page_url, out_filepath):
              if os.path.exists(out_filepath) and os.path.getsize(out_filepath) not in range(0, 1500):
                  return False

              try:
                  # 1. Check ?file= parameter (Eddirasa viewer)
                  parsed_q = urllib.parse.parse_qs(urllib.parse.urlparse(page_url).query)
                  if "file" in parsed_q:
                      direct_u = urllib.parse.urljoin(page_url, parsed_q["file"][0])
                      pr = requests.get(direct_u, headers=headers, timeout=25)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          with open(out_filepath, "wb") as f:
                              f.write(pr.content)
                          print("Saved viewer PDF:", out_filepath)
                          return True

                  # 2. Direct .pdf URL
                  if page_url.lower().split("?")[0].endswith(".pdf"):
                      pr = requests.get(page_url, headers=headers, timeout=25)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          with open(out_filepath, "wb") as f:
                              f.write(pr.content)
                          print("Saved direct PDF:", out_filepath)
                          return True

                  r = requests.get(page_url, headers=headers, timeout=25)
                  if r.status_code != 200:
                      return False
                  if r.content[:4] == b"%PDF":
                      with open(out_filepath, "wb") as f:
                          f.write(r.content)
                      print("Saved binary PDF:", out_filepath)
                      return True

                  soup = BeautifulSoup(r.text, "html.parser")

                  # 3. Search inside page for embedded PDFs, wp-content/uploads/*.pdf, or Google Drive
                  # Also check regex in raw HTML for hidden PDF links (used by Eddirasa / DzMadrassa / DzExams)
                  raw_pdf_matches = re.findall(r'https?://[^\s"\'\\]+?\.pdf', r.text, flags=re.IGNORECASE)
                  for pdf_candidate in raw_pdf_matches:
                      lower_cand = pdf_candidate.lower()
                      if any(cor_w in lower_cand for cor_w in ["cor", "sol", "تصحيح", "حل"]):
                          continue
                      pr = requests.get(pdf_candidate, headers=headers, timeout=25)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          with open(out_filepath, "wb") as f:
                              f.write(pr.content)
                          print("Saved regex-discovered PDF:", out_filepath)
                          return True

                  for tag in soup.find_all(["a", "iframe", "embed", "object"]):
                      raw_link = tag.get("href") or tag.get("src") or tag.get("data") or ""
                      if not raw_link:
                          continue
                      tag_text = tag.get_text(" ", strip=True)
                      if any(cor_w in tag_text for cor_w in ["التصحيح", "تصحيح", "الحل"]):
                          continue

                      full_link = urllib.parse.urljoin(page_url, raw_link)

                      sub_q = urllib.parse.parse_qs(urllib.parse.urlparse(full_link).query)
                      if "file" in sub_q:
                          pdf_u = urllib.parse.urljoin(full_link, sub_q["file"][0])
                          pr = requests.get(pdf_u, headers=headers, timeout=25)
                          if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                              with open(out_filepath, "wb") as f:
                                  f.write(pr.content)
                              print("Saved embedded viewer PDF:", out_filepath)
                              return True

                      if ".pdf" in full_link.lower() and "docs.google.com" not in full_link.lower():
                          pr = requests.get(full_link, headers=headers, timeout=25)
                          if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                              with open(out_filepath, "wb") as f:
                                  f.write(pr.content)
                              print("Saved linked PDF:", out_filepath)
                              return True

                      gd_match = (
                          re.search(r'/file/d/([a-zA-Z0-9_-]+)', full_link)
                          or re.search(r'[?&]id=([a-zA-Z0-9_-]+)', full_link)
                      )
                      if gd_match:
                          fid = gd_match.group(1)
                          dl_u = f"https://drive.google.com/uc?export=download&id={fid}"
                          pr = requests.get(dl_u, headers=headers, timeout=25)
                          if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                              with open(out_filepath, "wb") as f:
                                  f.write(pr.content)
                              print("Saved Google Drive PDF:", out_filepath)
                              return True

                  # 4. Fallback: Convert scanned exam images inside the page into a single clean PDF
                  content_box = (
                      soup.find("div", class_=re.compile(r"entry-content|post-content|article|main"))
                      or soup
                  )
                  pil_imgs = []
                  for img in content_box.find_all("img"):
                      src = img.get("data-src") or img.get("src") or ""
                      if not src or any(
                          skip in src.lower()
                          for skip in ["logo", "avatar", "icon", "gravatar", "emoji", "banner", "ads", "button"]
                      ):
                          continue
                      src = urllib.parse.urljoin(page_url, src)
                      try:
                          ir = requests.get(src, headers=headers, timeout=20)
                          if ir.status_code == 200:
                              im = Image.open(io.BytesIO(ir.content)).convert("RGB")
                              w, h = im.size
                              if w not in range(0, 380) and h not in range(0, 380):
                                  pil_imgs.append(im)
                      except Exception:
                          pass

                  if pil_imgs:
                      pil_imgs[0].save(
                          out_filepath,
                          "PDF",
                          resolution=100.0,
                          save_all=True,
                          append_images=pil_imgs[1:],
                      )
                      print("Converted exam images to PDF:", out_filepath)
                      return True

              except Exception as e:
                  print("Error on:", page_url, e)
              return False

          saved_total = 0

          def harvest_wordpress_api(domain_url):
              global saved_total
              for page_num in range(1, 6):
                  if saved_total not in range(0, max_to_save):
                      return
                  api_u = f"{domain_url}/wp-json/wp/v2/posts?per_page=30&page={page_num}"
                  print("Querying WP API:", api_u)
                  try:
                      r = requests.get(api_u, headers=headers, timeout=20)
                      if r.status_code != 200:
                          break
                      posts = r.json()
                      if not isinstance(posts, list) or not posts:
                          break
                      for p in posts:
                          if saved_total not in range(0, max_to_save):
                              return
                          link = p.get("link", "")
                          title_html = p.get("title", {}).get("rendered", "")
                          content_html = p.get("content", {}).get("rendered", "")
                          combined = title_html + " " + urllib.parse.unquote(link)
                          meta = analyze_metadata(combined)

                          if meta["is_solution"] or not meta["subject"]:
                              continue
                          if not matches_user_filter(meta):
                              continue

                          short_id = str(p.get("id", ""))[-4:]
                          fname = build_filename(meta, short_id)
                          out_p = os.path.join("files", fname)

                          # Check if direct PDF is already in content_html
                          pdf_in_post = re.findall(r'https?://[^\s"\'\\]+?\.pdf', content_html, flags=re.IGNORECASE)
                          got_it = False
                          for pdf_u in pdf_in_post:
                              if any(cw in pdf_u.lower() for cw in ["cor", "sol"]):
                                  continue
                              if download_or_convert_to_pdf(pdf_u, out_p):
                                  saved_total += 1
                                  got_it = True
                                  break

                          if not got_it and link:
                              if download_or_convert_to_pdf(link, out_p):
                                  saved_total += 1

                          if saved_total != 0 and saved_total % 10 == 0:
                              git_commit_and_push(f"Auto-harvested {saved_total} study PDFs")
                  except Exception as e:
                      print("WP API note:", e)
                      break

          def harvest_eddirasa_archives():
              global saved_total
              eddirasa_streams = [
                  ("se", "sciences"),
                  ("mt", "mathematics"),
                  ("tm", "tech-math"),
                  ("ge", "management-economics"),
                  ("lp", "literature-philosophy"),
                  ("le", "foreign-languages"),
              ]
              # 1. Eddirasa BAC 2008..2026
              for yr in range(2026, 2007, -1):
                  if saved_total not in range(0, max_to_save):
                      return
                  for st_code, st_slug in eddirasa_streams:
                      if saved_total not in range(0, max_to_save):
                          return
                      hub_url = f"https://eddirasa.com/ens-sec/3as/bac-solutions/bac-{yr}/{st_slug}/"
                      try:
                          r = requests.get(hub_url, headers=headers, timeout=15)
                          if r.status_code != 200:
                              continue
                          soup = BeautifulSoup(r.text, "html.parser")
                          for a in soup.find_all("a"):
                              if saved_total not in range(0, max_to_save):
                                  return
                              href = a.get("href") or ""
                              txt = a.get_text(" ", strip=True)
                              if not href or "تصحيح" in txt:
                                  continue
                              full_u = urllib.parse.urljoin(hub_url, href)
                              meta = analyze_metadata(f"بكالوريا {yr} {txt} {full_u}")
                              meta["archive_type"] = "bac"
                              meta["year"] = str(yr)
                              meta["stream"] = st_code
                              if not meta["subject"] or not matches_user_filter(meta):
                                  continue
                              fname = build_filename(meta)
                              if download_or_convert_to_pdf(full_u, os.path.join("files", fname)):
                                  saved_total += 1
                      except Exception:
                          pass

              # 2. Eddirasa BEM 2008..2026
              for yr in range(2026, 2007, -1):
                  if saved_total not in range(0, max_to_save):
                      return
                  bem_url = f"https://eddirasa.com/ens-cm/4am/bem-solutions/bem-{yr}/"
                  try:
                      r = requests.get(bem_url, headers=headers, timeout=15)
                      if r.status_code != 200:
                          continue
                      soup = BeautifulSoup(r.text, "html.parser")
                      for a in soup.find_all("a"):
                          if saved_total not in range(0, max_to_save):
                              return
                          href = a.get("href") or ""
                          txt = a.get_text(" ", strip=True)
                          if not href or "تصحيح" in txt:
                              continue
                          full_u = urllib.parse.urljoin(bem_url, href)
                          meta = analyze_metadata(f"شهادة التعليم المتوسط {yr} {txt} {full_u}")
                          meta["archive_type"] = "bem"
                          meta["year"] = str(yr)
                          if not meta["subject"] or not matches_user_filter(meta):
                              continue
                          fname = build_filename(meta)
                          if download_or_convert_to_pdf(full_u, os.path.join("files", fname)):
                              saved_total += 1
                  except Exception:
                      pass

          def harvest_deep_hub(hub_url):
              global saved_total
              print("Deep crawling hub:", hub_url)
              try:
                  r = requests.get(hub_url, headers=headers, timeout=20)
                  if r.status_code != 200:
                      return
                  soup = BeautifulSoup(r.text, "html.parser")
                  page_title = soup.title.string if soup.title else ""

                  visited_sub = set()
                  for a in soup.find_all("a"):
                      if saved_total not in range(0, max_to_save):
                          return
                      href = a.get("href") or ""
                      a_text = a.get_text(" ", strip=True)
                      if not href or href.startswith("#") or href.startswith("javascript"):
                          continue
                      if any(skip in a_text for skip in ["التصحيح", "تصحيح", "منتدى", "حسابي", "اتصل"]):
                          continue

                      full_u = urllib.parse.urljoin(hub_url, href)
                      if full_u in visited_sub:
                          continue
                      visited_sub.add(full_u)

                      combined = page_title + " " + a_text + " " + urllib.parse.unquote(full_u)
                      meta = analyze_metadata(combined)
                      if not meta["subject"] or not matches_user_filter(meta):
                          continue

                      short_hash = hashlib.md5(full_u.encode()).hexdigest()[:4]
                      fname = build_filename(meta, short_hash)
                      if download_or_convert_to_pdf(full_u, os.path.join("files", fname)):
                          saved_total += 1
                          if saved_total % 10 == 0:
                              git_commit_and_push(f"Auto-harvested {saved_total} study PDFs")
              except Exception as e:
                  print("Hub note:", hub_url, e)

          # 1. Process any extra URL or links.txt first
          extra_u = os.environ.get("EXTRA_URL", "").strip()
          if extra_u.startswith("http"):
              harvest_deep_hub(extra_u)

          if os.path.exists("links.txt"):
              with open("links.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      u = line.strip()
                      if u.startswith("http"):
                          harvest_deep_hub(u)

          # 2. Run Pre-Programmed Harvesters for the 5 Algerian Study Websites
          if site_choice in ["all", "eddirasa"]:
              harvest_eddirasa_archives()
              harvest_wordpress_api("https://eddirasa.com")

          if site_choice in ["all", "bacdz"]:
              harvest_wordpress_api("https://bacdz.net")

          if site_choice in ["all", "educationdz"]:
              harvest_wordpress_api("https://educationdz.com")

          if site_choice in ["all", "dzexams"]:
              dzexams_levels = ["1ap", "2ap", "3ap", "4ap", "5ap", "1am", "2am", "3am", "4am", "1as", "2as", "3as"]
              dzexams_subjs = ["mathematiques", "arabe", "physique", "sciences-naturelles", "francais", "anglais", "histoire-geographie", "sciences-islamiques"]
              for lv in dzexams_levels:
                  if target_filter not in ["all", lv]:
                      continue
                  for sb in dzexams_subjs:
                      if saved_total not in range(0, max_to_save):
                          break
                      harvest_deep_hub(f"https://www.dzexams.com/ar/{lv}/{sb}")

          if site_choice in ["all", "dzmadrassa"]:
              harvest_deep_hub("https://dzmadrassa.com/")

          git_commit_and_push(f"Completed harvest run ({saved_total} new PDFs added)")
          print("Finished! Total new PDFs added to files/:", saved_total)
