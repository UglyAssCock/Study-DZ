name: master-5-sites-harvester

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:
    inputs:
      extra_url:
        description: 'Paste 1 or more specific URLs here (optional, separated by spaces or commas)'
        required: false
        default: ''
      site_choice:
        description: 'Used when extra_url is empty: ALL, eddirasa, dzexams, dzmadrassa, bacdz, educationdz'
        required: true
        default: 'ALL'
      target_filter:
        description: 'Target: ALL, bac, bem, 5eme, 3as, 2as, 1as, 4am, 3am, 2am, 1am, 5ap, 4ap, 3ap, 2ap, 1ap'
        required: true
        default: 'ALL'
      max_files_per_run:
        description: 'Max new PDFs to save in this run (e.g. 400)'
        required: true
        default: '400'

permissions:
  contents: write

jobs:
  harvest-study-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Scraper and PDF Merger Libraries
        run: pip install requests beautifulsoup4 pillow lxml pypdf

      - name: Restore Elementary Files, Clean Duplicates, and Harvest
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_CHOICE: ${{ github.event.inputs.site_choice }}
          TARGET_FILTER: ${{ github.event.inputs.target_filter }}
          MAX_FILES: ${{ github.event.inputs.max_files_per_run }}
          EXTRA_URL: ${{ github.event.inputs.extra_url }}
        shell: python
        run: |
          import os
          import re
          import io
          import time
          import hashlib
          import threading
          import urllib.parse
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from pypdf import PdfReader, PdfWriter

          start_time = time.time()
          MAX_RUNTIME_SECONDS = 32 * 60

          def is_time_up():
              return (time.time() - start_time) > MAX_RUNTIME_SECONDS

          os.makedirs("files", exist_ok=True)
          visited_file = "files/visited_hashes.txt"
          content_hashes_file = "files/content_hashes.txt"

          visited_hashes = set()
          content_hashes = set()
          seen_canonical_names = set()
          seen_archive_keys = set()

          if os.path.exists(visited_file):
              with open(visited_file, "r", encoding="utf-8") as vf:
                  for line in vf:
                      h = line.strip()
                      if h:
                          visited_hashes.add(h)

          subprocess.run(["git", "config", "user.name", "StudyDZ-Harvester"], check=False)
          subprocess.run(["git", "config", "user.email", "bot@studydz.app"], check=False)

          lock = threading.Lock()
          saved_total = 0

          def write_index_and_push(msg):
              with lock:
                  all_rel_pdfs = []
                  for r_dir, _, f_list in os.walk("files"):
                      for fn in sorted(f_list):
                          if fn.lower().endswith(".pdf"):
                              all_rel_pdfs.append(os.path.join(r_dir, fn).replace("\\", "/"))
                  with open("files/index.txt", "w", encoding="utf-8") as idx_f:
                      idx_f.write("\n".join(all_rel_pdfs))
                  subprocess.run(["git", "pull", "--rebase", "--autostash"], check=False)
                  subprocess.run(["git", "add", "-A", "files/"], check=False)
                  res = subprocess.run(["git", "diff", "--staged", "--quiet"])
                  if res.returncode != 0:
                      subprocess.run(["git", "commit", "-m", msg], check=False)
                      subprocess.run(["git", "push"], check=False)

          # =====================================================================
          # STEP 0: AUTOMATICALLY RESTORE ANY DELETED ELEMENTARY SCHOOL PDFS
          # =====================================================================
          restored_count = 0
          try:
              log_out = subprocess.check_output(
                  ["git", "log", "--diff-filter=D", "--name-only", "--pretty=format:__COMMIT__%H", "-n", "40"],
                  text=True
              )
              curr_commit = None
              commit_to_files = {}
              for line in log_out.splitlines():
                  line = line.strip()
                  if line.startswith("__COMMIT__"):
                      curr_commit = line.replace("__COMMIT__", "").strip()
                  elif curr_commit and line.lower().endswith(".pdf"):
                      fn_low = os.path.basename(line).lower()
                      is_elem = fn_low.startswith(("1ap_", "2ap_", "3ap_", "4ap_", "5ap_", "5eme_")) or any(
                          f"/{fld}/" in line.lower() for fld in ["1ap", "2ap", "3ap", "4ap", "5ap", "5eme"]
                      )
                      if is_elem and not os.path.exists(line):
                          commit_to_files.setdefault(curr_commit, []).append(line)

              for c_hash, file_list in commit_to_files.items():
                  # Restore in batches of 50 files for speed
                  for i in range(0, len(file_list), 50):
                      batch = [f for f in file_list[i:i+50] if not os.path.exists(f)]
                      if batch:
                          res = subprocess.run(["git", "checkout", f"{c_hash}~1", "--"] + batch, check=False)
                          if res.returncode == 0:
                              restored_count += len(batch)
          except Exception as e:
              print("Restore check warning:", e)

          if restored_count > 0:
              print(f"Restored {restored_count} Elementary School PDFs from Git history!")
              write_index_and_push(f"Restored {restored_count} Elementary School PDFs")

          # =====================================================================
          # STEP 1: CLEAN DUPLICATES AND WRONG-STREAM HIGH SCHOOL FILES ONLY
          # =====================================================================
          valid_streams = {"se", "mt", "tm", "ge", "lp", "le", "tc_st", "tc_l"}
          cleaned_count = 0

          all_pdfs = []
          for root, _, fnames in os.walk("files"):
              for fn in sorted(fnames):
                  if fn.lower().endswith(".pdf"):
                      all_pdfs.append(os.path.join(root, fn))

          all_pdfs.sort(key=lambda p: (0 if "_merged.pdf" in p.lower() else 1, len(p)))

          for p in all_pdfs:
              if not os.path.exists(p):
                  continue
              fn = os.path.basename(p)
              lower_fn = fn.lower()
              try:
                  # Only check stream tags on High School files (1as, 2as, 3as) — NEVER touch 1ap-5ap!
                  if lower_fn.startswith(("1as_", "2as_", "3as_")):
                      parts = lower_fn.replace(".pdf", "").split("_")
                      has_stream = any(st in parts for st in valid_streams) or ("tc" in parts and ("st" in parts or "l" in parts))
                      if not has_stream:
                          os.remove(p)
                          cleaned_count += 1
                          continue

                  if lower_fn.startswith(("bac_", "bem_", "5eme_")):
                      m = re.match(r'^(bac_\d{4}_[a-z0-9]+_[a-z0-9]+|bem_\d{4}_[a-z0-9]+|5eme_\d{4}_[a-z0-9]+)', lower_fn)
                      if not m or any(k in lower_fn for k in ["_sol.", "_cor.", "_corrige."]):
                          os.remove(p)
                          cleaned_count += 1
                          continue
                      canonical_key = m.group(1)
                      if canonical_key in seen_archive_keys:
                          os.remove(p)
                          cleaned_count += 1
                          continue
                      seen_archive_keys.add(canonical_key)

                  with open(p, "rb") as pf:
                      raw = pf.read()
                  if len(raw) < 1500 or raw[:4] != b"%PDF":
                      os.remove(p)
                      cleaned_count += 1
                      continue

                  md5_h = hashlib.md5(raw).hexdigest()
                  if md5_h in content_hashes or lower_fn in seen_canonical_names:
                      os.remove(p)
                      cleaned_count += 1
                      continue

                  content_hashes.add(md5_h)
                  seen_canonical_names.add(lower_fn)
              except Exception:
                  pass

          with open(content_hashes_file, "w", encoding="utf-8") as cf:
              for h in sorted(content_hashes):
                  cf.write(h + "\n")

          # Always write files/index.txt at startup so the app immediately sees all restored files
          write_index_and_push(f"Synced index ({len(content_hashes)} total unique PDFs)")

          # =====================================================================
          # STEP 2: METADATA RULES & STRICT CLASSIFICATION (ALL 3 CYCLES)
          # =====================================================================
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36"
          }

          try:
              max_to_save = int(os.environ.get("MAX_FILES", "400").strip() or "400")
          except Exception:
              max_to_save = 400

          def url_hash(u):
              return hashlib.md5(u.strip().encode("utf-8")).hexdigest()[:12]

          def is_visited(u):
              h = url_hash(u)
              with lock:
                  return h in visited_hashes

          def mark_visited(u):
              h = url_hash(u)
              with lock:
                  if h not in visited_hashes:
                      visited_hashes.add(h)
                      with open(visited_file, "a", encoding="utf-8") as vf:
                          vf.write(h + "\n")

          def merge_two_pdfs_bytes(subject_bytes, correction_bytes):
              try:
                  writer = PdfWriter()
                  r1 = PdfReader(io.BytesIO(subject_bytes))
                  for page in r1.pages:
                      writer.add_page(page)
                  r2 = PdfReader(io.BytesIO(correction_bytes))
                  for page in r2.pages:
                      writer.add_page(page)
                  out = io.BytesIO()
                  writer.write(out)
                  merged = out.getvalue()
                  return merged if len(merged) >= 1500 else subject_bytes
              except Exception:
                  return subject_bytes

          def register_unique_pdf_bytes(raw_bytes, out_filepath):
              if not out_filepath or len(raw_bytes) < 1500 or raw_bytes[:4] != b"%PDF":
                  return False
              md5_hex = hashlib.md5(raw_bytes).hexdigest()
              base_name = os.path.basename(out_filepath).lower()

              arch_m = re.match(r'^(bac_\d{4}_[a-z0-9]+_[a-z0-9]+|bem_\d{4}_[a-z0-9]+|5eme_\d{4}_[a-z0-9]+)', base_name)
              arch_key = arch_m.group(1) if arch_m else None

              with lock:
                  if md5_hex in content_hashes:
                      return False
                  if arch_key and arch_key in seen_archive_keys:
                      return False
                  if not arch_key and (base_name in seen_canonical_names or os.path.exists(out_filepath)):
                      stem, ext = os.path.splitext(out_filepath)
                      out_filepath = f"{stem}_{md5_hex[:4]}{ext}"
                      base_name = os.path.basename(out_filepath).lower()

                  os.makedirs(os.path.dirname(out_filepath), exist_ok=True)
                  with open(out_filepath, "wb") as f:
                      f.write(raw_bytes)
                  content_hashes.add(md5_hex)
                  seen_canonical_names.add(base_name)
                  if arch_key:
                      seen_archive_keys.add(arch_key)
                  with open(content_hashes_file, "a", encoding="utf-8") as cf:
                      cf.write(md5_hex + "\n")
              print("Saved unique PDF:", out_filepath)
              return True

          level_rules = [
              ("1ap", ["first-primary", "1ere-primaire", "الأولى ابتدائي", "اولى ابتدائي", "1 ابتدائي", "سنة أولى ابتدائي", "/1ap/"]),
              ("2ap", ["second-primary", "2eme-primaire", "الثانية ابتدائي", "ثانية ابتدائي", "2 ابتدائي", "سنة ثانية ابتدائي", "/2ap/"]),
              ("3ap", ["third-primary", "3eme-primaire", "الثالثة ابتدائي", "ثالثة ابتدائي", "3 ابتدائي", "سنة ثالثة ابتدائي", "/3ap/"]),
              ("4ap", ["fourth-primary", "4eme-primaire", "الرابعة ابتدائي", "رابعة ابتدائي", "4 ابتدائي", "سنة رابعة ابتدائي", "/4ap/"]),
              ("5ap", ["fifth-primary", "5eme-primaire", "الخامسة ابتدائي", "خامسة ابتدائي", "5 ابتدائي", "سنة خامسة ابتدائي", "/5ap/"]),
              ("1am", ["first-middle", "first-medium", "first-am", "1ere-moyen", "الأولى متوسط", "اولى متوسط", "1 متوسط", "سنة أولى متوسط", "/1am/"]),
              ("2am", ["second-middle", "second-medium", "second-am", "2eme-moyen", "الثانية متوسط", "ثانية متوسط", "2 متوسط", "سنة ثانية متوسط", "/2am/"]),
              ("3am", ["third-middle", "third-medium", "third-am", "3eme-moyen", "الثالثة متوسط", "ثالثة متوسط", "3 متوسط", "سنة ثالثة متوسط", "/3am/"]),
              ("4am", ["fourth-middle", "fourth-medium", "fourth-am", "4eme-moyen", "الرابعة متوسط", "رابعة متوسط", "4 متوسط", "سنة رابعة متوسط", "/4am/"]),
              ("1as", ["first-secondary", "first-as", "1ere-secondaire", "الأولى ثانوي", "اولى ثانوي", "1 ثانوي", "سنة أولى ثانوي", "/1as/"]),
              ("2as", ["second-secondary", "second-as", "2eme-secondaire", "الثانية ثانوي", "ثانية ثانوي", "2 ثانوي", "سنة ثانية ثانوي", "/2as/"]),
              ("3as", ["third-secondary", "third-as", "3eme-secondaire", "الثالثة ثانوي", "ثالثة ثانوي", "3 ثانوي", "سنة ثالثة ثانوي", "/3as/"]),
          ]

          subject_url_slugs = [
              ("math", ["/maths/", "/math/", "/mathematiques"]),
              ("physics", ["/physics/", "/physique", "/phys/"]),
              ("science", ["natural-sciences", "sciences-naturelles", "primary/sciences", "1am/sciences", "2am/sciences", "3am/sciences", "4am/sciences", "1as/sciences", "2as/sciences", "3as/sciences"]),
              ("arabic", ["/arabic/", "/arabe"]),
              ("french", ["/francais", "/french/"]),
              ("english", ["/english/", "/anglais"]),
              ("hisgeo", ["history-geography", "histoire-geographie", "/history/", "/histoire"]),
              ("islamic", ["islamic-education", "sciences-islamiques", "/islamic/", "/islamia"]),
              ("philo", ["/philosophy/", "/philosophie", "/philo/"]),
              ("civics", ["civic-education", "education-civique", "/civic/", "/civics/"]),
              ("cs", ["computer-science", "/informatique"]),
              ("accounting", ["/accounting/", "/comptabilite", "/gestion"]),
              ("economy", ["/economics/", "/economie"]),
              ("law", ["/droit", "/law/"]),
              ("engineering", ["civil-engineering", "electrical-engineering", "mechanical-engineering", "process-engineering", "/engineering/", "genie-civil", "genie-electrique", "genie-mecanique", "genie-des-procedes", "/technologie"]),
              ("amazigh", ["/amazigh/", "/tamazight"]),
              ("third_lang", ["/espagnol", "/allemand", "/italien", "/spanish/", "/german/", "/italian/"]),
              ("art", ["art-education", "music-education"]),
          ]

          subject_text_rules = [
              ("math", ["الرياضيات", "رياضيات"]),
              ("physics", ["العلوم الفيزيائية", "الفيزياء", "فيزياء"]),
              ("science", ["العلوم الطبيعية", "علوم الطبيعة", "علوم طبيعية", "التربية العلمية"]),
              ("arabic", ["اللغة العربية", "الأدب العربي"]),
              ("french", ["اللغة الفرنسية", "فرنسية"]),
              ("english", ["اللغة الإنجليزية", "اللغة الانجليزية", "إنجليزية", "انجليزية"]),
              ("hisgeo", ["التاريخ والجغرافيا", "التاريخ و الجغرافيا"]),
              ("islamic", ["العلوم الإسلامية", "التربية الإسلامية", "التربية الاسلامية", "شريعة"]),
              ("philo", ["الفلسفة", "فلسفة"]),
              ("civics", ["التربية المدنية", "مدنية"]),
              ("cs", ["الإعلام الآلي", "الاعلام الالي", "معلوماتية"]),
              ("accounting", ["التسيير المحاسبي", "محاسبة"]),
              ("economy", ["الاقتصاد والمناجمنت", "الإقتصاد والمناجمنت"]),
              ("law", ["القانون"]),
              ("engineering", ["الهندسة المدنية", "الهندسة الكهربائية", "الهندسة الميكانيكية", "هندسة الطرائق", "التكنولوجيا", "تكنولوجيا"]),
              ("amazigh", ["اللغة الأمازيغية", "أمازيغية", "امازيغية"]),
              ("third_lang", ["اللغة الإيطالية", "اللغة الإسبانية", "اللغة الألمانية", "اسبانية", "المانية", "ايطالية"]),
              ("art", ["التربية التشكيلية", "التربية الموسيقية", "التربية الفنية"]),
          ]

          stream_rules = [
              ("tc_l", ["جذع مشترك آداب", "ج م آ", "ج.م.آ", "literary-1as"]),
              ("tc_st", ["جذع مشترك علوم", "ج م ع", "ج.م.ع", "science-1as"]),
              ("lp", ["آداب وفلسفة", "اداب وفلسفة", "آداب و فلسفة", "شعب أدبية", "أدبي", "exams-literary", "tests-literary", "literature-philosophy", "آداب-وفلسفة", "lettres"]),
              ("ge", ["تسيير واقتصاد", "تسيير و اقتصاد", "exams-management", "tests-management", "management-economics", "تسيير-واقتصاد", "management"]),
              ("tm", ["تقني رياضي", "التقني الرياضي", "هندسة مدنية", "هندسة كهربائية", "هندسة ميكانيكية", "هندسة الطرائق", "technical-mathematics", "تقني-رياضي", "tech-math", "genie-"]),
              ("le", ["لغات أجنبية", "لغات اجنبية", "إسبانية", "ألمانية", "إيطالية", "foreign-languages", "لغات-أجنبية", "langues", "espagnol", "allemand", "italien"]),
              ("mt", ["شعبة رياضيات", "شعبة الرياضيات", "exams-math", "tests-math", "/mathematics/"]),
              ("se", ["علوم تجريبية", "العلوم التجريبية", "شعب علمية", "علمي", "exams-science", "tests-science", "علوم-تجريبية", "/bac-20", "/sciences/"]),
          ]

          def detect_trimester_strict(text, fallback_trim="t1"):
              t = text.lower()
              if any(w in t for w in ["term-3", "trimestre-3", "3-trimestre", "3eme-trimestre", "_t3", "-t3", "/t3/"]):
                  return "t3"
              if any(w in t for w in ["term-2", "trimestre-2", "2-trimestre", "2eme-trimestre", "_t2", "-t2", "/t2/"]):
                  return "t2"
              if any(w in t for w in ["term-1", "trimestre-1", "1-trimestre", "1er-trimestre", "_t1", "-t1", "/t1/"]):
                  return "t1"
              if any(w in t for w in ["الفصل الثالث", "الثلاثي الثالث", "فصل 3", "الفصل 3"]):
                  return "t3"
              if any(w in t for w in ["الفصل الثاني", "الثلاثي الثاني", "فصل 2", "الفصل 2"]):
                  return "t2"
              if any(w in t for w in ["الفصل الأول", "الفصل الاول", "الثلاثي الأول", "فصل 1", "الفصل 1"]):
                  return "t1"
              return fallback_trim

          def detect_category_strict(text, fallback_cat="exam"):
              t = text.lower()
              for slogan in ["دروس وفروض واختبارات", "فروض واختبارات", "دروس مفصلة", "موقع الدراسة", "تمارين مع الحل"]:
                  t = t.replace(slogan, " ")

              if any(w in t for w in ["/books", "/book", "/livres", "/manuel"]):
                  return "book"
              if any(w in t for w in ["/summaries", "/summary", "/resumes", "/resume"]):
                  return "resume"
              if any(w in t for w in ["/lessons", "/lesson", "/cours"]):
                  return "lesson"
              if any(w in t for w in ["/tests-", "/tests/", "/devoirs"]):
                  return "test"
              if any(w in t for w in ["/exams-", "/exams/", "/examens"]):
                  return "exam"

              if any(w in t for w in ["الكتاب المدرسي", "كتاب ", "كتب "]):
                  return "book"
              if any(w in t for w in ["ملخص", "ملخصات"]):
                  return "resume"
              if any(w in t for w in ["درس ", "دروس ", "مذكرة ", "مذكرات "]):
                  return "lesson"
              if any(w in t for w in ["فرض ", "فروض "]):
                  return "test"
              if any(w in t for w in ["اختبار", "إختبار", "امتحان"]):
                  return "exam"
              return fallback_cat

          def analyze_metadata(text, parent_meta=None):
              t = text.lower()
              for slogan in ["دروس وفروض واختبارات", "موقع الدراسة الجزائري"]:
                  t = t.replace(slogan, " ")

              is_solution = any(
                  w in t
                  for w in ["التصحيح فقط", "تصحيح موضوع", "_sol.", "-sol.", "corrige-"]
              )

              has_trimester = any(
                  w in t
                  for w in [
                      "term-1", "term-2", "term-3",
                      "trimestre-1", "trimestre-2", "trimestre-3",
                      "الفصل الأول", "الفصل الاول", "الفصل الثاني", "الفصل الثالث",
                      "الثلاثي الأول", "الثلاثي الثاني", "الثلاثي الثالث",
                  ]
              )

              archive_type = None
              if not has_trimester and not (parent_meta and parent_meta.get("has_trimester")):
                  if any(w in t for w in ["بكالوريا", "البكالوريا", "/bac-", "/bac/", "bac-solutions"]):
                      archive_type = "bac"
                  elif any(w in t for w in ["شهادة التعليم المتوسط", "البيام", "/bem-", "/bem/", "bem-solutions"]):
                      archive_type = "bem"
                  elif any(w in t for w in ["شهادة التعليم الابتدائي", "السانكيام", "/5eme-", "/5eme/", "cinquieme"]):
                      archive_type = "5eme"

              ym = re.search(r'(200[89]|201[0-9]|202[0-6])', t)
              year = ym.group(1) if (ym and archive_type) else (parent_meta.get("year") if (parent_meta and archive_type) else None)

              level = None
              for code, keys in level_rules:
                  if any(k in t for k in keys):
                      level = code
                      break

              if not level:
                  if parent_meta and parent_meta.get("level"):
                      level = parent_meta["level"]
                  elif archive_type == "bac":
                      level = "3as"
                  elif archive_type == "bem":
                      level = "4am"
                  elif archive_type == "5eme":
                      level = "5ap"
                  else:
                      level = "3as"

              subject = None
              for code, slugs in subject_url_slugs:
                  if any(s in t for s in slugs):
                      subject = code
                      break
              if not subject:
                  for code, words in subject_text_rules:
                      if any(w in t for w in words):
                          subject = code
                          break
              if not subject and parent_meta:
                  subject = parent_meta.get("subject")

              stream = parent_meta.get("stream") if parent_meta else None
              for code, keys in stream_rules:
                  if code == "se" and "/bac-20" in keys:
                      if any(k in t for k in ["علوم تجريبية", "العلوم التجريبية", "شعب علمية", "علمي", "exams-science", "tests-science", "علوم-تجريبية"]) or re.search(r'/bac-20\d\d/sciences/', t):
                          stream = "se"
                          break
                  elif any(k in t for k in keys):
                      stream = code
                      break

              if not stream and level in ["1as", "2as", "3as"]:
                  if subject in ["accounting", "economy", "law"]:
                      stream = "ge"
                  elif subject == "engineering":
                      stream = "tc_st" if level == "1as" else "tm"
                  elif subject == "third_lang":
                      stream = "le"
                  elif subject == "science":
                      stream = "tc_st" if level == "1as" else "se"
                  elif level == "1as":
                      stream = "tc_st"

              fallback_t = parent_meta.get("trimester", "t1") if parent_meta else "t1"
              trimester = detect_trimester_strict(t, fallback_trim=fallback_t)

              fallback_c = parent_meta.get("category", "exam") if parent_meta else "exam"
              category = detect_category_strict(t, fallback_cat=fallback_c)

              return {
                  "skip": False,
                  "is_solution": is_solution,
                  "has_trimester": has_trimester or (parent_meta.get("has_trimester", False) if parent_meta else False),
                  "year": year,
                  "archive_type": archive_type,
                  "level": level,
                  "subject": subject,
                  "stream": stream,
                  "trimester": trimester,
                  "category": category,
              }

          def build_filepath(meta, unique_tag=""):
              if meta.get("skip"):
                  return None
              subj = meta["subject"] or "math"
              if meta["archive_type"] and meta["year"]:
                  folder = os.path.join("files", meta["archive_type"])
                  os.makedirs(folder, exist_ok=True)
                  if meta["archive_type"] == "bac":
                      st = meta.get("stream") or "se"
                      return os.path.join(folder, f"bac_{meta['year']}_{subj}_{st}_merged.pdf")
                  return os.path.join(folder, f"{meta['archive_type']}_{meta['year']}_{subj}_merged.pdf")

              if meta["level"] in ["1as", "2as", "3as"]:
                  if not meta.get("stream"):
                      return None
                  stream_part = f"_{meta['stream']}"
              else:
                  stream_part = ""

              sfx = f"_{unique_tag}" if unique_tag else ""
              folder = os.path.join("files", meta["level"])
              os.makedirs(folder, exist_ok=True)
              if meta["category"] == "book":
                  return os.path.join(folder, f"{meta['level']}_{subj}{stream_part}_book{sfx}.pdf")

              return os.path.join(folder, f"{meta['level']}_{subj}{stream_part}_{meta['trimester']}_{meta['category']}{sfx}.pdf")

          def extract_direct_pdf_url(raw_link, base_url):
              if not raw_link or raw_link.startswith("#") or raw_link.startswith("javascript"):
                  return None
              full_link = urllib.parse.urljoin(base_url, raw_link.replace(r"\/", "/"))
              sub_q = urllib.parse.parse_qs(urllib.parse.urlparse(full_link).query)
              if "file" in sub_q:
                  return urllib.parse.urljoin(full_link, sub_q["file"][0])
              if ".pdf" in full_link.lower() and "docs.google.com" not in full_link.lower():
                  return full_link
              gd_match = (
                  re.search(r'/file/d/([a-zA-Z0-9_-]+)', full_link)
                  or re.search(r'[?&]id=([a-zA-Z0-9_-]+)', full_link)
              )
              if gd_match:
                  return f"https://drive.google.com/uc?export=download&id={gd_match.group(1)}"
              return None

          def download_or_convert_to_pdf(page_url, out_filepath):
              if not out_filepath or is_time_up():
                  return False
              try:
                  is_bac_or_bem = "_merged.pdf" in out_filepath.lower()

                  r = requests.get(page_url, headers=headers, timeout=20)
                  if r.status_code != 200:
                      return False
                  if r.content[:4] == b"%PDF" and not is_bac_or_bem:
                      return register_unique_pdf_bytes(r.content, out_filepath)

                  soup = BeautifulSoup(r.text, "html.parser")
                  subject_pdfs = []
                  correction_pdfs = []

                  for tag in soup.find_all(["a", "button", "iframe", "embed", "object"]):
                      tag_text = tag.get_text(" ", strip=True)
                      for attr in ["href", "src", "data", "data-pdf", "data-file", "data-url", "data-src", "data-href"]:
                          pdf_u = extract_direct_pdf_url(tag.get(attr) or "", page_url)
                          if not pdf_u:
                              continue
                          is_corr_tag = any(w in tag_text for w in ["التصحيح", "الحل"]) or any(w in pdf_u.lower() for w in ["_cor", "-cor", "_sol", "-sol", "corrige", "correction"])
                          if is_corr_tag:
                              if pdf_u not in correction_pdfs:
                                  correction_pdfs.append(pdf_u)
                          else:
                              if pdf_u not in subject_pdfs:
                                  subject_pdfs.append(pdf_u)

                  clean_html = r.text.replace(r"\/", "/")
                  abs_pdfs = re.findall(r'https?://[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  rel_pdfs = re.findall(r'(?:/wp-content/uploads/|/uploads/|/files/|/storage/)[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  for u in abs_pdfs + [urllib.parse.urljoin(page_url, rp) for rp in rel_pdfs]:
                      if any(w in u.lower() for w in ["_cor", "-cor", "_sol", "-sol", "corrige", "correction"]):
                          if u not in correction_pdfs:
                              correction_pdfs.append(u)
                      else:
                          if u not in subject_pdfs:
                              subject_pdfs.append(u)

                  page_has_corr_text = any(w in r.text for w in ["مع التصحيح", "الحل النموذجي", "التصحيح النموذجي", "عرض التصحيح"])

                  if is_bac_or_bem and not correction_pdfs and not page_has_corr_text:
                      return False

                  for pdf_candidate in subject_pdfs:
                      pr = requests.get(pdf_candidate, headers=headers, timeout=20)
                      if pr.status_code == 200 and pr.content[:4] == b"%PDF":
                          final_pdf_bytes = pr.content
                          if correction_pdfs:
                              try:
                                  cr = requests.get(correction_pdfs[0], headers=headers, timeout=20)
                                  if cr.status_code == 200 and cr.content[:4] == b"%PDF":
                                      final_pdf_bytes = merge_two_pdfs_bytes(pr.content, cr.content)
                              except Exception:
                                  pass
                          if register_unique_pdf_bytes(final_pdf_bytes, out_filepath):
                              return True

                  if not is_bac_or_bem:
                      content_box = (
                          soup.find("div", class_=re.compile(r"entry-content|post-content|article|main|sujet"))
                          or soup
                      )
                      pil_imgs = []
                      for img in content_box.find_all("img"):
                          src = img.get("data-src") or img.get("src") or ""
                          if not src or any(
                              skip in src.lower()
                              for skip in ["logo", "avatar", "icon", "gravatar", "emoji", "banner", "ads", "button"]
                          ):
                              continue
                          src = urllib.parse.urljoin(page_url, src)
                          try:
                              ir = requests.get(src, headers=headers, timeout=15)
                              if ir.status_code == 200:
                                  im = Image.open(io.BytesIO(ir.content)).convert("RGB")
                                  w, h = im.size
                                  if w >= 380 and h >= 380:
                                      pil_imgs.append(im)
                          except Exception:
                              pass

                      if pil_imgs:
                          buf = io.BytesIO()
                          pil_imgs[0].save(
                              buf,
                              "PDF",
                              resolution=100.0,
                              save_all=True,
                              append_images=pil_imgs[1:],
                          )
                          return register_unique_pdf_bytes(buf.getvalue(), out_filepath)

              except Exception:
                  pass
              return False

          def process_single_article_url(url, title_hint="", parent_meta=None, ignore_visited=False):
              global saved_total
              if saved_total >= max_to_save or is_time_up():
                  return False
              if not ignore_visited and is_visited(url):
                  return False

              clean_hint = title_hint.strip()
              if clean_hint in ["الحل", "التصحيح", "عرض التصحيح", "تحميل التصحيح"]:
                  mark_visited(url)
                  return False

              combined = title_hint + " " + urllib.parse.unquote(url)
              meta = analyze_metadata(combined, parent_meta=parent_meta)

              if not meta.get("subject") or (meta.get("level") in ["1as", "2as", "3as"] and not meta.get("stream")):
                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code == 200 and r.content[:4] != b"%PDF":
                          soup = BeautifulSoup(r.text, "html.parser")
                          page_title = soup.title.string if soup.title else ""
                          h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1"])])
                          combined = page_title + " " + h1_txt + " " + combined
                          meta = analyze_metadata(combined, parent_meta=parent_meta)
                  except Exception:
                      pass

              if meta.get("skip") or meta.get("is_solution") or not meta.get("subject"):
                  mark_visited(url)
                  return False

              num_match = re.search(r'رقم\s*(\d+)', title_hint)
              short_tag = num_match.group(1) if num_match else url_hash(url)[:5]

              out_p = build_filepath(meta, short_tag)
              if not out_p:
                  mark_visited(url)
                  return False

              ok = download_or_convert_to_pdf(url, out_p)
              mark_visited(url)

              if ok:
                  with lock:
                      saved_total += 1
                      curr = saved_total
                  if curr % 25 == 0:
                      write_index_and_push(f"Imported batch: +{curr} unique PDFs")
              return ok

          def is_hub_category_url(u, txt):
              low_u = urllib.parse.unquote(u).lower().rstrip("/")
              if any(low_u.endswith(s) for s in [
                  "/maths", "/physics", "/sciences", "/arabic", "/francais", "/french", "/english",
                  "/islamic", "/history", "/history-geography", "/civic", "/philosophy", "/accounting",
                  "/economy", "/law", "/summaries", "/lessons", "/books", "/bac-solutions", "/bem-solutions",
                  "/literature-philosophy", "/foreign-languages", "/technical-mathematics", "/management-economics",
                  "/mathematics", "/mathematiques", "/physique", "/sciences-naturelles", "/arabe", "/anglais"
              ]):
                  return True
              if re.search(r'(?:exams|tests)-[a-z-]*term-[123]$', low_u):
                  return True
              if re.search(r'/bac-20[0-2]\d$', low_u) or re.search(r'/bem-20[0-2]\d$', low_u):
                  return True
              return False

          def crawl_hub_url(hub_url, depth=0, force_revisit=False):
              global saved_total
              if saved_total >= max_to_save or is_time_up():
                  return
              print(f"Crawling hub (depth={depth}): {hub_url}")
              try:
                  r = requests.get(hub_url, headers=headers, timeout=22)
                  if r.status_code != 200:
                      return

                  soup = BeautifulSoup(r.text, "html.parser")
                  page_title = soup.title.string if soup.title else ""
                  h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1"])])

                  parent_context = urllib.parse.unquote(hub_url) + " " + page_title + " " + h1_txt
                  parent_meta = analyze_metadata(parent_context)

                  for nav_tag in soup.find_all(["nav", "header", "footer", "aside"]):
                      nav_tag.decompose()

                  sub_hubs = []
                  article_items = []
                  seen_sub_urls = set()

                  for a in soup.find_all("a"):
                      href = a.get("href") or a.get("data-url") or a.get("data-href") or ""
                      txt = a.get_text(" ", strip=True)
                      if not href or href.startswith("#") or href.startswith("javascript"):
                          continue
                      if txt in ["الحل", "التصحيح", "عرض التصحيح"] or any(
                          skip in txt for skip in ["إضافة موضوع", "اتصل بنا", "سياسة الخصوصية", "حسابي", "منتدى", "طالع أيضًا", "حساب معدل"]
                      ):
                          continue

                      context_txt = txt
                      if txt in ["الموضوع", "الموضوع والتصحيح", "عرض الموضوع"] and a.parent:
                          card_box = a.find_parent(["li", "div", "tr", "article"]) or a.parent
                          context_txt = card_box.get_text(" ", strip=True)

                      full_u = urllib.parse.urljoin(hub_url, href.replace(r"\/", "/"))
                      if full_u.rstrip("/") == hub_url.rstrip("/") or full_u in seen_sub_urls:
                          continue

                      sub_trim = detect_trimester_strict(urllib.parse.unquote(full_u) + " " + context_txt, fallback_trim=parent_meta["trimester"])
                      if parent_meta.get("has_trimester") and sub_trim != parent_meta["trimester"] and "رقم" not in context_txt:
                          continue

                      if depth < 2 and is_hub_category_url(full_u, context_txt) and full_u.startswith(hub_url.rstrip("/")):
                          seen_sub_urls.add(full_u)
                          sub_hubs.append(full_u)
                          continue

                      is_child_path = full_u.startswith(hub_url.rstrip("/"))
                      has_study_word = any(
                          w in (context_txt + " " + urllib.parse.unquote(full_u)).lower()
                          for w in [
                              "اختبار", "إختبار", "فرض", "درس", "ملخص", "موضوع", "نموذج", "رقم",
                              "كتاب", "بكالوريا", "شهادة", "exam", "test", "devoir", "sujet", ".pdf", "file="
                          ]
                      )
                      if is_child_path or has_study_word:
                          seen_sub_urls.add(full_u)
                          article_items.append((full_u, context_txt))

                  if article_items:
                      with ThreadPoolExecutor(max_workers=8) as executor:
                          futures = []
                          for sub_u, sub_txt in article_items:
                              if saved_total >= max_to_save or is_time_up():
                                  break
                              futures.append(
                                  executor.submit(process_single_article_url, sub_u, sub_txt, parent_meta, force_revisit)
                              )
                          for _ in as_completed(futures):
                              pass

                  for sh in sub_hubs:
                      if saved_total >= max_to_save or is_time_up():
                          break
                      crawl_hub_url(sh, depth=depth + 1, force_revisit=force_revisit)

                  if not article_items and not sub_hubs:
                      process_single_article_url(hub_url, page_title, parent_meta, force_revisit)

              except Exception as e:
                  print("Error crawling hub:", hub_url, e)

          extra_u = os.environ.get("EXTRA_URL", "").strip()
          if extra_u:
              for part in re.split(r'[\s,]+', extra_u):
                  if part.startswith("http") and not is_time_up() and saved_total < max_to_save:
                      crawl_hub_url(part.strip(), depth=0, force_revisit=True)

          if os.path.exists("links.txt") and not is_time_up() and saved_total < max_to_save:
              with open("links.txt", "r", encoding="utf-8") as lf:
                  file_urls = [line.strip() for line in lf if line.strip().startswith("http")]
              for u in file_urls:
                  if saved_total >= max_to_save or is_time_up():
                      break
                  crawl_hub_url(u, depth=0, force_revisit=False)

          for domain in ["https://eddirasa.com", "https://bacdz.net", "https://educationdz.com", "https://dzmadrassa.com"]:
              if saved_total >= max_to_save or is_time_up():
                  break
              for page_num in range(1, 100):
                  if saved_total >= max_to_save or is_time_up():
                      break
                  api_u = f"{domain}/wp-json/wp/v2/posts?per_page=50&page={page_num}"
                  try:
                      r = requests.get(api_u, headers=headers, timeout=20)
                      if r.status_code != 200:
                          break
                      posts = r.json()
                      if not isinstance(posts, list) or not posts:
                          break
                      unvisited = [(p.get("link", ""), p.get("title", {}).get("rendered", "")) for p in posts if p.get("link") and not is_visited(p.get("link", ""))]
                      if not unvisited:
                          continue
                      with ThreadPoolExecutor(max_workers=8) as ex:
                          futs = [ex.submit(process_single_article_url, lnk, ttl, None, False) for lnk, ttl in unvisited]
                          for _ in as_completed(futs):
                              pass
                  except Exception:
                      break

          write_index_and_push(f"Harvest completed (+{saved_total} unique PDFs)")
          print("Finished harvest! Total new unique PDFs added:", saved_total)
