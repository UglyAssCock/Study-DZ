name: master-5-sites-harvester

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-elementary-now:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 1AP to 5AP Folders Before Deletion
        run: |
          git config user.name "StudyDZ-Restore"
          git config user.email "bot@studydz.app"

          for c in $(git rev-list --all -n 100 | tac); do
            for folder in 1ap 2ap 3ap 4ap 5ap 5eme; do
              if git ls-tree -d "$c" "files/$folder" | grep -q "tree"; then
                git checkout "$c" -- "files/$folder" 2>/dev/null || true
              fi
            done
          done

          find files -type f -name "*.pdf" | sort > files/index.txt
          git add -A files/
          git commit -m "Restored all Elementary School PDFs" || true
          git push origin HEAD
