name: master-5-sites-harvester

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:
    inputs:
      extra_url:
        description: 'Paste ANY category or exam URL here (e.g. https://eddirasa.com/ens-pri/fifth-primary/maths/exams-term-1/)'
        required: false
        default: 'https://eddirasa.com/ens-pri/fifth-primary/maths/exams-term-1/'
      site_choice:
        description: 'Used when extra_url is empty: ALL, eddirasa, dzexams, dzmadrassa, bacdz, educationdz'
        required: true
        default: 'ALL'
      target_filter:
        description: 'Target: ALL, bac, bem, 5eme, 3as, 2as, 1as, 4am, 3am, 2am, 1am, 5ap, 4ap, 3ap, 2ap, 1ap'
        required: true
        default: 'ALL'
      max_files_per_run:
        description: 'Max new PDFs to save in this run (e.g. 200)'
        required: true
        default: '200'

permissions:
  contents: write

jobs:
  harvest-study-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Scraper Libraries
        run: pip install requests beautifulsoup4 pillow lxml

      - name: Crawl Pasted Links or Auto-Harvest Sites
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_CHOICE: ${{ github.event.inputs.site_choice }}
          TARGET_FILTER: ${{ github.event.inputs.target_filter }}
          MAX_FILES: ${{ github.event.inputs.max_files_per_run }}
          EXTRA_URL: ${{ github.event.inputs.extra_url }}
        shell: python
        run: |
          import os
          import re
          import io
          import shutil
          import hashlib
          import threading
          import urllib.parse
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          os.makedirs("files", exist_ok=True)
          visited_file = "files/visited_hashes.txt"
          content_hashes_file = "files/content_hashes.txt"

          visited_hashes = set()
          content_hashes = set()
          seen_canonical_names = set()

          if os.path.exists(visited_file):
              with open(visited_file, "r", encoding="utf-8") as vf:
                  for line in vf:
                      h = line.strip()
                      if h:
                          visited_hashes.add(h)

          subprocess.run(["git", "config", "user.name", "StudyDZ-Harvester"], check=False)
          subprocess.run(["git", "config", "user.email", "bot@studydz.app"], check=False)

          # =====================================================================
          # STEP 1: INDEX EXISTING FILES & REMOVE DUPLICATES
          # =====================================================================
          for root, _, fnames in os.walk("files"):
              for fn in sorted(fnames):
                  if not fn.lower().endswith(".pdf"):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      with open(p, "rb") as pf:
                          raw = pf.read()
                      if len(raw) in range(0, 1500) or raw[:4] != b"%PDF":
                          os.remove(p)
                          continue
                      md5_h = hashlib.md5(raw).hexdigest()
                      if md5_h in content_hashes or fn.lower() in seen_canonical_names:
                          os.remove(p)
                          continue
                      content_hashes.add(md5_h)
                      seen_canonical_names.add(fn.lower())
                  except Exception:
                      pass

          with open(content_hashes_file, "w", encoding="utf-8") as cf:
              for h in sorted(content_hashes):
                  cf.write(h + "\n")

          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36"
          }

          lock = threading.Lock()
          saved_total = 0

          try:
              max_to_save = int(os.environ.get("MAX_FILES", "200").strip() or "200")
          except Exception:
              max_to_save = 200

          site_choice = (os.environ.get("SITE_CHOICE", "ALL").strip() or "ALL").lower()
          target_filter = (os.environ.get("TARGET_FILTER", "ALL").strip() or "ALL").lower()
          event_name = os.environ.get("EVENT_NAME", "").strip()

          def url_hash(u):
              return hashlib.md5(u.strip().encode("utf-8")).hexdigest()[:12]

          def is_visited(u):
              h = url_hash(u)
              with lock:
                  return h in visited_hashes

          def mark_visited(u):
              h = url_hash(u)
              with lock:
                  if h not in visited_hashes:
                      visited_hashes.add(h)
                      with open(visited_file, "a", encoding="utf-8") as vf:
                          vf.write(h + "\n")

          def register_unique_pdf_bytes(raw_bytes, out_filepath):
              if len(raw_bytes) in range(0, 1500) or raw_bytes[:4] != b"%PDF":
                  return False
              md5_hex = hashlib.md5(raw_bytes).hexdigest()
              base_name = os.path.basename(out_filepath).lower()
              with lock:
                  if md5_hex in content_hashes or base_name in seen_canonical_names:
                      return False
                  if os.path.exists(out_filepath):
                      return False
                  os.makedirs(os.path.dirname(out_filepath), exist_ok=True)
                  with open(out_filepath, "wb") as f:
                      f.write(raw_bytes)
                  content_hashes.add(md5_hex)
                  seen_canonical_names.add(base_name)
                  with open(content_hashes_file, "a", encoding="utf-8") as cf:
                      cf.write(md5_hex + "\n")
              print("Saved unique PDF:", out_filepath)
              return True

          def git_commit_and_push(msg):
              with lock:
                  subprocess.run(["git", "pull", "--rebase", "--autostash"], check=False)
                  subprocess.run(["git", "add", "-A", "files/"], check=False)
                  res = subprocess.run(["git", "diff", "--staged", "--quiet"])
                  if res.returncode != 0:
                      subprocess.run(["git", "commit", "-m", msg], check=False)
                      subprocess.run(["git", "push"], check=False)

          # Complete Arabic + English (Eddirasa / DzExams / DzMadrassa) rules
          level_rules = [
              ("1ap", ["first-primary", "1ere-primaire", "الأولى ابتدائي", "اولى ابتدائي", "1 ابتدائي", "1 إبتدائي", "سنة أولى ابتدائي", "1ap", "/1ap"]),
              ("2ap", ["second-primary", "2eme-primaire", "الثانية ابتدائي", "ثانية ابتدائي", "2 ابتدائي", "2 إبتدائي", "سنة ثانية ابتدائي", "2ap", "/2ap"]),
              ("3ap", ["third-primary", "3eme-primaire", "الثالثة ابتدائي", "ثالثة ابتدائي", "3 ابتدائي", "3 إبتدائي", "سنة ثالثة ابتدائي", "3ap", "/3ap"]),
              ("4ap", ["fourth-primary", "4eme-primaire", "الرابعة ابتدائي", "رابعة ابتدائي", "4 ابتدائي", "4 إبتدائي", "سنة رابعة ابتدائي", "4ap", "/4ap"]),
              ("5ap", ["fifth-primary", "5eme-primaire", "الخامسة ابتدائي", "خامسة ابتدائي", "5 ابتدائي", "5 إبتدائي", "سنة خامسة ابتدائي", "5ap", "/5ap"]),
              ("1am", ["first-middle", "first-am", "1ere-moyen", "الأولى متوسط", "اولى متوسط", "1 متوسط", "سنة أولى متوسط", "1am", "/1am"]),
              ("2am", ["second-middle", "second-am", "2eme-moyen", "الثانية متوسط", "ثانية متوسط", "2 متوسط", "سنة ثانية متوسط", "2am", "/2am"]),
              ("3am", ["third-middle", "third-am", "3eme-moyen", "الثالثة متوسط", "ثالثة متوسط", "3 متوسط", "سنة ثالثة متوسط", "3am", "/3am"]),
              ("4am", ["fourth-middle", "fourth-am", "4eme-moyen", "الرابعة متوسط", "رابعة متوسط", "4 متوسط", "سنة رابعة متوسط", "4am", "/4am"]),
              ("1as", ["first-secondary", "first-as", "1ere-secondaire", "الأولى ثانوي", "اولى ثانوي", "1 ثانوي", "سنة أولى ثانوي", "1as", "/1as"]),
              ("2as", ["second-secondary", "second-as", "2eme-secondaire", "الثانية ثانوي", "ثانية ثانوي", "2 ثانوي", "سنة ثانية ثانوي", "2as", "/2as"]),
              ("3as", ["third-secondary", "third-as", "3eme-secondaire", "الثالثة ثانوي", "ثالثة ثانوي", "3 ثانوي", "سنة ثالثة ثانوي", "3as", "/3as"]),
          ]

          subject_rules = [
              ("science", ["العلوم الطبيعية", "علوم الطبيعة", "علوم طبيعية", "natural-sciences", "sciences-naturelles", "snv", "science", "sci"]),
              ("physics", ["العلوم الفيزيائية", "الفيزياء", "فيزياء", "تربية علمية", "التربية العلمية", "physique", "physics", "phys"]),
              ("math", ["الرياضيات", "رياضيات", "maths", "mathematiques", "mathematics", "math"]),
              ("arabic", ["اللغة العربية", "الأدب العربي", "عربية", "arabic", "arabe"]),
              ("french", ["اللغة الفرنسية", "فرنسية", "francais", "french"]),
              ("english", ["اللغة الإنجليزية", "اللغة الانجليزية", "إنجليزية", "انجليزية", "anglais", "english"]),
              ("hisgeo", ["التاريخ والجغرافيا", "التاريخ و الجغرافيا", "تاريخ", "جغرافيا", "history-geography", "histoire", "hisgeo", "history"]),
              ("islamic", ["العلوم الإسلامية", "التربية الإسلامية", "التربية الاسلامية", "شريعة", "islamic-education", "islamia", "islamic", "sciences-islamiques"]),
              ("philo", ["الفلسفة", "فلسفة", "philosophie", "philosophy", "philo"]),
              ("civics", ["التربية المدنية", "مدنية", "civic-education", "civique", "civics", "education-civique"]),
              ("cs", ["الإعلام الآلي", "الاعلام الالي", "معلوماتية", "computer-science", "informatique"]),
              ("accounting", ["التسيير المحاسبي", "محاسبة", "accounting", "comptabilite", "gestion"]),
              ("economy", ["الاقتصاد والمناجمنت", "الإقتصاد والمناجمنت", "اقتصاد", "economics", "economie"]),
              ("law", ["القانون", "القانــــون", "droit", "law"]),
              ("engineering", ["الهندسة", "هندسة", "تكنولوجيا", "engineering", "genie", "technologie"]),
              ("amazigh", ["اللغة الأمازيغية", "أمازيغية", "امازيغية", "amazigh", "tamazight"]),
              ("third_lang", ["اللغة الإيطالية", "اللغة الإسبانية", "اللغة الألمانية", "اسبانية", "المانية", "ايطالية", "espagnol", "allemand", "italien", "spanish", "german", "italian"]),
              ("art", ["التربية التشكيلية", "التربية الموسيقية", "التربية الفنية", "تشكيلية", "موسيقية", "art-education", "music-education", "artistique", "musicale"]),
          ]

          stream_rules = [
              ("lp", ["آداب وفلسفة", "اداب وفلسفة", "آداب و فلسفة", "اداب و فلسفة", "literature-philosophy", "آداب-وفلسفة", "lettres"]),
              ("se", ["علوم تجريبية", "العلوم التجريبية", "علوم-تجريبية", "/sciences/"]),
              ("tm", ["تقني رياضي", "التقني الرياضي", "تقني-رياضي", "tech-math"]),
              ("ge", ["تسيير واقتصاد", "تسيير و اقتصاد", "تسيير-واقتصاد", "management"]),
              ("le", ["لغات أجنبية", "لغات اجنبية", "لغات-أجنبية", "foreign-languages", "langues"]),
              ("mt", ["شعبة رياضيات", "شعبة الرياضيات", "/mathematics/"]),
          ]

          def analyze_metadata(text, parent_meta=None):
              t = text.lower()
              is_solution = any(
                  w in t
                  for w in ["التصحيح فقط", "تصحيح موضوع", "_sol.", "-sol.", "corrige-"]
              )

              # Check if Trimester keyword is present (if so, it's a Trimester file, NOT an official archive)
              has_trimester = any(
                  w in t
                  for w in [
                      "term-1", "term-2", "term-3",
                      "trimestre-1", "trimestre-2", "trimestre-3",
                      "الفصل الأول", "الفصل الثاني", "الفصل الثالث",
                      "الثلاثي الأول", "الثلاثي الثاني", "الثلاثي الثالث",
                  ]
              )

              archive_type = None
              if not has_trimester:
                  if any(w in t for w in ["بكالوريا", "البكالوريا", "/bac-", "/bac/", "bac-solutions"]):
                      archive_type = "bac"
                  elif any(w in t for w in ["شهادة التعليم المتوسط", "البيام", "/bem-", "/bem/", "bem-solutions"]):
                      archive_type = "bem"
                  elif any(w in t for w in ["شهادة التعليم الابتدائي", "شهادة التعليم الإبتدائي", "السانكيام", "/5eme-", "cinquieme"]):
                      archive_type = "5eme"

              ym = re.search(r'(200[89]|201[0-9]|202[0-6])', t)
              year = ym.group(1) if (ym and archive_type) else None

              level = None
              for code, keys in level_rules:
                  if any(k in t for k in keys):
                      level = code
                      break

              if not level:
                  if parent_meta and parent_meta.get("level"):
                      level = parent_meta["level"]
                  elif archive_type == "bac":
                      level = "3as"
                  elif archive_type == "bem":
                      level = "4am"
                  elif archive_type == "5eme":
                      level = "5ap"
                  else:
                      level = "3as"

              subject = None
              for code, keys in subject_rules:
                  if any(k in t for k in keys):
                      subject = code
                      break
              if not subject and parent_meta:
                  subject = parent_meta.get("subject")

              stream = parent_meta.get("stream", "se") if parent_meta else "se"
              for code, keys in stream_rules:
                  if any(k in t for k in keys):
                      stream = code
                      break

              trimester = parent_meta.get("trimester", "t1") if parent_meta else "t1"
              if any(w in t for w in ["term-2", "trimestre-2", "2-trimestre", "الفصل الثاني", "الثلاثي الثاني", "ف2", "t2", "2eme"]):
                  trimester = "t2"
              elif any(w in t for w in ["term-3", "trimestre-3", "3-trimestre", "الفصل الثالث", "الثلاثي الثالث", "ف3", "t3", "3eme"]):
                  trimester = "t3"
              elif any(w in t for w in ["term-1", "trimestre-1", "1-trimestre", "الفصل الأول", "الثلاثي الأول", "ف1", "t1", "1er"]):
                  trimester = "t1"

              category = parent_meta.get("category", "exam") if parent_meta else "exam"
              if any(w in t for w in ["books", "book", "livre", "manuel", "كتاب", "الكتاب المدرسي", "كتب"]):
                  category = "book"
              elif any(w in t for w in ["summaries", "summary", "resumes", "resume", "ملخص", "ملخصات"]):
                  category = "resume"
              elif any(w in t for w in ["tests-term", "tests", "test", "devoirs", "devoir", "فرض", "فروض"]):
                  category = "test"
              elif any(w in t for w in ["lessons", "lesson", "cours", "درس", "دروس", "مذكرات"]):
                  category = "lesson"
              elif any(w in t for w in ["exams-term", "exams", "exam", "اختبار", "اختبارات", "إختبار"]):
                  category = "exam"

              return {
                  "is_solution": is_solution,
                  "year": year,
                  "archive_type": archive_type,
                  "level": level,
                  "subject": subject,
                  "stream": stream,
                  "trimester": trimester,
                  "category": category,
              }

          def build_filepath(meta, unique_tag=""):
              subj = meta["subject"] or "math"
              if meta["archive_type"] and meta["year"]:
                  folder = os.path.join("files", meta["archive_type"])
                  os.makedirs(folder, exist_ok=True)
                  if meta["archive_type"] == "bac":
                      return os.path.join(folder, f"bac_{meta['year']}_{subj}_{meta['stream']}.pdf")
                  return os.path.join(folder, f"{meta['archive_type']}_{meta['year']}_{subj}.pdf")

              sfx = f"_{unique_tag}" if unique_tag else ""
              folder = os.path.join("files", meta["level"])
              os.makedirs(folder, exist_ok=True)
              if meta["category"] == "book":
                  return os.path.join(folder, f"{meta['level']}_{subj}_book{sfx}.pdf")

              return os.path.join(folder, f"{meta['level']}_{subj}_{meta['trimester']}_{meta['category']}{sfx}.pdf")

          def download_or_convert_to_pdf(page_url, out_filepath):
              base_name = os.path.basename(out_filepath).lower()
              with lock:
                  if base_name in seen_canonical_names or os.path.exists(out_filepath):
                      return False

              try:
                  # 1. Check ?file= parameter
                  parsed_q = urllib.parse.parse_qs(urllib.parse.urlparse(page_url).query)
                  if "file" in parsed_q:
                      direct_u = urllib.parse.urljoin(page_url, parsed_q["file"][0])
                      pr = requests.get(direct_u, headers=headers, timeout=20)
                      if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                          return True

                  # 2. Direct .pdf URL
                  if page_url.lower().split("?")[0].endswith(".pdf"):
                      pr = requests.get(page_url, headers=headers, timeout=20)
                      if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                          return True

                  r = requests.get(page_url, headers=headers, timeout=20)
                  if r.status_code != 200:
                      return False
                  if r.content[:4] == b"%PDF":
                      return register_unique_pdf_bytes(r.content, out_filepath)

                  # Unescape JSON slashes (https:\/\/eddirasa.com\/wp-content\/... -> https://eddirasa.com/wp-content/...)
                  clean_html = r.text.replace(r"\/", "/")

                  # 3. Search unescaped HTML for absolute AND relative .pdf URLs
                  abs_pdfs = re.findall(r'https?://[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  rel_pdfs = re.findall(r'(?:/wp-content/uploads/|/uploads/|/files/|/storage/)[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  all_pdf_candidates = abs_pdfs + [urllib.parse.urljoin(page_url, rp) for rp in rel_pdfs]

                  # Put non-correction PDFs first
                  subject_pdfs = [u for u in all_pdf_candidates if not any(w in u.lower() for w in ["_cor", "-cor", "_sol", "-sol", "corrige"])]
                  for pdf_candidate in subject_pdfs:
                      pr = requests.get(pdf_candidate, headers=headers, timeout=20)
                      if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                          return True

                  soup = BeautifulSoup(r.text, "html.parser")

                  # 4. Check all tags and data-* attributes (data-pdf, data-url, data-file, data-src, href, src)
                  for tag in soup.find_all(["a", "button", "div", "iframe", "embed", "object"]):
                      tag_text = tag.get_text(" ", strip=True)
                      if any(cor_w in tag_text for cor_w in ["عرض التصحيح", "تحميل التصحيح", "الحل النموذجي"]):
                          continue

                      for attr in ["href", "src", "data", "data-pdf", "data-file", "data-url", "data-src", "data-href"]:
                          raw_link = tag.get(attr) or ""
                          if not raw_link or raw_link.startswith("#") or raw_link.startswith("javascript"):
                              continue
                          full_link = urllib.parse.urljoin(page_url, raw_link.replace(r"\/", "/"))

                          sub_q = urllib.parse.parse_qs(urllib.parse.urlparse(full_link).query)
                          if "file" in sub_q:
                              pdf_u = urllib.parse.urljoin(full_link, sub_q["file"][0])
                              pr = requests.get(pdf_u, headers=headers, timeout=20)
                              if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                                  return True

                          if ".pdf" in full_link.lower() and "docs.google.com" not in full_link.lower():
                              pr = requests.get(full_link, headers=headers, timeout=20)
                              if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                                  return True

                          gd_match = (
                              re.search(r'/file/d/([a-zA-Z0-9_-]+)', full_link)
                              or re.search(r'[?&]id=([a-zA-Z0-9_-]+)', full_link)
                          )
                          if gd_match:
                              fid = gd_match.group(1)
                              dl_u = f"https://drive.google.com/uc?export=download&id={fid}"
                              pr = requests.get(dl_u, headers=headers, timeout=20)
                              if pr.status_code == 200 and register_unique_pdf_bytes(pr.content, out_filepath):
                                  return True

                  # 5. Fallback: Convert scanned exam images inside the page into a single clean PDF
                  content_box = (
                      soup.find("div", class_=re.compile(r"entry-content|post-content|article|main|sujet"))
                      or soup
                  )
                  pil_imgs = []
                  for img in content_box.find_all("img"):
                      src = img.get("data-src") or img.get("src") or ""
                      if not src or any(
                          skip in src.lower()
                          for skip in ["logo", "avatar", "icon", "gravatar", "emoji", "banner", "ads", "button"]
                      ):
                          continue
                      src = urllib.parse.urljoin(page_url, src)
                      try:
                          ir = requests.get(src, headers=headers, timeout=15)
                          if ir.status_code == 200:
                              im = Image.open(io.BytesIO(ir.content)).convert("RGB")
                              w, h = im.size
                              if w not in range(0, 380) and h not in range(0, 380):
                                  pil_imgs.append(im)
                      except Exception:
                          pass

                  if pil_imgs:
                      buf = io.BytesIO()
                      pil_imgs[0].save(
                          buf,
                          "PDF",
                          resolution=100.0,
                          save_all=True,
                          append_images=pil_imgs[1:],
                      )
                      return register_unique_pdf_bytes(buf.getvalue(), out_filepath)

              except Exception:
                  pass
              return False

          def process_single_article_url(url, title_hint="", parent_meta=None):
              global saved_total
              if saved_total not in range(0, max_to_save):
                  return False
              if is_visited(url):
                  return False

              combined = title_hint + " " + urllib.parse.unquote(url)
              meta = analyze_metadata(combined, parent_meta=parent_meta)

              if not meta["subject"]:
                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      if r.status_code != 200:
                          mark_visited(url)
                          return False
                      soup = BeautifulSoup(r.text, "html.parser")
                      page_title = soup.title.string if soup.title else ""
                      h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1", "h2"])])
                      combined = page_title + " " + h1_txt + " " + combined
                      meta = analyze_metadata(combined, parent_meta=parent_meta)
                  except Exception:
                      mark_visited(url)
                      return False

              if meta["is_solution"] or not meta["subject"]:
                  mark_visited(url)
                  return False

              # Extract exam number if present (e.g. رقم 144 -> 144), otherwise short hash
              num_match = re.search(r'رقم\s*(\d+)', title_hint)
              short_tag = num_match.group(1) if num_match else url_hash(url)[:5]

              out_p = build_filepath(meta, short_tag)
              ok = download_or_convert_to_pdf(url, out_p)
              mark_visited(url)

              if ok:
                  with lock:
                      saved_total += 1
                      curr = saved_total
                  if curr % 25 == 0:
                      git_commit_and_push(f"Imported batch: +{curr} unique PDFs")
              return ok

          # =====================================================================
          # SMART HUB CRAWLER FOR ANY USER-PASTED LINK (Method 1 & Method 2)
          # =====================================================================
          def crawl_user_pasted_url(hub_url):
              global saved_total
              print("====================================================")
              print("Crawling user-supplied URL:", hub_url)
              try:
                  r = requests.get(hub_url, headers=headers, timeout=25)
                  if r.status_code != 200:
                      print("Failed to fetch URL, status:", r.status_code)
                      return

                  # If the URL itself is a direct PDF
                  if r.content[:4] == b"%PDF":
                      meta = analyze_metadata(urllib.parse.unquote(hub_url))
                      out_p = build_filepath(meta, url_hash(hub_url)[:5])
                      if register_unique_pdf_bytes(r.content, out_p):
                          with lock:
                              saved_total += 1
                      return

                  soup = BeautifulSoup(r.text, "html.parser")
                  page_title = soup.title.string if soup.title else ""
                  h1_txt = " ".join([h.get_text(" ", strip=True) for h in soup.find_all(["h1", "h2"])])

                  # Determine the parent category metadata from the URL + Title + H1
                  parent_context = urllib.parse.unquote(hub_url) + " " + page_title + " " + h1_txt
                  parent_meta = analyze_metadata(parent_context)
                  print("Detected Page Metadata:", parent_meta)

                  # Remove nav/header/footer/sidebar so we only collect exam/lesson links from the main body
                  for nav_tag in soup.find_all(["nav", "header", "footer", "aside"]):
                      nav_tag.decompose()

                  sub_items = []
                  seen_sub_urls = set()

                  # 1. Collect all <a href="..."> links inside the main page content
                  for a in soup.find_all("a"):
                      href = a.get("href") or a.get("data-url") or a.get("data-href") or ""
                      txt = a.get_text(" ", strip=True)
                      if not href or href.startswith("#") or href.startswith("javascript"):
                          continue
                      if any(skip in txt for skip in ["إضافة موضوع", "اتصل بنا", "سياسة الخصوصية", "حسابي", "منتدى"]):
                          continue

                      full_u = urllib.parse.urljoin(hub_url, href.replace(r"\/", "/"))
                      if full_u == hub_url or full_u in seen_sub_urls:
                          continue

                      # Keep links that belong to the same site and look like exam/lesson items or child paths
                      is_child_path = full_u.startswith(hub_url.rstrip("/"))
                      has_study_word = any(
                          w in (txt + " " + urllib.parse.unquote(full_u)).lower()
                          for w in [
                              "اختبار", "إختبار", "فرض", "درس", "ملخص", "موضوع", "نموذج", "رقم",
                              "كتاب", "بكالوريا", "شهادة", "exam", "test", "devoir", "sujet", ".pdf", "file="
                          ]
                      )
                      if is_child_path or has_study_word:
                          seen_sub_urls.add(full_u)
                          sub_items.append((full_u, txt))

                  # 2. Also check if direct PDF URLs are embedded directly in the hub page's HTML/JSON
                  clean_html = r.text.replace(r"\/", "/")
                  direct_pdfs = re.findall(r'https?://[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  rel_pdfs = re.findall(r'(?:/wp-content/uploads/|/uploads/)[^\s"\'\\`]+?\.pdf', clean_html, flags=re.IGNORECASE)
                  for dp in direct_pdfs + [urllib.parse.urljoin(hub_url, rp) for rp in rel_pdfs]:
                      if dp not in seen_sub_urls and not any(w in dp.lower() for w in ["_cor", "-cor", "_sol", "-sol"]):
                          seen_sub_urls.add(dp)
                          sub_items.append((dp, page_title))

                  print(f"Found {len(sub_items)} exam/lesson links inside {hub_url}")

                  if sub_items:
                      with ThreadPoolExecutor(max_workers=10) as executor:
                          futures = []
                          for sub_u, sub_txt in sub_items:
                              if saved_total not in range(0, max_to_save):
                                  break
                              futures.append(
                                  executor.submit(process_single_article_url, sub_u, sub_txt, parent_meta)
                              )
                          for _ in as_completed(futures):
                              pass
                  else:
                      # If no sub-links were found, treat hub_url itself as a single exam page
                      process_single_article_url(hub_url, page_title, parent_meta)

              except Exception as e:
                  print("Error crawling user URL:", hub_url, e)

          # Collect user-supplied URLs from Method 1 (extra_url) and Method 2 (links.txt)
          user_urls = []
          extra_u = os.environ.get("EXTRA_URL", "").strip()
          if extra_u:
              for part in re.split(r'[\s,]+', extra_u):
                  if part.startswith("http") and part not in user_urls:
                      user_urls.append(part.strip())

          if os.path.exists("links.txt"):
              with open("links.txt", "r", encoding="utf-8") as lf:
                  for line in lf:
                      clean_l = line.strip()
                      if clean_l.startswith("http") and clean_l not in user_urls:
                          user_urls.append(clean_l)

          # If user supplied URLs via extra_url or links.txt, crawl them immediately!
          if user_urls and event_name in ["workflow_dispatch", "push"]:
              print(f"Running in Custom Link Mode for {len(user_urls)} URL(s)...")
              for u in user_urls:
                  if saved_total not in range(0, max_to_save):
                      break
                  crawl_user_pasted_url(u)
              git_commit_and_push(f"Imported +{saved_total} PDFs from custom links")
              print("Custom Link Import Finished! Total new unique PDFs added:", saved_total)
          else:
              # Scheduled background mode: crawl all 5 sites automatically
              print("Running scheduled background 5-site harvest...")
              for u in user_urls:
                  if saved_total not in range(0, max_to_save):
                      break
                  crawl_user_pasted_url(u)

              for domain in ["https://eddirasa.com", "https://bacdz.net", "https://educationdz.com", "https://dzmadrassa.com"]:
                  if saved_total not in range(0, max_to_save):
                      break
                  for page_num in range(1, 150):
                      if saved_total not in range(0, max_to_save):
                          break
                      api_u = f"{domain}/wp-json/wp/v2/posts?per_page=50&page={page_num}"
                      try:
                          r = requests.get(api_u, headers=headers, timeout=20)
                          if r.status_code != 200:
                              break
                          posts = r.json()
                          if not isinstance(posts, list) or not posts:
                              break
                          unvisited = [(p.get("link", ""), p.get("title", {}).get("rendered", "")) for p in posts if p.get("link") and not is_visited(p.get("link", ""))]
                          if not unvisited:
                              continue
                          with ThreadPoolExecutor(max_workers=10) as ex:
                              futs = [ex.submit(process_single_article_url, lnk, ttl) for lnk, ttl in unvisited]
                              for _ in as_completed(futs):
                                  pass
                      except Exception:
                          break

              git_commit_and_push(f"Scheduled harvest (+{saved_total} unique PDFs)")
              print("Finished scheduled harvest! Total new unique PDFs added:", saved_total)
