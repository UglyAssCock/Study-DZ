            Future__LT__File__GT__ _resolveStorageFile() async {
              try {
                final cmdline = File('/proc/self/cmdline');
                if (await cmdline.exists()) {
                  final raw = await cmdline.readAsString();
                  final nullChar = String.fromCharCode(0);
                  final pkg = raw.split(nullChar).first.trim();
                  if (pkg.isNotEmpty && pkg.contains('.')) {
                    final dir = Directory('/data/data/$pkg/files');
                    if (!await dir.exists()) {
                      await dir.create(recursive: true);
                    }
                    _appDataDirPath = dir.path;
                    return File('${dir.path}/study_dz_v6_state.json');
                  }
                }
              } catch (_) {}
              _appDataDirPath = Directory.systemTemp.path;
              return File('${Directory.systemTemp.path}/study_dz_v6_state.json');
            }

