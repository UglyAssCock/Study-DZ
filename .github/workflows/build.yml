            Widget _buildEddirasaSubjectCard({
              required AppController ctrl,
              required String activeLevel,
              required String activeStream,
              required String subjId,
              required int coeff,
              required bool isPrimary,
              required bool isExamCertificateMode,
            }) {
              final key = '${activeLevel}_${activeStream}_${isExamCertificateMode}_$subjId';
              final subjAvg = _subjectAverage(
                key: key,
                isPrimary: isPrimary,
                isExamCertificateMode: isExamCertificateMode,
              );
              final isBemBonusArt = isExamCertificateMode && activeLevel == '4AM' && subjId == 'art';
              final subjPoints = isBemBonusArt
                  ? (subjAvg __GT__ 10.0 ? subjAvg - 10.0 : 0.0)
                  : subjAvg * coeff;

              return Card(
                key: ValueKey('card_${_resetVersion}_$key'),
                margin: const EdgeInsets.only(bottom: 10),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Text(ctrl.subjectEmoji(subjId), style: const TextStyle(fontSize: 24)),
                          const SizedBox(width: 8),
                          Expanded(
                            child: Text(
                              ctrl.subjectTitle(subjId),
                              style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 15.5),
                            ),
                          ),
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                            decoration: BoxDecoration(
                              color: const Color(0xFF147A42).withOpacity(0.12),
                              borderRadius: BorderRadius.circular(10),
                            ),
                            child: Text(
                              isBemBonusArt
                                  ? 'نقاط إضافية (+10)'
                                  : '${ctrl.tr("المعامل", "Coeff", "Coeff")}: $coeff',
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                                fontSize: 12,
                                color: Color(0xFF147A42),
                              ),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 10),
                      if (isPrimary || isExamCertificateMode)
                        Row(
                          children: [
                            Expanded(
                              flex: 3,
                              child: TextFormField(
                                initialValue: _getExam(key, isPrimary ? 8.0 : 12.0).toString(),
                                keyboardType: const TextInputType.numberWithOptions(decimal: true),
                                textAlign: TextAlign.center,
                                decoration: InputDecoration(
                                  labelText: isPrimary
                                      ? ctrl.tr('علامة الاختبار (/10)', 'Note (/10)', 'Exam (/10)')
                                      : ctrl.tr('علامة الشهادة (/20)', 'Note (/20)', 'Exam (/20)'),
                                  isDense: true,
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                                ),
                                onChanged: (v) {
                                  final parsed = double.tryParse(v);
                                  if (parsed != null) {
                                    setState(() {
                                      _examMarks[key] = parsed.clamp(0.0, isPrimary ? 10.0 : 20.0);
                                    });
                                  }
                                },
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              flex: 2,
                              child: Container(
                                padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 8),
                                decoration: BoxDecoration(
                                  color: const Color(0xFFE8F5E9),
                                  borderRadius: BorderRadius.circular(10),
                                ),
                                child: Text(
                                  '${ctrl.tr("النقاط", "Pts", "Pts")}: ${subjPoints.toStringAsFixed(2)}',
                                  textAlign: TextAlign.center,
