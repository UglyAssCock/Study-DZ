            // Returns the Exam Subject files for the chosen cycle, subject, stream, and year (2008-2026)
            List__LT__Map__LT__String, dynamic__GT____GT__ getOfficialArchiveItems({
              required String cycleCode,
              required String subjectId,
              required String streamCode,
              required int year,
            }) {
              return uploadedFiles.where((f) {
                if (f['is_archive'] != true) return false;
                if ((f['archive_cycle']?.toString() ?? '') != cycleCode) return false;
                if ((f['subject']?.toString() ?? '') != subjectId) return false;
                final fYear = int.tryParse(f['year']?.toString() ?? '0') ?? 0;
                if (fYear != year) return false;
                if (cycleCode == 'secondaire') {
                  final fStream = (f['stream']?.toString() ?? 'ALL').toUpperCase();
