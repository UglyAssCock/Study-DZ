          class FileViewerPage extends StatefulWidget {
            final Map__LT__String, dynamic__GT__ fileItem;

            const FileViewerPage({super.key, required this.fileItem});

            @override
            State__LT__FileViewerPage__GT__ createState() =__GT__ _FileViewerPageState();
          }

          class _FileViewerPageState extends State__LT__FileViewerPage__GT__ {
            static const _pdfChannel = MethodChannel('dz.studydz.app/pdf');
            File? _localFile;
            int _pageCount = 0;
            int _currentPage = 0;
            Uint8List? _pageBytes;
            bool _loading = true;
            String? _error;
            bool _initialized = false;

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();
              if (!_initialized) {
                _initialized = true;
                _prepareAndOpenFile();
              }
            }

            Future__LT__void__GT__ _prepareAndOpenFile() async {
              final ctrl = AppScope.of(context);
              setState(() {
                _loading = true;
                _error = null;
              });

              try {
                final cachedFile = await ctrl.downloadAndCacheFile(widget.fileItem);
                _localFile = cachedFile;

                if (widget.fileItem['type'] == 'pdf') {
                  final count = await _pdfChannel.invokeMethod__LT__int__GT__(
                    'getPageCount',
                    {'path': cachedFile.path},
                  );
                  _pageCount = count ?? 0;
                  if (_pageCount __GT__ 0) {
                    await _loadPage(0);
                  } else {
                    setState(() {
                      _loading = false;
                      _error = 'ملف PDF فارغ';
                    });
                  }
                } else {
                  setState(() =__GT__ _loading = false);
                }
              } catch (e) {
                setState(() {
                  _loading = false;
                  _error = 'تأكد من اتصالك بالإنترنت عند فتح الملف لأول مرة فقط.\n($e)';
                });
              }
            }

            Future__LT__void__GT__ _loadPage(int pageIdx) async {
              if (_localFile == null) return;
              setState(() =__GT__ _loading = true);
              try {
                final bytes = await _pdfChannel.invokeMethod__LT__Uint8List__GT__(
                  'renderPage',
                  {'path': _localFile!.path, 'pageIndex': pageIdx},
                );
                setState(() {
                  _currentPage = pageIdx;
                  _pageBytes = bytes;
                  _loading = false;
                });
              } catch (e) {
                setState(() {
                  _loading = false;
                  _error = e.toString();
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              final title = widget.fileItem['title']?.toString() ?? '';
              final isPdf = widget.fileItem['type'] == 'pdf';

              return Scaffold(
                appBar: AppBar(
                  title: Text(title),
                ),
                body: _loading
                    ? const Center(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            CircularProgressIndicator(),
                            SizedBox(height: 14),
                            Text('جاري التحميل والحفظ للمطالعة بدون إنترنت...'),
                          ],
                        ),
                      )
                    : _error != null
                        ? Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.wifi_off, size: 52, color: Colors.red),
                                  const SizedBox(height: 12),
                                  Text(_error!, textAlign: TextAlign.center),
                                  const SizedBox(height: 14),
                                  FilledButton.icon(
                                    onPressed: _prepareAndOpenFile,
                                    icon: const Icon(Icons.refresh),
                                    label: const Text('إعادة المحاولة'),
                                  ),
                                ],
                              ),
                            ),
                          )
                        : !isPdf
                            ? InteractiveViewer(
                                minScale: 0.8,
                                maxScale: 5.0,
                                child: Center(
                                  child: Image.file(_localFile!, fit: BoxFit.contain),
                                ),
                              )
                            : Column(
                                children: [
                                  Expanded(
                                    child: InteractiveViewer(
                                      minScale: 0.8,
                                      maxScale: 5.0,
                                      child: Center(
                                        child: _pageBytes != null
                                            ? Image.memory(_pageBytes!, fit: BoxFit.contain)
                                            : const SizedBox.shrink(),
                                      ),
                                    ),
                                  ),
                                  if (_pageCount __GT__ 1)
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                                      color: const Color(0xFF147A42),
                                      child: Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          IconButton(
                                            color: Colors.white,
                                            onPressed: _currentPage __GT__ 0
                                                ? () =__GT__ _loadPage(_currentPage - 1)
                                                : null,
                                            icon: const Icon(Icons.navigate_before),
                                          ),
                                          Text(
                                            'صفحة ${_currentPage + 1} من $_pageCount',
                                            style: const TextStyle(
                                              color: Colors.white,
                                              fontWeight: FontWeight.bold,
                                            ),
                                          ),
                                          IconButton(
                                            color: Colors.white,
                                            onPressed: _currentPage + 1 __LT__ _pageCount
                                                ? () =__GT__ _loadPage(_currentPage + 1)
                                                : null,
                                            icon: const Icon(Icons.navigate_next),
                                          ),
                                        ],
                                      ),
                                    ),
                                ],
                              ),
              );
            }
          }
          ''')

          # 10. Add google_mobile_ads to pubspec.yaml and set minSdk = 23 in build.gradle
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              pub = f.read()
          pub = re.sub(r"^name:\s*.*$", "name: study_dz", pub, flags=re.MULTILINE)
          if "google_mobile_ads:" not in pub:
              pub = pub.replace("dependencies:\n", "dependencies:\n  google_mobile_ads: ^5.1.0\n", 1)
          if "dependency_overrides:" not in pub:
              pub += "\ndependency_overrides:\n  flutter_tts: 4.0.2\n  flutter_local_notifications: 17.2.3\n  shared_preferences: 2.2.3\n  path_provider: 2.1.4\n  sqflite: 2.3.3+1\n"
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(pub)

          # 11. Upgrade AGP & Kotlin in android/settings.gradle
          with open("android/settings.gradle", "r", encoding="utf-8") as f:
              sg = f.read()
          sg = re.sub(r'id\s+"com\.android\.application"\s+version\s+"[^"]+"', 'id "com.android.application" version "8.3.2"', sg)
          sg = re.sub(r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"', 'id "org.jetbrains.kotlin.android" version "1.9.24"', sg)
          with open("android/settings.gradle", "w", encoding="utf-8") as f:
              f.write(sg)

          # 12. Upgrade Gradle Wrapper to 8.4
          gw_path = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(gw_path, "r", encoding="utf-8") as f:
              gw = f.read()
          gw = re.sub(r"gradle-.*-all\.zip", "gradle-8.4-all.zip", gw)
          with open(gw_path, "w", encoding="utf-8") as f:
              f.write(gw)

          # 13. Write android/app/build.gradle (minSdk 23 required for Google Mobile Ads 5.x)
          write_file("android/app/build.gradle", r'''plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "dz.studydz.app"
              compileSdk = 34
              ndkVersion = "25.1.8937393"

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "dz.studydz.app"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 6
                  versionName = "6.0.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          ''')

          # 14. Copy custom app icon if present
          for icon_candidate in ["icon.png", "assets/icon.png"]:
              if os.path.exists(icon_candidate):
                  for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                      dest = os.path.join("android/app/src/main/res", folder, "ic_launcher.png")
                      if os.path.exists(os.path.dirname(dest)):
                          shutil.copy2(icon_candidate, dest)

          # 15. Build Release APK
          run_cmd(["flutter", "pub", "get"])
          run_cmd(["flutter", "build", "apk", "--release", "--no-tree-shake-icons"])

      - name: Check Final APK Size
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          ls -lh "$APK_PATH"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-DZ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
