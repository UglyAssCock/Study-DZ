                  detectedLevel.endsWith('AM')) {
                archiveCycle = 'moyen';
              }

              final categoryPatterns = __LT__String, List__LT__String__GT____GT__{
                'books': ['book', 'livre', 'manuel', 'كتاب', 'كتب'],
                'exams': ['exam', 'sujet', 'اختبار', 'اختبارات', 'امتحان'],
                'tests': ['test', 'devoir', 'فرض', 'فروض'],
                'summaries': ['resum', 'summar', 'ملخص', 'ملخصات'],
                'lessons': ['lesson', 'cours', 'درس', 'دروس'],
              };

              String detectedCategory = 'lessons';
              for (final entry in categoryPatterns.entries) {
                if (entry.value.any((k) =__GT__ token.contains(k))) {
                  detectedCategory = entry.key;
                  break;
                }
              }

              int detectedTrim = 1;
              if (['t2', 'f2', 'trim2', 'ف2', 'فصل2', 'ثاني'].any((k) =__GT__ token.contains(k))) {
                detectedTrim = 2;
              } else if (['t3', 'f3', 'trim3', 'ف3', 'فصل3', 'ثالث'].any((k) =__GT__ token.contains(k))) {
                detectedTrim = 3;
