                '1AM': ['1am', '1_am', '1متوسط', 'اولى_متوسط', 'أولى_متوسط'],
                '2AM': ['2am', '2_am', '2متوسط', 'ثانية_متوسط'],
                '3AM': ['3am', '3_am', '3متوسط', 'ثالثة_متوسط'],
                '4AM': ['4am', '4_am', 'bem', '4متوسط', 'رابعة_متوسط', 'بيام'],
                '1AS': ['1as', '1_as', '1ثانوي', 'اولى_ثانوي', 'أولى_ثانوي'],
