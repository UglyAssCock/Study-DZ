ame: build-apk

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'files/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Complete App with All 4 Rewarded Ads and Build APK
        shell: python
        run: |
          import os
          import re
          import json
          import shutil
          import subprocess

          # =====================================================================
          # ضع أكواد حسابك في Google AdMob هنا بين علامتي التنصيص:
          # =====================================================================
          ADMOB_APP_ID = "ca-app-pub-7333057565331280~9422146056"
          ADMOB_BANNER_ID = "ca-app-pub-7333057565331280/1755409026"
          ADMOB_INTERSTITIAL_ID = "ca-app-pub-7333057565331280/1489309001"
          ADMOB_APP_OPEN_ID = "ca-app-pub-7333057565331280/2070389782"
          ADMOB_REWARDED_ID = "ca-app-pub-7333057565331280/9286322795"
          # =====================================================================

          LT = chr(60)
          GT = chr(62)

          repo_full_name = os.environ.get("GITHUB_REPOSITORY", "UglyAssCock/Study-DZ")
          repo_branch = os.environ.get("GITHUB_REF_NAME", "main")

          def restore_angles(text):
              return (
                  text.replace("__LT__", LT)
                  .replace("__GT__", GT)
                  .replace("__GITHUB_REPO__", repo_full_name)
                  .replace("__GITHUB_BRANCH__", repo_branch)
                  .replace("__ADMOB_APP_ID__", ADMOB_APP_ID.strip())
                  .replace("__ADMOB_BANNER_ID__", ADMOB_BANNER_ID.strip())
                  .replace("__ADMOB_INTERSTITIAL_ID__", ADMOB_INTERSTITIAL_ID.strip())
                  .replace("__ADMOB_APP_OPEN_ID__", ADMOB_APP_OPEN_ID.strip())
                  .replace("__ADMOB_REWARDED_ID__", ADMOB_REWARDED_ID.strip())
              )

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(restore_angles(content))

          def run_cmd(cmd):
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)

          # 1. Generate Android platform folder
          run_cmd([
              "flutter", "create",
              "--platforms=android",
              "--project-name", "study_dz",
              "--org", "dz.studydz.app",
              "."
          ])

          # 2. Wipe old lib/ completely so no old files remain
          if os.path.exists("lib"):
              shutil.rmtree("lib")
          os.makedirs("lib/screens", exist_ok=True)

          # 3. Write clean pubspec.yaml
          write_file("pubspec.yaml", r"""name: study_dz
          description: Study DZ Algerian Educational App
          publish_to: 'none'
          version: 7.0.0+7

          environment:
            sdk: '__GT__=3.0.0 __LT__4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            google_mobile_ads: ^5.1.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/
          """)

          # 4. Keep APK small & clean
          if os.path.exists("assets/offline_study_pack.bin"):
              os.remove("assets/offline_study_pack.bin")
          os.makedirs("assets", exist_ok=True)
          with open("assets/auto_catalog.json", "w", encoding="utf-8") as f:
              json.dump([], f)

          # 5. Write MainActivity.kt with native PdfRenderer
          if os.path.exists("android/app/src/main/kotlin"):
              shutil.rmtree("android/app/src/main/kotlin")
          if os.path.exists("android/app/src/main/java"):
              shutil.rmtree("android/app/src/main/java")

          write_file(
              "android/app/src/main/kotlin/dz/studydz/app/MainActivity.kt",
              r"""package dz.studydz.app

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.os.ParcelFileDescriptor
          import io.flutter.FlutterInjector
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "dz.studydz.app/pdf"

              private fun resolvePdfFile(pathOrAsset: String): File {
                  val directFile = File(pathOrAsset)
                  if (directFile.exists() && directFile.length() != 0L) {
                      return directFile
                  }
                  val loader = FlutterInjector.instance().flutterLoader()
                  val lookupKey = loader.getLookupKeyForAsset(pathOrAsset)
                  val safeName = pathOrAsset.replace("/", "_")
                  val outFile = File(cacheDir, safeName)
                  if (!outFile.exists() || outFile.length() == 0L) {
                      assets.open(lookupKey).use { input -__GT__
                          FileOutputStream(outFile).use { output -__GT__
                              input.copyTo(output)
                          }
                      }
                  }
                  return outFile
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result -__GT__
                      try {
                          when (call.method) {
                              "getPageCount" -__GT__ {
                                  val path = call.argument__LT__String__GT__("path") ?: ""
                                  val file = resolvePdfFile(path)
                                  val pfd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY)
                                  val renderer = PdfRenderer(pfd)
                                  val count = renderer.pageCount
                                  renderer.close()
                                  pfd.close()
                                  result.success(count)
                              }
                              "renderPage" -__GT__ {
                                  val path = call.argument__LT__String__GT__("path") ?: ""
                                  val pageIndex = call.argument__LT__Int__GT__("pageIndex") ?: 0
                                  val file = resolvePdfFile(path)
                                  val pfd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY)
                                  val renderer = PdfRenderer(pfd)
                                  val page = renderer.openPage(pageIndex)
                                  val width = page.width * 2
                                  val height = page.height * 2
                                  val bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                                  val canvas = Canvas(bitmap)
                                  canvas.drawColor(Color.WHITE)
                                  page.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                  page.close()
                                  renderer.close()
                                  pfd.close()

                                  val stream = ByteArrayOutputStream()
                                  bitmap.compress(Bitmap.CompressFormat.PNG, 90, stream)
                                  bitmap.recycle()
                                  result.success(stream.toByteArray())
                              }
                              else -__GT__ result.notImplemented()
                          }
                      } catch (e: Exception) {
                          result.error("PDF_ERR", e.message, null)
                      }
                  }
              }
          }
          """
          )

          # 6. Write AndroidManifest.xml with Google AdMob APPLICATION_ID meta-data
          write_file(
              "android/app/src/main/AndroidManifest.xml",
              r"""__LT__manifest xmlns:android="http://schemas.android.com/apk/res/android"__GT__
              __LT__uses-permission android:name="android.permission.INTERNET"/__GT__
              __LT__uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/__GT__
              __LT__uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/__GT__
              __LT__uses-permission android:name="com.google.android.gms.permission.AD_ID"/__GT__

              __LT__application
                  android:label="ستدي دي زد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"__GT__

                  __LT__meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="__ADMOB_APP_ID__"/__GT__

                  __LT__activity
                      android:name="dz.studydz.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"__GT__
                      __LT__meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        /__GT__
                      __LT__intent-filter__GT__
                          __LT__action android:name="android.intent.action.MAIN"/__GT__
                          __LT__category android:name="android.intent.category.LAUNCHER"/__GT__
                      __LT__/intent-filter__GT__
                  __LT__/activity__GT__
                  __LT__meta-data
                      android:name="flutterEmbedding"
                      android:value="2" /__GT__
              __LT__/application__GT__
          __LT__/manifest__GT__
          """
          )

          # 7. FILE 1 OF 7: lib/main.dart
          write_file("lib/main.dart", r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';

          import 'screens/onboarding_screen.dart';
          import 'screens/home_shell.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await MobileAds.instance.initialize();
            } catch (_) {}
            final controller = AppController();
            await controller.initialize();
            AdHelper.loadAndShowAppOpenAd();
            AdHelper.loadInterstitial();
            AdHelper.loadRewarded();
            runApp(StudyDzApp(controller: controller));
          }

          class AdHelper {
            static const String appOpenUnitId = '__ADMOB_APP_OPEN_ID__';
            static const String bannerUnitId = '__ADMOB_BANNER_ID__';
            static const String interstitialUnitId = '__ADMOB_INTERSTITIAL_ID__';
            static const String rewardedUnitId = '__ADMOB_REWARDED_ID__';

            static AppOpenAd? _appOpenAd;
            static bool _isShowingAppOpen = false;
            static InterstitialAd? _interstitialAd;
            static bool _isLoadingInterstitial = false;
            static RewardedAd? _rewardedAd;
            static bool _isLoadingRewarded = false;

            // ميزة المكافأة 1: جلسة مراجعة لمدة 60 دقيقة بدون إعلانات
            static DateTime? adFreeUntil;

            static bool get isAdFreeActive {
              if (adFreeUntil == null) return false;
              return DateTime.now().isBefore(adFreeUntil!);
            }

            static int get adFreeRemainingMinutes {
              if (!isAdFreeActive) return 0;
              return adFreeUntil!.difference(DateTime.now()).inMinutes + 1;
            }

            static void activateOneHourAdFree() {
              adFreeUntil = DateTime.now().add(const Duration(minutes: 60));
            }

            // 1. إعلان فتح التطبيق (App Open Ad)
            static void loadAndShowAppOpenAd() {
              if (isAdFreeActive || _isShowingAppOpen) return;
              AppOpenAd.load(
                adUnitId: appOpenUnitId,
                request: const AdRequest(),
                adLoadCallback: AppOpenAdLoadCallback(
                  onAdLoaded: (ad) {
                    if (isAdFreeActive) {
                      ad.dispose();
                      return;
                    }
                    _appOpenAd = ad;
                    _isShowingAppOpen = true;
                    _appOpenAd!.fullScreenContentCallback = FullScreenContentCallback(
                      onAdDismissedFullScreenContent: (ad) {
                        _isShowingAppOpen = false;
                        ad.dispose();
                        _appOpenAd = null;
                      },
                      onAdFailedToShowFullScreenContent: (ad, _) {
                        _isShowingAppOpen = false;
                        ad.dispose();
                        _appOpenAd = null;
                      },
                    );
                    _appOpenAd!.show();
                  },
                  onAdFailedToLoad: (_) {
                    _appOpenAd = null;
                  },
                ),
              );
            }

            // 2. الإعلان البيني الكامل (Interstitial Ad)
            static void loadInterstitial() {
              if (_isLoadingInterstitial || _interstitialAd != null) return;
              _isLoadingInterstitial = true;
              InterstitialAd.load(
                adUnitId: interstitialUnitId,
                request: const AdRequest(),
                adLoadCallback: InterstitialAdLoadCallback(
                  onAdLoaded: (ad) {
                    _interstitialAd = ad;
                    _isLoadingInterstitial = false;
                  },
                  onAdFailedToLoad: (_) {
                    _interstitialAd = null;
                    _isLoadingInterstitial = false;
                  },
                ),
              );
            }

            static void showInterstitialIfReady() {
              if (isAdFreeActive) return;
              if (_interstitialAd != null) {
                _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _interstitialAd = null;
                    loadInterstitial();
                  },
                  onAdFailedToShowFullScreenContent: (ad, _) {
                    ad.dispose();
                    _interstitialAd = null;
                    loadInterstitial();
                  },
                );
                _interstitialAd!.show();
                _interstitialAd = null;
              } else {
                loadInterstitial();
              }
            }

            // 3. إعلان المكافأة بالفيديو (Rewarded Video Ad) للميزات الأربع
            static void loadRewarded() {
              if (_isLoadingRewarded || _rewardedAd != null) return;
              _isLoadingRewarded = true;
              RewardedAd.load(
                adUnitId: rewardedUnitId,
                request: const AdRequest(),
                rewardedAdLoadCallback: RewardedAdLoadCallback(
                  onAdLoaded: (ad) {
                    _rewardedAd = ad;
                    _isLoadingRewarded = false;
                  },
                  onAdFailedToLoad: (_) {
                    _rewardedAd = null;
                    _isLoadingRewarded = false;
                  },
                ),
              );
            }

            static void showRewardedAd(
              BuildContext context, {
              required String rewardTitle,
              required VoidCallback onRewardEarned,
            }) {
              if (_rewardedAd != null) {
                bool earned = false;
                _rewardedAd!.fullScreenContentCallback = FullScreenContentCallback(
                  onAdDismissedFullScreenContent: (ad) {
                    ad.dispose();
                    _rewardedAd = null;
                    loadRewarded();
                    if (earned) {
                      onRewardEarned();
                    }
                  },
                  onAdFailedToShowFullScreenContent: (ad, _) {
                    ad.dispose();
                    _rewardedAd = null;
                    loadRewarded();
                    onRewardEarned();
                  },
                );
                _rewardedAd!.show(
                  onUserEarnedReward: (_, __) {
                    earned = true;
                  },
                );
                _rewardedAd = null;
              } else {
                loadRewarded();
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('🎁 تم تفعيل: $rewardTitle')),
                );
                onRewardEarned();
              }
            }
          }

          class StudyBannerAdWidget extends StatefulWidget {
            const StudyBannerAdWidget({super.key});

            @override
            State__LT__StudyBannerAdWidget__GT__ createState() =__GT__ _StudyBannerAdWidgetState();
          }

          class _StudyBannerAdWidgetState extends State__LT__StudyBannerAdWidget__GT__ {
            BannerAd? _bannerAd;
            bool _isLoaded = false;

            @override
            void initState() {
              super.initState();
              if (AdHelper.isAdFreeActive) return;
              _bannerAd = BannerAd(
                adUnitId: AdHelper.bannerUnitId,
                size: AdSize.banner,
                request: const AdRequest(),
                listener: BannerAdListener(
                  onAdLoaded: (_) {
                    if (mounted) {
                      setState(() =__GT__ _isLoaded = true);
                    }
                  },
                  onAdFailedToLoad: (ad, _) {
                    ad.dispose();
                  },
                ),
              )..load();
            }

            @override
            void dispose() {
              _bannerAd?.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (AdHelper.isAdFreeActive || !_isLoaded || _bannerAd == null) {
                return const SizedBox.shrink();
              }
              return SafeArea(
                top: false,
                child: Container(
                  alignment: Alignment.center,
                  width: double.infinity,
                  height: _bannerAd!.size.height.toDouble(),
                  color: Colors.transparent,
                  child: SizedBox(
                    width: _bannerAd!.size.width.toDouble(),
                    height: _bannerAd!.size.height.toDouble(),
                    child: AdWidget(ad: _bannerAd!),
                  ),
                ),
              );
            }
          }

          class AppScope extends InheritedNotifier__LT__AppController__GT__ {
            const AppScope({
              super.key,
              required AppController controller,
              required super.child,
            }) : super(notifier: controller);

            static AppController of(BuildContext context) {
              final scope = context.dependOnInheritedWidgetOfExactType__LT__AppScope__GT__();
              return scope!.notifier!;
            }
          }

          class StudyDzApp extends StatelessWidget {
            final AppController controller;

            const StudyDzApp({super.key, required this.controller});

            @override
            Widget build(BuildContext context) {
              return AppScope(
                controller: controller,
                child: AnimatedBuilder(
                  animation: controller,
                  builder: (context, _) {
                    final isAr = controller.languageCode == 'ar';
                    const primaryGreen = Color(0xFF147A42);
                    const accentGold = Color(0xFFF5B800);

                    final lightScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: primaryGreen,
                      secondary: accentGold,
                      brightness: Brightness.light,
                      surface: const Color(0xFFF3F6F3),
                    );

                    final darkScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: const Color(0xFF2ECC71),
                      secondary: accentGold,
                      brightness: Brightness.dark,
                      surface: const Color(0xFF121A15),
                    );

                    return MaterialApp(
                      debugShowCheckedModeBanner: false,
                      title: 'Study DZ • ستدي دي زد',
                      themeMode: controller.isDarkMode ? ThemeMode.dark : ThemeMode.light,
                      theme: ThemeData(
                        useMaterial3: true,
                        colorScheme: lightScheme,
                        scaffoldBackgroundColor: const Color(0xFFF1F4F1),
                        cardTheme: CardTheme(
                          elevation: 0.8,
                          color: const Color(0xFFF9F9F5),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(22),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: primaryGreen,
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      darkTheme: ThemeData(
                        useMaterial3: true,
                        colorScheme: darkScheme,
                        scaffoldBackgroundColor: const Color(0xFF0D1410),
                        cardTheme: CardTheme(
                          elevation: 1,
                          color: const Color(0xFF19241D),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(22),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: Color(0xFF0A4F29),
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      builder: (context, child) {
                        return Directionality(
                          textDirection: isAr ? TextDirection.rtl : TextDirection.ltr,
                          child: child ?? const SizedBox.shrink(),
                        );
                      },
                      home: controller.hasCompletedOnboarding
                          ? const HomeShell()
                          : const OnboardingScreen(),
                    );
                  },
                ),
              );
            }
          }

          class StudentProfile {
            String id;
            String name;
            String gender;
            String levelCode;
            String streamCode;

            StudentProfile({
              required this.id,
              required this.name,
              this.gender = 'male',
              this.levelCode = '3AS',
              this.streamCode = 'SE',
            });

            Map__LT__String, dynamic__GT__ toJson() =__GT__ {
                  'id': id,
                  'name': name,
                  'gender': gender,
                  'levelCode': levelCode,
                  'streamCode': streamCode,
                };

            factory StudentProfile.fromJson(Map__LT__String, dynamic__GT__ json) {
              return StudentProfile(
                id: json['id']?.toString() ?? 'p1',
                name: json['name']?.toString() ?? 'الوليد',
                gender: json['gender']?.toString() ?? 'male',
                levelCode: json['levelCode']?.toString() ?? '3AS',
                streamCode: json['streamCode']?.toString() ?? 'SE',
              );
            }
          }

