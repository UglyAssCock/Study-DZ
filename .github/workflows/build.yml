          # 11. Write lib/screens/tools_screen.dart (with Average Calculator, Study Planner, AI Tutor, Pomodoro, Calendar)
          write_file("lib/screens/tools_screen.dart", r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import '../main.dart';

          class ToolsScreen extends StatefulWidget {
            const ToolsScreen({super.key});

            @override
            State__LT__ToolsScreen__GT__ createState() =__GT__ _ToolsScreenState();
          }

          class _ToolsScreenState extends State__LT__ToolsScreen__GT__ {
            final Map__LT__String, double__GT__ _marks = {};
            double? _avgResult;

            final _aiCtrl = TextEditingController();
            final List__LT__Map__LT__String, String__GT____GT__ _chat = [
              {
                'role': 'ai',
                'text': 'مرحباً بك في المساعد الذكي (Study DZ AI) 🤖🇩🇿!\nاسألني حول أي درس أو تمرين بالعربية أو الفرنسية.',
              }
            ];

            int _pomoSeconds = 25 * 60;
            bool _pomoRunning = false;
            Timer? _pomoTimer;

            @override
            void dispose() {
              _pomoTimer?.cancel();
              _aiCtrl.dispose();
              super.dispose();
            }

            void _togglePomodoro(AppController ctrl) {
              if (_pomoRunning) {
                _pomoTimer?.cancel();
                setState(() =__GT__ _pomoRunning = false);
              } else {
                setState(() =__GT__ _pomoRunning = true);
                _pomoTimer = Timer.periodic(const Duration(seconds: 1), (_) {
                  if (_pomoSeconds __LT__= 1) {
                    _pomoTimer?.cancel();
                    ctrl.recordStudyProgress(subjectId: 'math', minutesAdded: 25, xpAdded: 50);
                    if (mounted) {
                      setState(() {
                        _pomoRunning = false;
                        _pomoSeconds = 25 * 60;
                      });
                    }
                  } else if (mounted) {
                    setState(() =__GT__ _pomoSeconds--);
                  }
                });
              }
            }

            Future__LT__void__GT__ _askAi(AppController ctrl) async {
              final q = _aiCtrl.text.trim();
              if (q.isEmpty) return;
              _aiCtrl.clear();
              setState(() {
                _chat.add({'role': 'user', 'text': q});
              });

              if (ctrl.geminiApiKey.trim().isNotEmpty) {
                try {
                  final client = HttpClient();
                  final uri = Uri.parse(
                    'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${ctrl.geminiApiKey.trim()}',
                  );
                  final req = await client.postUrl(uri);
                  req.headers.set('Content-Type', 'application/json; charset=utf-8');
                  req.add(utf8.encode(jsonEncode({
                    'contents': [
                      {'parts': [{'text': 'أجب كتلميذ وأستاذ جزائري باختصار: $q'}]}
                    ]
                  })));
                  final resp = await req.close().timeout(const Duration(seconds: 12));
                  final body = await resp.transform(utf8.decoder).join();
                  final data = jsonDecode(body);
                  final text = data['candidates']?[0]?['content']?['parts']?[0]?['text']?.toString();
                  if (text != null && mounted) {
                    setState(() =__GT__ _chat.add({'role': 'ai', 'text': text}));
                    return;
                  }
                } catch (_) {}
              }

              setState(() {
                _chat.add({
                  'role': 'ai',
                  'text': '📘 شرح منهجي سريع:\n1) استخرج المعطيات الأساسية من نص التمرين.\n2) طبق العلاقة الرياضية أو القاعدة النحوية المناسبة.\n(يمكنك إضافة مفتاح Gemini API من الإعدادات لتفعيل الإجابات السحابية المباشرة).',
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              final ctrl = AppScope.of(context);
              final subjects = ctrl.subjectsForCurrentProfile();
              final mins = (_pomoSeconds ~/ 60).toString().padLeft(2, '0');
              final secs = (_pomoSeconds % 60).toString().padLeft(2, '0');

              return DefaultTabController(
                length: 4,
                child: Scaffold(
                  appBar: AppBar(
                    title: Text(ctrl.tr('أدواتي الدراسية', 'Mes Outils')),
                    bottom: TabBar(
                      isScrollable: true,
                      labelColor: Colors.white,
                      unselectedLabelColor: Colors.white70,
                      tabs: [
                        Tab(text: ctrl.tr('حاسبة المعدل', 'Moyenne')),
                        Tab(text: ctrl.tr('المساعد الذكي AI', 'Tuteur IA')),
                        Tab(text: ctrl.tr('مؤقت بومودورو', 'Pomodoro')),
                        Tab(text: ctrl.tr('رزنامة الامتحانات', 'Calendrier')),
                      ],
                    ),
                  ),
                  body: TabBarView(
                    children: [
                      ListView(
                        padding: const EdgeInsets.all(16),
                        children: [
                          for (final s in subjects)
                            Padding(
                              padding: const EdgeInsets.only(bottom: 10),
                              child: Row(
                                children: [
                                  Expanded(
                                    flex: 3,
                                    child: Text(
                                      '${s['emoji']} ${ctrl.tr(s['ar'] as String, s['fr'] as String)} (معامل ${ctrl.getSubjectCoefficient(s['id'] as String)})',
                                      style: const TextStyle(fontWeight: FontWeight.bold),
                                    ),
                                  ),
                                  Expanded(
                                    flex: 2,
                                    child: TextFormField(
                                      initialValue: '14',
                                      keyboardType: TextInputType.number,
                                      decoration: const InputDecoration(
                                        suffixText: '/20',
                                        border: OutlineInputBorder(),
                                        isDense: true,
                                      ),
                                      onChanged: (v) {
                                        final parsed = double.tryParse(v);
                                        if (parsed != null) {
                                          _marks[s['id'] as String] = parsed.clamp(0.0, 20.0);
                                        }
                                      },
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          const SizedBox(height: 12),
                          FilledButton(
                            style: FilledButton.styleFrom(backgroundColor: const Color(0xFF0B7A3E)),
                            onPressed: () {
                              double sum = 0;
                              int coeffs = 0;
                              for (final s in subjects) {
                                final id = s['id'] as String;
                                final c = ctrl.getSubjectCoefficient(id);
                                sum += (_marks[id] ?? 14.0) * c;
                                coeffs += c;
                              }
                              setState(() =__GT__ _avgResult = coeffs == 0 ? 0 : sum / coeffs);
                            },
                            child: Text(ctrl.tr('احسب المعدل الآن', 'Calculer')),
                          ),
                          if (_avgResult != null) ...[
                            const SizedBox(height: 14),
                            Card(
                              color: const Color(0xFFE8F5E9),
                              child: Padding(
                                padding: const EdgeInsets.all(16),
                                child: Text(
                                  'المعدل الفصلي / الرسمي: ${_avgResult!.toStringAsFixed(2)} / 20',
                                  textAlign: TextAlign.center,
                                  style: const TextStyle(
                                    fontSize: 22,
                                    fontWeight: FontWeight.w900,
                                    color: Color(0xFF0B7A3E),
                                  ),
                                ),
                              ),
                            ),
                          ],
                        ],
                      ),
                      Column(
                        children: [
                          Expanded(
                            child: ListView.builder(
                              padding: const EdgeInsets.all(16),
                              itemCount: _chat.length,
                              itemBuilder: (ctx, i) {
                                final m = _chat[i];
                                final isUser = m['role'] == 'user';
                                return Align(
                                  alignment: isUser
                                      ? AlignmentDirectional.centerEnd
                                      : AlignmentDirectional.centerStart,
                                  child: Container(
                                    margin: const EdgeInsets.only(bottom: 10),
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(
                                      color: isUser ? const Color(0xFF0B7A3E) : const Color(0xFFE8F5E9),
                                      borderRadius: BorderRadius.circular(14),
                                    ),
                                    child: Text(
                                      m['text'] ?? '',
                                      style: TextStyle(color: isUser ? Colors.white : const Color(0xFF103820)),
                                    ),
                                  ),
                                );
                              },
                            ),
                          ),
                          Padding(
                            padding: const EdgeInsets.all(12),
                            child: Row(
                              children: [
                                Expanded(
                                  child: TextField(
                                    controller: _aiCtrl,
                                    decoration: const InputDecoration(
                                      hintText: 'اسأل المساعد الذكي...',
                                      border: OutlineInputBorder(),
                                    ),
                                  ),
                                ),
                                const SizedBox(width: 8),
                                IconButton.filled(
                                  onPressed: () =__GT__ _askAi(ctrl),
                                  icon: const Icon(Icons.send),
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                      Center(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Text(
                              '$mins:$secs',
                              style: const TextStyle(
                                fontSize: 48,
                                fontWeight: FontWeight.w900,
                                color: Color(0xFF0B7A3E),
                              ),
                            ),
                            const SizedBox(height: 16),
                            FilledButton.icon(
                              style: FilledButton.styleFrom(backgroundColor: const Color(0xFF0B7A3E)),
                              onPressed: () =__GT__ _togglePomodoro(ctrl),
                              icon: Icon(_pomoRunning ? Icons.pause : Icons.play_arrow),
                              label: Text(_pomoRunning ? 'إيقاف مؤقت' : 'بدء 25 دقيقة تركيز'),
                            ),
                          ],
                        ),
                      ),
                      ListView(
                        padding: const EdgeInsets.all(16),
                        children: [
                          for (final ev in ctrl.calendarEvents)
                            Card(
                              child: ListTile(
                                leading: const Text('📆', style: TextStyle(fontSize: 26)),
                                title: Text(ev['title_ar']?.toString() ?? ''),
                                subtitle: Text('التاريخ: ${ev['date']}'),
