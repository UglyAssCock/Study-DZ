            String formatArabicFileTitle(Map__LT__String, dynamic__GT__ fileItem, int index) {
              final rawTitle = fileItem['title']?.toString() ?? '';
              if (RegExp(r'[\u0600-\u06FF]').hasMatch(rawTitle)) {
                return rawTitle;
              }

              final subjId = fileItem['subject']?.toString() ?? 'math';
              final subjAr = subjectCatalog[subjId]?['ar'] ?? 'المادة';
              final cleaned = rawTitle.replaceAll('merged', '').trim();
              final numMatch = RegExp(r'(\d+)$').firstMatch(cleaned);
              final modelNum = numMatch != null ? numMatch.group(1)! : '${index + 1}';

              if (fileItem['is_archive'] == true) {
                final yr = fileItem['year'] ?? 2025;
                final cyc = fileItem['archive_cycle']?.toString() ?? 'secondaire';
                if (cyc == 'secondaire') return 'موضوع بكالوريا $yr مع التصحيح النموذجي في $subjAr';
                if (cyc == 'moyen') return 'موضوع شهادة التعليم المتوسط $yr مع التصحيح في $subjAr';
                return 'موضوع شهادة التعليم الابتدائي $yr في $subjAr';
              }

              final cat = fileItem['category']?.toString() ?? 'exams';
              final trim = int.tryParse(fileItem['trimester']?.toString() ?? '1') ?? 1;
              final trimAr = trim == 2
                  ? 'الفصل الثاني'
                  : trim == 3
                      ? 'الفصل الثالث'
                      : 'الفصل الأول';

              if (cat == 'books') return 'الكتاب المدرسي في $subjAr - النموذج ${index + 1}';
              if (cat == 'lessons') return 'درس مشروح في $subjAr - النموذج $modelNum';
              if (cat == 'summaries') return 'ملخص شامل في $subjAr - النموذج $modelNum';
              if (cat == 'tests') return 'فرض $trimAr في $subjAr - النموذج $modelNum';
              return 'اختبار $trimAr في $subjAr - النموذج $modelNum';
            }

            int countFilesForCycle(String cycleCode) {
              final cycleLvls = allLevels
                  .where((l) =__GT__ l['cycle'] == cycleCode)
                  .map((l) =__GT__ l['code']!.toUpperCase())
                  .toSet();
              return uploadedFiles.where((f) {
                if (f['is_archive'] == true) {
                  return f['archive_cycle'] == cycleCode;
                }
                return cycleLvls.contains((f['level']?.toString() ?? '').toUpperCase());
              }).length;
            }

            int countFilesForLevel(String levelCode) {
              final target = levelCode.toUpperCase();
              return uploadedFiles.where((f) {
                if (f['is_archive'] == true && f['category'] != 'books') return false;
                return (f['level']?.toString() ?? '').toUpperCase() == target;
              }).length;
            }

            int countFilesForSubject(String levelCode, String subjectId, [String streamCode = 'ALL']) {
              final target = levelCode.toUpperCase();
              return uploadedFiles.where((f) {
                if (f['is_archive'] == true && f['category'] != 'books') return false;
                if ((f['level']?.toString() ?? '').toUpperCase() != target || f['subject'] != subjectId) return false;
                return isFileValidForHighSchoolStream(f, levelCode, streamCode);
              }).length;
            }

            int countFilesForMergedFolder({
              required String levelCode,
              required String subjectId,
              required String folderId,
              int? trimester,
              String streamCode = 'ALL',
            }) {
              final target = levelCode.toUpperCase();
              return uploadedFiles.where((f) {
                if (f['is_archive'] == true && folderId != 'books') return false;
                if ((f['level']?.toString() ?? '').toUpperCase() != target) return false;
                if (f['subject'] != subjectId) return false;
                if (!isFileValidForHighSchoolStream(f, levelCode, streamCode)) return false;

                final fCat = f['category']?.toString() ?? '';
                if (folderId == 'lessons') {
                  return fCat == 'lessons' || fCat == 'summaries';
                }
                if (folderId == 'exams') {
                  if (fCat != 'tests' && fCat != 'exams') return false;
                  if (trimester != null) {
                    final fTrim = int.tryParse(f['trimester']?.toString() ?? '1') ?? 1;
                    return fTrim == trimester;
                  }
                  return true;
                }
                if (folderId == 'books') {
                  return fCat == 'books';
                }
                return false;
              }).length;
            }

            int countArchiveFiles({
              required String cycleCode,
              String? subjectId,
              String? streamCode,
            }) {
              final seen = __LT__String__GT__{};
              for (final f in uploadedFiles) {
                if (f['is_archive'] != true) continue;
                if (f['archive_cycle'] != cycleCode) continue;
                if (subjectId != null && f['subject'] != subjectId) continue;
                if (cycleCode == 'secondaire' && streamCode != null && streamCode != 'ALL') {
                  final fs = (f['stream']?.toString() ?? 'ALL').toUpperCase();
                  if (fs != 'ALL' && fs != streamCode.toUpperCase()) continue;
                }
                seen.add('${f['archive_cycle']}_${f['subject']}_${f['stream']}_${f['year']}');
              }
              return seen.length;
            }

