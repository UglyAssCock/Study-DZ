          # 14. Upgrade AGP & Kotlin in android/settings.gradle
          with open("android/settings.gradle", "r", encoding="utf-8") as f:
              sg = f.read()
          sg = re.sub(r'id\s+"com\.android\.application"\s+version\s+"[^"]+"', 'id "com.android.application" version "8.3.2"', sg)
          sg = re.sub(r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"', 'id "org.jetbrains.kotlin.android" version "1.9.24"', sg)
          with open("android/settings.gradle", "w", encoding="utf-8") as f:
              f.write(sg)

          # 15. Upgrade Gradle Wrapper to 8.4
          gw_path = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(gw_path, "r", encoding="utf-8") as f:
              gw = f.read()
          gw = re.sub(r"gradle-.*-all\.zip", "gradle-8.4-all.zip", gw)
          with open(gw_path, "w", encoding="utf-8") as f:
              f.write(gw)

