                );
                final req = await client.getUrl(extUri);
                final resp = await req.close().timeout(const Duration(seconds: 10));
                if (resp.statusCode == 200) {
                  final body = await resp.transform(utf8.decoder).join();
                  final extList = jsonDecode(body);
                  if (extList is List) {
                    for (final entry in extList) {
                      if (entry is Map) {
                        final m = Map__LT__String, dynamic__GT__.from(entry);
                        m['path'] = m['path'] ?? 'external_${m['title']}.pdf';
                        discovered.add(m);
