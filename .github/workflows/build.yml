                return true;
              }
              final subj = f['subject']?.toString() ?? '';
              final allowedSubjects = getCoefficientsForLevel(lvl, streamCode, includeSport: false, includeAmazigh: true).keys.toSet();
              if (!allowedSubjects.contains(subj)) return false;

              final fStream = (f['stream']?.toString() ?? 'ALL').toUpperCase();
              final target = streamCode.toUpperCase();
              if (fStream == target) return true;

              if (['SE', 'MATH', 'TM'].contains(target) && ['SE', 'MATH', 'TM'].contains(fStream) && subj != 'science' && subj != 'engineering') {
                return true;
              }
              if (['LP', 'LE'].contains(target) && ['LP', 'LE'].contains(fStream) && subj != 'third_lang') {
                return true;
              }
              return false;
            }

