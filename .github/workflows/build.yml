            List__LT__Map__LT__String, String__GT____GT__ searchAllContent(String query) {
              final q = query.trim().toLowerCase();
              if (q.isEmpty) return [];
              final results = __LT__Map__LT__String, String__GT____GT__[];

              for (final lvl in allLevels) {
                final lvlCode = lvl['code']!;
                final coeffs = getCoefficientsForLevel(lvlCode, 'SE');
                for (final subjId in coeffs.keys) {
                  final subjAr = subjectCatalog[subjId]?['ar'] ?? '';
                  final subjFr = subjectCatalog[subjId]?['fr'] ?? '';
                  if (subjAr.toLowerCase().contains(q) ||
                      subjFr.toLowerCase().contains(q) ||
                      lvlCode.toLowerCase().contains(q) ||
                      'درس'.contains(q) ||
                      'ملخص'.contains(q) ||
                      'فرض'.contains(q) ||
                      'اختبار'.contains(q)) {
                    for (int trim = 1; trim __LT__= 3; trim++) {
                      final items = getStudyItems(
                        levelCode: lvlCode,
                        subjectId: subjId,
                        trimester: trim,
                        category: 'lessons',
                      );
                      final first = items.first;
                      results.add({
                        'title': first['title']!,
                        'subtitle': '${lvl['ar']} • $subjAr',
                        'body': first['body']!,
                      });
                      if (results.length __GT__= 25) return results;
                    }
                  }
                }
              }
              return results;
            }

            Future__LT__File__GT__ _resolveStorageFile() async {
              try {
                final cmdline = File('/proc/self/cmdline');
                if (await cmdline.exists()) {
                  final raw = await cmdline.readAsString();
                  final nullChar = String.fromCharCode(0);
                  final pkg = raw.split(nullChar).first.trim();
                  if (pkg.isNotEmpty && pkg.contains('.')) {
                    final dir = Directory('/data/data/$pkg/files');
                    if (!await dir.exists()) {
                      await dir.create(recursive: true);
                    }
                    return File('${dir.path}/study_dz_v2_state.json');
                  }
                }
              } catch (_) {}
              return File('${Directory.systemTemp.path}/study_dz_v2_state.json');
            }

            Future__LT__void__GT__ initialize() async {
              try {
                final file = await _resolveStorageFile();
                if (await file.exists()) {
                  final content = await file.readAsString();
                  final map = jsonDecode(content) as Map__LT__String, dynamic__GT__;
                  hasCompletedOnboarding = map['hasCompletedOnboarding'] == true;
                  isGuest = map['isGuest'] != false;
                  isGoogleSignedIn = map['isGoogleSignedIn'] == true;
                  accountName = map['accountName']?.toString() ?? '';
                  accountEmail = map['accountEmail']?.toString() ?? '';
                  languageCode = map['languageCode']?.toString() ?? 'ar';
                  isDarkMode = map['isDarkMode'] == true;
                  activeProfileIndex =
                      int.tryParse(map['activeProfileIndex']?.toString() ?? '0') ?? 0;

                  final rawProfiles = (map['profiles'] as List?) ?? [];
                  if (rawProfiles.isNotEmpty) {
                    profiles = rawProfiles
                        .whereType__LT__Map__GT__()
                        .map((e) =__GT__ StudentProfile.fromJson(Map__LT__String, dynamic__GT__.from(e)))
                        .toList();
                  }
                }
              } catch (_) {}
            }

            Future__LT__void__GT__ saveState() async {
              try {
                final file = await _resolveStorageFile();
                final map = {
                  'hasCompletedOnboarding': hasCompletedOnboarding,
                  'isGuest': isGuest,
                  'isGoogleSignedIn': isGoogleSignedIn,
                  'accountName': accountName,
                  'accountEmail': accountEmail,
                  'languageCode': languageCode,
                  'isDarkMode': isDarkMode,
                  'activeProfileIndex': activeProfileIndex,
                  'profiles': profiles.map((p) =__GT__ p.toJson()).toList(),
                };
                await file.writeAsString(jsonEncode(map));
              } catch (_) {}
              notifyListeners();
            }

            Future__LT__void__GT__ resetAllData() async {
              hasCompletedOnboarding = false;
              isGuest = true;
              isGoogleSignedIn = false;
              accountName = '';
              accountEmail = '';
              profiles = [];
              activeProfileIndex = 0;
              try {
                final file = await _resolveStorageFile();
                if (await file.exists()) {
                  await file.delete();
                }
              } catch (_) {}
              notifyListeners();
            }
          }
