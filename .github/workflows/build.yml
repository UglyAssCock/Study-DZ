          write_file("lib/screens/tools_screen.dart", r'''import 'package:flutter/material.dart';
          import '../main.dart';

          class ToolsScreen extends StatefulWidget {
            const ToolsScreen({super.key});

            @override
            State__LT__ToolsScreen__GT__ createState() =__GT__ _ToolsScreenState();
          }

          class _ToolsScreenState extends State__LT__ToolsScreen__GT__ {
            String? _calcLevel;
            String? _calcStream;
            final Map__LT__String, double__GT__ _marks = {};
            double? _avgResult;

            String _mentionLabel(double avg, AppController ctrl) {
              if (avg __GT__= 16) {
                return ctrl.tr('التقدير: جيد جداً 🌟 (Très Bien)', 'Mention : Très Bien 🌟', 'Grade: Excellent 🌟');
              }
              if (avg __GT__= 14) {
                return ctrl.tr('التقدير: جيد 👏 (Bien)', 'Mention : Bien 👏', 'Grade: Good 👏');
              }
              if (avg __GT__= 12) {
                return ctrl.tr('التقدير: قريب من الجيد (Assez Bien)', 'Mention : Assez Bien', 'Grade: Fairly Good');
              }
              if (avg __GT__= 10) {
                return ctrl.tr('التقدير: مقبول ✅ (Passable)', 'Mention : Passable ✅', 'Grade: Pass ✅');
              }
              return ctrl.tr('دون المعدل — واصل الاجتهاد وستنجح بإذن الله 💪', 'Sous la moyenne 💪', 'Below Average 💪');
            }

            @override
            Widget build(BuildContext context) {
              final ctrl = AppScope.of(context);
              final activeLevel = _calcLevel ?? ctrl.currentProfile.levelCode;
              final is1AS = activeLevel == '1AS';
              final is2AS3AS = activeLevel == '2AS' || activeLevel == '3AS';
              final streams = is1AS ? AppController.streams1AS : AppController.streams2AS3AS;

              String activeStream = _calcStream ?? ctrl.currentProfile.streamCode;
              if ((is1AS || is2AS3AS) && !streams.any((s) =__GT__ s['code'] == activeStream)) {
                activeStream = streams.first['code']!;
              }

              final coeffsMap = ctrl.getCoefficientsForLevel(activeLevel, activeStream);
              final subjectIds = coeffsMap.keys.toList();

              int totalCoeffs = 0;
              for (final c in coeffsMap.values) {
                totalCoeffs += c;
              }

              return Scaffold(
                appBar: AppBar(
                  title: Text(ctrl.tr('حاسبة المعدل الفصلي والرسمي', 'Calculateur de Moyenne', 'Average Calculator')),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    // Level & Stream Selector inside the calculator so changing years updates coefficients immediately
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Text(
                              ctrl.tr(
                                'اختر السنة الدراسية والشعبة لحساب المعدل بالمعاملات الرسمية:',
                                'Sélectionnez l\'année et la filière :',
                                'Select Grade Level & Stream:',
                              ),
                              style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 15),
                            ),
                            const SizedBox(height: 12),
                            DropdownButtonFormField__LT__String__GT__(
                              value: activeLevel,
                              decoration: InputDecoration(
                                labelText: ctrl.tr('السنة الدراسية', 'Niveau scolaire', 'Grade Level'),
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                              ),
                              items: AppController.allLevels
                                  .map((lvl) =__GT__ DropdownMenuItem__LT__String__GT__(
                                        value: lvl['code']!,
                                        child: Text(ctrl.tr(lvl['ar']!, lvl['fr']!, lvl['en'])),
                                      ))
                                  .toList(),
                              onChanged: (val) {
                                if (val != null) {
                                  setState(() {
                                    _calcLevel = val;
                                    _avgResult = null;
                                    if (val == '1AS') {
                                      _calcStream = 'TC_ST';
                                    } else if (val == '2AS' || val == '3AS') {
                                      _calcStream = 'SE';
                                    } else {
                                      _calcStream = '';
                                    }
                                    ctrl.currentProfile.levelCode = val;
                                    ctrl.currentProfile.streamCode = _calcStream ?? '';
                                    ctrl.saveState();
                                  });
                                }
                              },
                            ),
                            if (is1AS || is2AS3AS) ...[
                              const SizedBox(height: 12),
                              DropdownButtonFormField__LT__String__GT__(
                                value: activeStream,
                                decoration: InputDecoration(
                                  labelText: ctrl.tr('الشعبة', 'Filière', 'Stream'),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                                ),
                                items: streams
                                    .map((s) =__GT__ DropdownMenuItem__LT__String__GT__(
                                          value: s['code']!,
                                          child: Text(ctrl.tr(s['ar']!, s['fr']!, s['en'])),
                                        ))
                                    .toList(),
                                onChanged: (val) {
                                  if (val != null) {
                                    setState(() {
                                      _calcStream = val;
                                      _avgResult = null;
                                      ctrl.currentProfile.streamCode = val;
                                      ctrl.saveState();
                                    });
                                  }
                                },
                              ),
                            ],
                            const SizedBox(height: 10),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                              decoration: BoxDecoration(
                                color: const Color(0xFF147A42).withOpacity(0.1),
                                borderRadius: BorderRadius.circular(12),
                              ),
                              child: Text(
                                '${ctrl.tr("عدد المواد", "Matières", "Subjects")}: ${subjectIds.length}   •   '
                                '${ctrl.tr("مجموع المعاملات", "Total Coeffs", "Total Coeffs")}: $totalCoeffs',
                                textAlign: TextAlign.center,
                                style: const TextStyle(
                                  fontWeight: FontWeight.w900,
                                  color: Color(0xFF147A42),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 14),

                    // Dynamic Subject Rows with ValueKey so changing level refreshes coefficients & inputs
                    for (final subjId in subjectIds)
                      Card(
                        key: ValueKey('row_${activeLevel}_${activeStream}_$subjId'),
                        margin: const EdgeInsets.only(bottom: 10),
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                          child: Row(
                            children: [
                              Text(ctrl.subjectEmoji(subjId), style: const TextStyle(fontSize: 26)),
                              const SizedBox(width: 10),
                              Expanded(
                                flex: 4,
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(
                                      ctrl.subjectTitle(subjId),
                                      style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 15),
                                    ),
                                    Text(
                                      '${ctrl.tr("المعامل الرسمي", "Coefficient", "Coefficient")}: ${coeffsMap[subjId]}',
                                      style: const TextStyle(
                                        fontSize: 13,
                                        fontWeight: FontWeight.bold,
                                        color: Color(0xFF147A42),
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                              const SizedBox(width: 10),
                              Expanded(
                                flex: 2,
                                child: TextFormField(
                                  key: ValueKey('input_${activeLevel}_${activeStream}_$subjId'),
                                  initialValue: (_marks['${activeLevel}_${activeStream}_$subjId'] ?? 14.0).toString(),
                                  keyboardType: const TextInputType.numberWithOptions(decimal: true),
                                  textAlign: TextAlign.center,
                                  decoration: InputDecoration(
                                    suffixText: '/20',
                                    isDense: true,
                                    border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                                  ),
                                  onChanged: (v) {
                                    final parsed = double.tryParse(v);
                                    if (parsed != null) {
                                      _marks['${activeLevel}_${activeStream}_$subjId'] = parsed.clamp(0.0, 20.0);
                                    }
                                  },
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),

                    const SizedBox(height: 14),
                    FilledButton.icon(
                      style: FilledButton.styleFrom(
                        backgroundColor: const Color(0xFF147A42),
                        padding: const EdgeInsets.symmetric(vertical: 16),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                      ),
                      onPressed: () {
                        double weightedSum = 0;
                        int sumCoeffs = 0;
                        for (final subjId in subjectIds) {
                          final coeff = coeffsMap[subjId] ?? 1;
                          final mark = _marks['${activeLevel}_${activeStream}_$subjId'] ?? 14.0;
                          weightedSum += mark * coeff;
                          sumCoeffs += coeff;
                        }
                        setState(() {
                          _avgResult = sumCoeffs == 0 ? 0.0 : weightedSum / sumCoeffs;
                        });
                      },
                      icon: const Icon(Icons.calculate_outlined),
                      label: Text(
                        ctrl.tr('احسب معدلي الآن', 'Calculer ma moyenne', 'Calculate My Average'),
                        style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold),
                      ),
                    ),

                    if (_avgResult != null) ...[
                      const SizedBox(height: 18),
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFFE8F5E9),
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: const Color(0xFF147A42), width: 2),
                        ),
                        child: Column(
                          children: [
                            Text(
                              '${ctrl.tr("المعدل العام", "Moyenne Générale", "Overall Average")}: ${_avgResult!.toStringAsFixed(2)} / 20',
                              style: const TextStyle(
                                fontSize: 24,
                                fontWeight: FontWeight.w900,
                                color: Color(0xFF147A42),
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              _mentionLabel(_avgResult!, ctrl),
                              style: const TextStyle(
                                fontSize: 16,
                                fontWeight: FontWeight.bold,
                                color: Color(0xFF0E4B29),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                    const SizedBox(height: 24),
                  ],
                ),
              );
            }
          }
