                                'يمكنك تعديل بيانات حسابك أو حذفها في أي وقت من صفحة "حسابي الشخصي" في القائمة الجانبية.',
                                '1. Stockage local : Toutes vos préférences et notes sont enregistrées localement sur votre téléphone.\n\n2. Aucun partage : Aucune donnée personnelle n\'est partagée avec des tiers.',
                                '1. Local Storage: All profile settings and calculated marks are stored locally on your device.\n\n2. No Third-Party Sharing: We never sell or share your personal data with third parties.',
