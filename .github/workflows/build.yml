            @override
            Widget build(BuildContext context) {
              final ctrl = AppScope.of(context);
              final activeLevel = _calcLevel ?? ctrl.currentProfile.levelCode;
              final isPrimary = activeLevel.endsWith('AP');
              final is1AS = activeLevel == '1AS';
              final is2AS3AS = activeLevel == '2AS' || activeLevel == '3AS';
              final canHaveOfficialExamMode = activeLevel == '4AM' || activeLevel == '3AS';
              final effectiveExamMode = canHaveOfficialExamMode && _isOfficialExamMode;

              final streams = is1AS ? AppController.streams1AS : AppController.streams2AS3AS;
              String activeStream = _calcStream ?? ctrl.currentProfile.streamCode;
              if ((is1AS || is2AS3AS) && !streams.any((s) =__GT__ s['code'] == activeStream)) {
                activeStream = streams.first['code']!;
              }

              final coeffsMap = ctrl.getCoefficientsForLevel(
                activeLevel,
                activeStream,
                includeSport: _includeSport,
                includeAmazigh: _includeAmazigh,
                includeArt: _includeArt,
              );

              if (effectiveExamMode && activeLevel == '4AM') {
                coeffsMap.remove('cs');
              }

              final subjectIds = coeffsMap.keys.toList();

              int totalCoeffs = 0;
              double totalPoints = 0.0;

              for (final subjId in subjectIds) {
                final key = '${activeLevel}_${activeStream}_${effectiveExamMode}_$subjId';
                final sAvg = _subjectAverage(
                  key: key,
                  isPrimary: isPrimary,
                  isExamCertificateMode: effectiveExamMode,
                );
                final c = coeffsMap[subjId] ?? 1;

                if (effectiveExamMode && activeLevel == '4AM' && subjId == 'art') {
                  if (sAvg __GT__ 10.0) {
                    totalPoints += (sAvg - 10.0);
                  }
                } else {
                  totalCoeffs += c;
                  totalPoints += sAvg * c;
                }
              }

              final finalAverage = totalCoeffs == 0 ? 0.0 : totalPoints / totalCoeffs;
              final maxScale = isPrimary ? 10 : 20;

