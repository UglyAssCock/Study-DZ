            Map__LT__String, dynamic__GT__? classifyFilePath(String relPath) {
              final fname = relPath.split('/').last;
              final lower = fname.toLowerCase();
              if (fname == 'icon.png' || fname == 'auto_catalog.json' || fname == 'external_links.json' || fname == 'readme.txt') {
                return null;
              }
              String ext = '';
              final dotIdx = lower.lastIndexOf('.');
              if (dotIdx != -1) {
                ext = lower.substring(dotIdx);
              }
              if (!['.pdf', '.png', '.jpg', '.jpeg', '.webp'].contains(ext)) {
                return null;
              }

              final token = relPath.toLowerCase();

              // Ignore old solution files (_sol / _cor) if present
              if (['_sol.', '_cor.', '_corrige.'].any((k) =__GT__ lower.contains(k))) {
                return null;
