              final rawTitle = dotIdx != -1 ? fname.substring(0, dotIdx) : fname;
              final cleanTitle = rawTitle.replaceAll('_', ' ').replaceAll('-', ' ').trim();
              final encodedPath = relPath.split('/').map(Uri.encodeComponent).join('/');
              final downloadUrl = 'https://raw.githubusercontent.com/$githubRepo/$githubBranch/$encodedPath';

              return {
                'path': relPath,
                'url': downloadUrl,
                'title': cleanTitle,
                'level': detectedLevel,
                'subject': detectedSubject,
                'trimester': detectedTrim,
                'category': detectedCategory,
                'type': ext == '.pdf' ? 'pdf' : 'image',
                'is_archive': isOfficialArchive,
