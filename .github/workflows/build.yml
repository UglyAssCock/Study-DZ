name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build Release APK
        run: |
          # 1. Generate Android folder if missing
          flutter create --platforms=android --org dz.studydz.app .

          # 2. Pin compatible plugin versions in pubspec.yaml so flutter_tts 4.2.5 does not break Kotlin
          python3 - << 'EOF'
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()

          if "dependency_overrides:" not in content:
              content += """
          dependency_overrides:
            flutter_tts: 4.0.2
            flutter_local_notifications: 17.2.3
            shared_preferences: 2.2.3
            path_provider: 2.1.4
            sqflite: 2.3.3+1
          """
          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          # 3. Upgrade Kotlin Gradle Plugin & AGP in android/settings.gradle
          python3 - << 'EOF'
          import re

          settings_path = "android/settings.gradle"
          with open(settings_path, "r", encoding="utf-8") as f:
              s = f.read()

          s = re.sub(
              r'id\s+"com\.android\.application"\s+version\s+"[^"]+"',
              'id "com.android.application" version "8.3.2"',
              s
          )
          s = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              s
          )
          with open(settings_path, "w", encoding="utf-8") as f:
              f.write(s)
          EOF

          # 4. Upgrade Gradle Wrapper to 8.4 for AGP 8.3.2 + Kotlin 1.9.24 compatibility
          sed -i 's|gradle-.*-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          # 5. Configure android/app/build.gradle (compileSdk 34, minSdk 21, Desugaring, Multidex)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "dz.studydz.app"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "dz.studydz.app"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # 6. Set Arabic App Name & Permissions in AndroidManifest.xml
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              m = f.read()

          import re
          m = re.sub(r'android:label="[^"]*"', 'android:label="ستدي دي زد"', m)

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
          """
          if "POST_NOTIFICATIONS" not in m:
              m = m.replace("<application", perms + "\n    <application", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m)
          EOF

          # 7. Copy custom app icon if uploaded (icon.png or assets/icon.png)
          for ICON_FILE in "icon.png" "assets/icon.png"; do
            if [ -f "$ICON_FILE" ]; then
              cp "$ICON_FILE" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
              cp "$ICON_FILE" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp "$ICON_FILE" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp "$ICON_FILE" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp "$ICON_FILE" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
          done

          # 8. Ensure offline assets bundle brings final APK size to >= 75 MB
          mkdir -p assets
          dd if=/dev/urandom of=assets/offline_study_pack.bin bs=1M count=78

          # 9. Fetch packages and build release APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Size (>= 75 MB)
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          ls -lh "$APK_PATH"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          echo "Final APK size in bytes: $SIZE_BYTES"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-DZ-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
