            Future__LT__int__GT__ refreshCloudCatalog() async {
              isSyncingCloud = true;
              notifyListeners();
              final discovered = __LT__Map__LT__String, dynamic__GT____GT__[];

              try {
                final client = HttpClient();
                client.connectionTimeout = const Duration(seconds: 12);
                final treeUri = Uri.parse(
                  'https://api.github.com/repos/$githubRepo/git/trees/$githubBranch?recursive=1',
                );
                final req = await client.getUrl(treeUri);
                req.headers.set('User-Agent', 'StudyDZ-App');
                req.headers.set('Accept', 'application/vnd.github.v3+json');
                final resp = await req.close().timeout(const Duration(seconds: 15));
                if (resp.statusCode == 200) {
                  final body = await resp.transform(utf8.decoder).join();
                  final decoded = jsonDecode(body) as Map__LT__String, dynamic__GT__;
                  final tree = (decoded['tree'] as List?) ?? [];
                  for (final node in tree) {
                    if (node is Map && node['type'] == 'blob') {
                      final path = node['path']?.toString() ?? '';
                      if (path.startsWith('files/') || path.startsWith('assets/') || path.startsWith('uploads/')) {
                        final item = classifyFilePath(path);
                        if (item != null) {
                          discovered.add(item);
                        }
                      }
                    }
                  }
                }
              } catch (_) {}

              if (discovered.isNotEmpty) {
                uploadedFiles = discovered;
                try {
                  final cacheCatalogFile = File('$_appDataDirPath/study_dz_cloud_catalog.json');
                  await cacheCatalogFile.writeAsString(jsonEncode(uploadedFiles));
                } catch (_) {}
              }

              isSyncingCloud = false;
              notifyListeners();
              return uploadedFiles.length;
            }

            File getLocalCachedFile(Map__LT__String, dynamic__GT__ fileItem) {
              final rawPath = fileItem['path']?.toString() ?? fileItem['title']?.toString() ?? 'doc.pdf';
              final safeName = rawPath.replaceAll(RegExp(r'[^a-zA-Z0-9._-]'), '_');
              final cacheDir = Directory('$_appDataDirPath/offline_files');
              if (!cacheDir.existsSync()) {
                cacheDir.createSync(recursive: true);
              }
              return File('${cacheDir.path}/$safeName');
            }

            bool isFileCachedLocally(Map__LT__String, dynamic__GT__ fileItem) {
              final f = getLocalCachedFile(fileItem);
              return f.existsSync() && f.lengthSync() __GT__ 0;
            }

            Future__LT__File__GT__ downloadAndCacheFile(Map__LT__String, dynamic__GT__ fileItem) async {
              final targetFile = getLocalCachedFile(fileItem);
              if (await targetFile.exists() && await targetFile.length() __GT__ 0) {
                return targetFile;
              }
              final url = fileItem['url']?.toString() ?? '';
              final client = HttpClient();
              final req = await client.getUrl(Uri.parse(url));
              req.headers.set('User-Agent', 'StudyDZ-App');
              final resp = await req.close().timeout(const Duration(seconds: 60));
              if (resp.statusCode != 200) {
                throw Exception('HTTP ${resp.statusCode}');
              }
              final bytes = await resp.fold__LT__List__LT__int__GT____GT__(
                __LT__int__GT__[],
                (prev, element) =__GT__ prev..addAll(element),
              );
              await targetFile.writeAsBytes(bytes, flush: true);
              notifyListeners();
              return targetFile;
            }

            Future__LT__void__GT__ deleteCachedFile(Map__LT__String, dynamic__GT__ fileItem) async {
              final f = getLocalCachedFile(fileItem);
              if (await f.exists()) {
                await f.delete();
                notifyListeners();
              }
            }

            List__LT__Map__LT__String, dynamic__GT____GT__ getUploadedStudyItems({
              required String levelCode,
              required String subjectId,
              required int trimester,
              required String category,
            }) {
              return uploadedFiles.where((f) {
                if (f['is_archive'] == true && category != 'books') return false;
                final sameLevel = (f['level']?.toString().toUpperCase() ?? '') == levelCode.toUpperCase();
                final sameSubj = (f['subject']?.toString() ?? '') == subjectId;
                final sameCat = (f['category']?.toString() ?? '') == category;
                if (!sameLevel || !sameSubj || !sameCat) return false;
                if (category == 'books') return true;
                final fTrim = int.tryParse(f['trimester']?.toString() ?? '1') ?? 1;
                return fTrim == trimester;
              }).toList();
            }

            List__LT__Map__LT__String, dynamic__GT____GT__ searchAllContent(String query) {
              final q = query.trim().toLowerCase();
              if (q.isEmpty) return [];
              final results = __LT__Map__LT__String, dynamic__GT____GT__[];

              for (final f in uploadedFiles) {
                final title = (f['title'] ?? '').toString().toLowerCase();
                final lvl = (f['level'] ?? '').toString().toLowerCase();
                final subj = (f['subject'] ?? '').toString();
                final subjAr = (subjectCatalog[subj]?['ar'] ?? '').toLowerCase();
                final yr = (f['year'] ?? '').toString();
                if (title.contains(q) || lvl.contains(q) || subjAr.contains(q) || yr.contains(q)) {
                  results.add(f);
                }
              }
              return results;
            }

