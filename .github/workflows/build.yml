name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Clean App Files and Build Release APK
        shell: python
        run: |
          import os
          import re
          import shutil
          import subprocess

          LT = chr(60)
          GT = chr(62)

          def restore_angles(text):
              return text.replace("__LT__", LT).replace("__GT__", GT)

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(restore_angles(content))

          def run_cmd(cmd):
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)

          # 1. Backup pubspec.yaml and existing lib/
          os.makedirs("/tmp/study_dz_backup", exist_ok=True)
          shutil.copy2("pubspec.yaml", "/tmp/study_dz_backup/pubspec.yaml")
          if os.path.exists("/tmp/study_dz_backup/lib"):
              shutil.rmtree("/tmp/study_dz_backup/lib")
          shutil.copytree("lib", "/tmp/study_dz_backup/lib")

          # 2. Generate Android platform folder
          run_cmd([
              "flutter", "create",
              "--platforms=android",
              "--project-name", "study_dz",
              "--org", "dz.studydz.app",
              "."
          ])

          # 3. Restore pubspec.yaml and lib/
          shutil.copy2("/tmp/study_dz_backup/pubspec.yaml", "pubspec.yaml")
          shutil.copytree("/tmp/study_dz_backup/lib", "lib", dirs_exist_ok=True)

          # 4. Fix MainActivity.kt package so Android launches cleanly
          if os.path.exists("android/app/src/main/kotlin"):
              shutil.rmtree("android/app/src/main/kotlin")
          if os.path.exists("android/app/src/main/java"):
              shutil.rmtree("android/app/src/main/java")

          write_file(
              "android/app/src/main/kotlin/dz/studydz/app/MainActivity.kt",
              r"""package dz.studydz.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          """
          )

          # 5. Write AndroidManifest.xml with explicit dz.studydz.app.MainActivity
          write_file(
              "android/app/src/main/AndroidManifest.xml",
              r"""__LT__manifest xmlns:android="http://schemas.android.com/apk/res/android"__GT__
              __LT__uses-permission android:name="android.permission.INTERNET"/__GT__
              __LT__uses-permission android:name="android.permission.POST_NOTIFICATIONS"/__GT__
              __LT__uses-permission android:name="android.permission.VIBRATE"/__GT__
              __LT__uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/__GT__

              __LT__application
                  android:label="ستدي دي زد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"__GT__
                  __LT__activity
                      android:name="dz.studydz.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"__GT__
                      __LT__meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        /__GT__
                      __LT__intent-filter__GT__
                          __LT__action android:name="android.intent.action.MAIN"/__GT__
                          __LT__category android:name="android.intent.category.LAUNCHER"/__GT__
                      __LT__/intent-filter__GT__
                  __LT__/activity__GT__
                  __LT__meta-data
                      android:name="flutterEmbedding"
                      android:value="2" /__GT__
              __LT__/application__GT__
          __LT__/manifest__GT__
          """
          )

          # 6. Write lib/main.dart (using raw string r'''...''' and String.fromCharCode(0))
          write_file("lib/main.dart", r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import 'screens/onboarding_screen.dart';
          import 'screens/home_shell.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final controller = AppController();
            await controller.initialize();
            runApp(StudyDzApp(controller: controller));
          }

          class AppScope extends InheritedNotifier__LT__AppController__GT__ {
            const AppScope({
              super.key,
              required AppController controller,
              required super.child,
            }) : super(notifier: controller);

            static AppController of(BuildContext context) {
              final scope = context.dependOnInheritedWidgetOfExactType__LT__AppScope__GT__();
              return scope!.notifier!;
            }
          }

          class StudyDzApp extends StatelessWidget {
            final AppController controller;

            const StudyDzApp({super.key, required this.controller});

            @override
            Widget build(BuildContext context) {
              return AppScope(
                controller: controller,
                child: AnimatedBuilder(
                  animation: controller,
                  builder: (context, _) {
                    final isAr = controller.languageCode == 'ar';
                    const primaryGreen = Color(0xFF0B7A3E);
                    const accentGold = Color(0xFFF5B800);

                    final lightScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: primaryGreen,
                      secondary: accentGold,
                      brightness: Brightness.light,
                      surface: const Color(0xFFF4F7F5),
                    );

                    final darkScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: const Color(0xFF2ECC71),
                      secondary: accentGold,
                      brightness: Brightness.dark,
                      surface: const Color(0xFF121A15),
                    );

                    return MaterialApp(
                      debugShowCheckedModeBanner: false,
                      title: 'ستدي دي زد - Study DZ',
                      themeMode: controller.isDarkMode ? ThemeMode.dark : ThemeMode.light,
                      theme: ThemeData(
                        useMaterial3: true,
                        colorScheme: lightScheme,
                        scaffoldBackgroundColor: const Color(0xFFF2F6F3),
                        cardTheme: CardTheme(
                          elevation: 1.5,
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(18),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: primaryGreen,
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      darkTheme: ThemeData(
                        useMaterial3: true,
                        colorScheme: darkScheme,
                        scaffoldBackgroundColor: const Color(0xFF0D1410),
                        cardTheme: CardTheme(
                          elevation: 2,
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(18),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: Color(0xFF074D27),
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      builder: (context, child) {
                        return Directionality(
                          textDirection: isAr ? TextDirection.rtl : TextDirection.ltr,
                          child: MediaQuery(
                            data: MediaQuery.of(context).copyWith(
                              textScaler: TextScaler.linear(controller.fontScale),
                            ),
                            child: child ?? const SizedBox.shrink(),
                          ),
                        );
                      },
                      home: controller.hasCompletedOnboarding
                          ? const HomeShell()
                          : const OnboardingScreen(),
                    );
                  },
                ),
              );
            }
          }

          class StudentProfile {
            String id;
            String name;
            String levelCode;
            String streamCode;
            int xp;
            int streakDays;
            String lastStudyDate;
            int dailyGoalMinutes;
            int todayStudyMinutes;
            Map__LT__String, int__GT__ subjectMinutes;
            Map__LT__String, List__LT__int__GT____GT__ subjectScores;
            List__LT__String__GT__ bookmarks;
            Map__LT__String, String__GT__ notes;
            List__LT__Map__LT__String, dynamic__GT____GT__ wrongAnswers;
            Map__LT__String, int__GT__ flashcardMastery;
            List__LT__Map__LT__String, dynamic__GT____GT__ examAttempts;
            List__LT__Map__LT__String, dynamic__GT____GT__ averageHistory;
            String targetExamDate;
            int createdMonth;
            int createdYear;

            StudentProfile({
              required this.id,
              required this.name,
              required this.levelCode,
              this.streamCode = '',
              this.xp = 120,
              this.streakDays = 7,
              this.lastStudyDate = '',
              this.dailyGoalMinutes = 45,
              this.todayStudyMinutes = 25,
              Map__LT__String, int__GT__? subjectMinutes,
              Map__LT__String, List__LT__int__GT____GT__? subjectScores,
              List__LT__String__GT__? bookmarks,
              Map__LT__String, String__GT__? notes,
              List__LT__Map__LT__String, dynamic__GT____GT__? wrongAnswers,
              Map__LT__String, int__GT__? flashcardMastery,
              List__LT__Map__LT__String, dynamic__GT____GT__? examAttempts,
              List__LT__Map__LT__String, dynamic__GT____GT__? averageHistory,
              this.targetExamDate = '2027-06-07',
              int? createdMonth,
              int? createdYear,
            })  : subjectMinutes = subjectMinutes ?? {'math': 45, 'arabic': 30, 'physics': 20},
                  subjectScores = subjectScores ?? {'math': [75, 82], 'arabic': [88], 'physics': [60]},
                  bookmarks = bookmarks ?? [],
                  notes = notes ?? {},
                  wrongAnswers = wrongAnswers ?? [],
                  flashcardMastery = flashcardMastery ?? {},
                  examAttempts = examAttempts ?? [],
                  averageHistory = averageHistory ?? [],
                  createdMonth = createdMonth ?? DateTime.now().month,
                  createdYear = createdYear ?? DateTime.now().year;

            String get cycle {
              if (levelCode.endsWith('AP')) return 'primaire';
              if (levelCode.endsWith('AM')) return 'moyen';
              return 'secondaire';
            }

            int get levelNumber =__GT__ (xp ~/ 100) + 1;

            double get overallAveragePercent {
              int total = 0;
              int count = 0;
              for (final list in subjectScores.values) {
                for (final s in list) {
                  total += s;
                  count++;
                }
              }
              if (count == 0) return 82.0;
              return total / count;
            }

            int get solvedExercisesCount {
              int count = 0;
              for (final list in subjectScores.values) {
                count += list.length * 10;
              }
              return count == 0 ? 120 : count;
            }

            List__LT__String__GT__ get weakSubjects {
              final entries = __LT__MapEntry__LT__String, double__GT____GT__[];
              subjectScores.forEach((subj, scores) {
                if (scores.isNotEmpty) {
                  final avg = scores.reduce((a, b) =__GT__ a + b) / scores.length;
                  if (avg __LT__ 70) entries.add(MapEntry(subj, avg));
                }
              });
              entries.sort((a, b) =__GT__ a.value.compareTo(b.value));
              if (entries.isEmpty) return ['physics', 'math'];
              return entries.map((e) =__GT__ e.key).toList();
            }

            Map__LT__String, dynamic__GT__ toJson() =__GT__ {
                  'id': id,
                  'name': name,
                  'levelCode': levelCode,
                  'streamCode': streamCode,
                  'xp': xp,
                  'streakDays': streakDays,
                  'lastStudyDate': lastStudyDate,
                  'dailyGoalMinutes': dailyGoalMinutes,
                  'todayStudyMinutes': todayStudyMinutes,
                  'subjectMinutes': subjectMinutes,
                  'subjectScores': subjectScores,
                  'bookmarks': bookmarks,
                  'notes': notes,
                  'wrongAnswers': wrongAnswers,
                  'flashcardMastery': flashcardMastery,
                  'examAttempts': examAttempts,
                  'averageHistory': averageHistory,
                  'targetExamDate': targetExamDate,
                  'createdMonth': createdMonth,
                  'createdYear': createdYear,
                };

            factory StudentProfile.fromJson(Map__LT__String, dynamic__GT__ json) {
              final rawScores = (json['subjectScores'] as Map?) ?? {};
              final parsedScores = __LT__String, List__LT__int__GT____GT__{};
              rawScores.forEach((k, v) {
                if (v is List) {
                  parsedScores[k.toString()] =
                      v.map((e) =__GT__ int.tryParse(e.toString()) ?? 0).toList();
                }
              });

              final rawMins = (json['subjectMinutes'] as Map?) ?? {};
              final parsedMins = __LT__String, int__GT__{};
              rawMins.forEach((k, v) {
                parsedMins[k.toString()] = int.tryParse(v.toString()) ?? 0;
              });

              final rawMastery = (json['flashcardMastery'] as Map?) ?? {};
              final parsedMastery = __LT__String, int__GT__{};
              rawMastery.forEach((k, v) {
                parsedMastery[k.toString()] = int.tryParse(v.toString()) ?? 0;
              });

              final rawNotes = (json['notes'] as Map?) ?? {};
              final parsedNotes = __LT__String, String__GT__{};
              rawNotes.forEach((k, v) {
                parsedNotes[k.toString()] = v.toString();
              });

              return StudentProfile(
                id: json['id']?.toString() ?? 'p1',
                name: json['name']?.toString() ?? 'تلميذ النجاح',
                levelCode: json['levelCode']?.toString() ?? '3AM',
                streamCode: json['streamCode']?.toString() ?? '',
                xp: int.tryParse(json['xp']?.toString() ?? '120') ?? 120,
                streakDays: int.tryParse(json['streakDays']?.toString() ?? '7') ?? 7,
                lastStudyDate: json['lastStudyDate']?.toString() ?? '',
                dailyGoalMinutes:
                    int.tryParse(json['dailyGoalMinutes']?.toString() ?? '45') ?? 45,
                todayStudyMinutes:
                    int.tryParse(json['todayStudyMinutes']?.toString() ?? '30') ?? 30,
                subjectMinutes: parsedMins.isEmpty ? null : parsedMins,
                subjectScores: parsedScores.isEmpty ? null : parsedScores,
                bookmarks: ((json['bookmarks'] as List?) ?? [])
                    .map((e) =__GT__ e.toString())
                    .toList(),
                notes: parsedNotes,
                wrongAnswers: ((json['wrongAnswers'] as List?) ?? [])
                    .whereType__LT__Map__GT__()
                    .map((e) =__GT__ Map__LT__String, dynamic__GT__.from(e))
                    .toList(),
                flashcardMastery: parsedMastery,
                examAttempts: ((json['examAttempts'] as List?) ?? [])
                    .whereType__LT__Map__GT__()
                    .map((e) =__GT__ Map__LT__String, dynamic__GT__.from(e))
                    .toList(),
                averageHistory: ((json['averageHistory'] as List?) ?? [])
                    .whereType__LT__Map__GT__()
                    .map((e) =__GT__ Map__LT__String, dynamic__GT__.from(e))
                    .toList(),
                targetExamDate: json['targetExamDate']?.toString() ?? '2027-06-07',
                createdMonth: int.tryParse(json['createdMonth']?.toString() ?? '10'),
                createdYear: int.tryParse(json['createdYear']?.toString() ?? '2026'),
              );
            }
          }

          class AppController extends ChangeNotifier {
            bool hasCompletedOnboarding = false;
            bool isGuest = true;
            String accountName = '';
            String accountEmail = '';
            String accountPassword = '';
            String languageCode = 'ar';
            bool isDarkMode = false;
            double fontScale = 1.0;
            bool notificationsEnabled = true;
            String parentPin = '1234';
            String geminiApiKey = '';
            int currentTabIndex = 0;
            String? selectedSubjectFilter;

            List__LT__StudentProfile__GT__ profiles = [];
            int activeProfileIndex = 0;

            List__LT__Map__LT__String, dynamic__GT____GT__ lessons = [];
            List__LT__Map__LT__String, dynamic__GT____GT__ exams = [];
            List__LT__Map__LT__String, dynamic__GT____GT__ quizzes = [];
            List__LT__Map__LT__String, dynamic__GT____GT__ flashcards = [];
            List__LT__Map__LT__String, dynamic__GT____GT__ calendarEvents = [];
            List__LT__Map__LT__String, dynamic__GT____GT__ exercises = [];

            static const List__LT__Map__LT__String, String__GT____GT__ allLevels = [
              {'code': '1AP', 'ar': 'السنة الأولى ابتدائي (1AP)', 'fr': '1ère Année Primaire (1AP)', 'cycle': 'primaire'},
              {'code': '2AP', 'ar': 'السنة الثانية ابتدائي (2AP)', 'fr': '2ème Année Primaire (2AP)', 'cycle': 'primaire'},
              {'code': '3AP', 'ar': 'السنة الثالثة ابتدائي (3AP)', 'fr': '3ème Année Primaire (3AP)', 'cycle': 'primaire'},
              {'code': '4AP', 'ar': 'السنة الرابعة ابتدائي (4AP)', 'fr': '4ème Année Primaire (4AP)', 'cycle': 'primaire'},
              {'code': '5AP', 'ar': 'السنة الخامسة ابتدائي - السانكيام (5AP)', 'fr': '5ème Année Primaire (5AP)', 'cycle': 'primaire'},
              {'code': '1AM', 'ar': 'السنة الأولى متوسط (1AM)', 'fr': '1ère Année Moyenne (1AM)', 'cycle': 'moyen'},
              {'code': '2AM', 'ar': 'السنة الثانية متوسط (2AM)', 'fr': '2ème Année Moyenne (2AM)', 'cycle': 'moyen'},
              {'code': '3AM', 'ar': 'السنة الثالثة متوسط (3AM)', 'fr': '3ème Année Moyenne (3AM)', 'cycle': 'moyen'},
              {'code': '4AM', 'ar': 'السنة الرابعة متوسط - البيام (4AM)', 'fr': '4ème Année Moyenne - BEM (4AM)', 'cycle': 'moyen'},
              {'code': '1AS', 'ar': 'السنة الأولى ثانوي (1AS)', 'fr': '1ère Année Secondaire (1AS)', 'cycle': 'secondaire'},
              {'code': '2AS', 'ar': 'السنة الثانية ثانوي (2AS)', 'fr': '2ème Année Secondaire (2AS)', 'cycle': 'secondaire'},
              {'code': '3AS', 'ar': 'السنة الثالثة ثانوي - البكالوريا (3AS)', 'fr': '3ème Année Secondaire - BAC (3AS)', 'cycle': 'secondaire'},
              {'code': '3AS_LIBRE', 'ar': 'مترشح حر للبكالوريا (Bac Libre)', 'fr': 'Candidat Libre BAC', 'cycle': 'secondaire'},
            ];

            static const List__LT__Map__LT__String, String__GT____GT__ streams1AS = [
              {'code': 'TC_ST', 'ar': 'جذع مشترك علوم وتكنولوجيا', 'fr': 'Tronc Commun Sciences et Technologies'},
              {'code': 'TC_L', 'ar': 'جذع مشترك آداب', 'fr': 'Tronc Commun Lettres'},
            ];

            static const List__LT__Map__LT__String, String__GT____GT__ streams2AS3AS = [
              {'code': 'SE', 'ar': 'علوم تجريبية', 'fr': 'Sciences Expérimentales'},
              {'code': 'MATH', 'ar': 'رياضيات', 'fr': 'Mathématiques'},
              {'code': 'TM', 'ar': 'تقني رياضي', 'fr': 'Technique Mathématique'},
              {'code': 'GE', 'ar': 'تسيير واقتصاد', 'fr': 'Gestion et Économie'},
              {'code': 'LP', 'ar': 'آداب وفلسفة', 'fr': 'Lettres et Philosophie'},
              {'code': 'LE', 'ar': 'لغات أجنبية', 'fr': 'Langues Étrangères'},
            ];

            static const List__LT__Map__LT__String, dynamic__GT____GT__ coreSubjects = [
              {'id': 'math', 'ar': 'الرياضيات', 'fr': 'Mathématiques', 'emoji': '🧮', 'color': 0xFFE3F2FD, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'arabic', 'ar': 'اللغة العربية', 'fr': 'Langue Arabe', 'emoji': '📖', 'color': 0xFFFFF3E0, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'physics', 'ar': 'العلوم الفيزيائية والتكنولوجيا', 'fr': 'Sciences Physiques', 'emoji': '⚗️', 'color': 0xFFEDE7F6, 'cycles': ['moyen', 'secondaire']},
              {'id': 'science', 'ar': 'علوم الطبيعة والحياة', 'fr': 'Sciences Naturelles', 'emoji': '🌿', 'color': 0xFFE8F5E9, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'hisgeo', 'ar': 'التاريخ والجغرافيا', 'fr': 'Histoire et Géographie', 'emoji': '🌍', 'color': 0xFFFFF8E1, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'islamic', 'ar': 'التربية الإسلامية', 'fr': 'Éducation Islamique', 'emoji': '🕌', 'color': 0xFFE0F2F1, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'french', 'ar': 'اللغة الفرنسية', 'fr': 'Langue Française', 'emoji': '🗼', 'color': 0xFFE3F2FD, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'english', 'ar': 'اللغة الإنجليزية', 'fr': 'Langue Anglaise', 'emoji': '🇬🇧', 'color': 0xFFFCE4EC, 'cycles': ['primaire', 'moyen', 'secondaire']},
              {'id': 'civics', 'ar': 'التربية المدنية', 'fr': 'Éducation Civique', 'emoji': '⚖️', 'color': 0xFFF3E5F5, 'cycles': ['primaire', 'moyen']},
              {'id': 'philo', 'ar': 'الفلسفة', 'fr': 'Philosophie', 'emoji': '🤔', 'color': 0xFFFFEBEE, 'cycles': ['secondaire']},
              {'id': 'cs', 'ar': 'الإعلام الآلي', 'fr': 'Informatique', 'emoji': '💻', 'color': 0xFFE8EAF6, 'cycles': ['moyen', 'secondaire']},
              {'id': 'accounting', 'ar': 'التسيير المحاسبي والمالي', 'fr': 'Gestion Comptable', 'emoji': '📊', 'color': 0xFFE0F7FA, 'cycles': ['secondaire']},
            ];

            StudentProfile get currentProfile {
              if (profiles.isEmpty) {
                profiles.add(StudentProfile(
                  id: 'default_1',
                  name: 'أمين',
                  levelCode: '3AM',
                  streakDays: 7,
                  xp: 650,
                ));
              }
              if (activeProfileIndex __LT__ 0 || activeProfileIndex __GT__= profiles.length) {
                activeProfileIndex = 0;
              }
              return profiles[activeProfileIndex];
            }

            String tr(String arText, String frText) {
              return languageCode == 'fr' && frText.isNotEmpty ? frText : arText;
            }

            String levelLabel(String code) {
              for (final lvl in allLevels) {
                if (lvl['code'] == code) {
                  return tr(lvl['ar']!, lvl['fr']!);
                }
              }
              return code;
            }

            String streamLabel(String code) {
              for (final s in [...streams1AS, ...streams2AS3AS]) {
                if (s['code'] == code) {
                  return tr(s['ar']!, s['fr']!);
                }
              }
              return '';
            }

            Map__LT__String, dynamic__GT__ subjectMeta(String subjectId) {
              for (final s in coreSubjects) {
                if (s['id'] == subjectId) return s;
              }
              return coreSubjects.first;
            }

            String subjectName(String subjectId) {
              final m = subjectMeta(subjectId);
              return tr(m['ar'] as String, m['fr'] as String);
            }

            List__LT__Map__LT__String, dynamic__GT____GT__ subjectsForCurrentProfile() {
              final cyc = currentProfile.cycle;
              return coreSubjects
                  .where((s) =__GT__ (s['cycles'] as List).contains(cyc))
                  .toList();
            }

            int getSubjectCoefficient(String subjectId, {String? levelOverride, String? streamOverride}) {
              final lvl = levelOverride ?? currentProfile.levelCode;
              final strm = streamOverride ?? currentProfile.streamCode;

              if (lvl.endsWith('AP')) {
                return (subjectId == 'math' || subjectId == 'arabic') ? 2 : 1;
              }
              if (lvl == '4AM') {
                const bemCoeffs = {
                  'arabic': 5, 'math': 4, 'french': 3, 'hisgeo': 3,
                  'science': 2, 'physics': 2, 'english': 2, 'islamic': 2,
                  'civics': 1, 'cs': 1,
                };
                return bemCoeffs[subjectId] ?? 2;
              }
              if (lvl.endsWith('AM')) {
                const amCoeffs = {
                  'arabic': 3, 'math': 3, 'french': 2, 'hisgeo': 2,
                  'science': 2, 'physics': 2, 'english': 1, 'islamic': 1,
                  'civics': 1, 'cs': 1,
                };
                return amCoeffs[subjectId] ?? 1;
              }
              if (strm == 'MATH') {
