          class FileViewerPage extends StatefulWidget {
            final Map__LT__String, dynamic__GT__ fileItem;

            const FileViewerPage({super.key, required this.fileItem});

            @override
            State__LT__FileViewerPage__GT__ createState() =__GT__ _FileViewerPageState();
          }

          class _FileViewerPageState extends State__LT__FileViewerPage__GT__ {
            static const _pdfChannel = MethodChannel('dz.studydz.app/pdf');
            File? _localFile;
            int _pageCount = 0;
            int _currentPage = 0;
            Uint8List? _pageBytes;
            bool _loading = true;
            String? _error;
            bool _initialized = false;

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();
              if (!_initialized) {
                _initialized = true;
                _prepareAndOpenFile();
              }
            }

            Future__LT__void__GT__ _prepareAndOpenFile() async {
              final ctrl = AppScope.of(context);
              setState(() {
                _loading = true;
                _error = null;
              });

              try {
                final cachedFile = await ctrl.downloadAndCacheFile(widget.fileItem);
                _localFile = cachedFile;

                if (widget.fileItem['type'] == 'pdf') {
                  final count = await _pdfChannel.invokeMethod__LT__int__GT__(
                    'getPageCount',
                    {'path': cachedFile.path},
                  );
                  _pageCount = count ?? 0;
                  if (_pageCount __GT__ 0) {
                    await _loadPage(0);
                  } else {
                    setState(() {
                      _loading = false;
                      _error = 'ملف PDF فارغ';
                    });
                  }
                } else {
                  setState(() =__GT__ _loading = false);
                }
              } catch (e) {
                setState(() {
                  _loading = false;
                  _error = 'تأكد من اتصالك بالإنترنت عند فتح الملف لأول مرة فقط.\n($e)';
                });
              }
            }

            Future__LT__void__GT__ _loadPage(int pageIdx) async {
              if (_localFile == null) return;
              setState(() =__GT__ _loading = true);
              try {
                final bytes = await _pdfChannel.invokeMethod__LT__Uint8List__GT__(
                  'renderPage',
                  {'path': _localFile!.path, 'pageIndex': pageIdx},
                );
                setState(() {
                  _currentPage = pageIdx;
                  _pageBytes = bytes;
                  _loading = false;
                });
              } catch (e) {
                setState(() {
                  _loading = false;
                  _error = e.toString();
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              final title = widget.fileItem['title']?.toString() ?? '';
              final isPdf = widget.fileItem['type'] == 'pdf';

              return Scaffold(
                appBar: AppBar(
                  title: Text(title),
                ),
                body: _loading
                    ? const Center(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            CircularProgressIndicator(),
                            SizedBox(height: 14),
                            Text('جاري التحميل والحفظ للمطالعة بدون إنترنت...'),
                          ],
                        ),
                      )
                    : _error != null
                        ? Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.wifi_off, size: 52, color: Colors.red),
                                  const SizedBox(height: 12),
                                  Text(_error!, textAlign: TextAlign.center),
                                  const SizedBox(height: 14),
                                  FilledButton.icon(
                                    onPressed: _prepareAndOpenFile,
                                    icon: const Icon(Icons.refresh),
                                    label: const Text('إعادة المحاولة'),
                                  ),
                                ],
                              ),
                            ),
                          )
                        : !isPdf
                            ? InteractiveViewer(
                                minScale: 0.8,
                                maxScale: 5.0,
                                child: Center(
                                  child: Image.file(_localFile!, fit: BoxFit.contain),
                                ),
                              )
                            : Column(
                                children: [
                                  Expanded(
