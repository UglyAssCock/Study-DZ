name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Clean App Files and Build Release APK
        shell: python
        run: |
          import os
          import re
          import shutil
          import subprocess

          LT = chr(60)
          GT = chr(62)

          def restore_angles(text):
              return text.replace("__LT__", LT).replace("__GT__", GT)

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(restore_angles(content))

          def run_cmd(cmd):
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)

          # 1. Backup pubspec.yaml
          os.makedirs("/tmp/study_dz_backup", exist_ok=True)
          shutil.copy2("pubspec.yaml", "/tmp/study_dz_backup/pubspec.yaml")

          # 2. Generate Android folder
          run_cmd([
              "flutter", "create",
              "--platforms=android",
              "--project-name", "study_dz",
              "--org", "dz.studydz.app",
              "."
          ])

          # 3. Restore pubspec.yaml
          shutil.copy2("/tmp/study_dz_backup/pubspec.yaml", "pubspec.yaml")

          # 4. Fix MainActivity.kt package
          if os.path.exists("android/app/src/main/kotlin"):
              shutil.rmtree("android/app/src/main/kotlin")
          if os.path.exists("android/app/src/main/java"):
              shutil.rmtree("android/app/src/main/java")

          write_file(
              "android/app/src/main/kotlin/dz/studydz/app/MainActivity.kt",
              r"""package dz.studydz.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          """
          )

          # 5. Write AndroidManifest.xml
          write_file(
              "android/app/src/main/AndroidManifest.xml",
              r"""__LT__manifest xmlns:android="http://schemas.android.com/apk/res/android"__GT__
              __LT__uses-permission android:name="android.permission.INTERNET"/__GT__

              __LT__application
                  android:label="ستدي دي زد"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"__GT__
                  __LT__activity
                      android:name="dz.studydz.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"__GT__
                      __LT__meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        /__GT__
                      __LT__intent-filter__GT__
                          __LT__action android:name="android.intent.action.MAIN"/__GT__
                          __LT__category android:name="android.intent.category.LAUNCHER"/__GT__
                      __LT__/intent-filter__GT__
                  __LT__/activity__GT__
                  __LT__meta-data
                      android:name="flutterEmbedding"
                      android:value="2" /__GT__
              __LT__/application__GT__
          __LT__/manifest__GT__
          """
          )

          # 6. Write lib/main.dart
          write_file("lib/main.dart", r'''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';

          import 'screens/onboarding_screen.dart';
          import 'screens/home_shell.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final controller = AppController();
            await controller.initialize();
            runApp(StudyDzApp(controller: controller));
          }

          class AppScope extends InheritedNotifier__LT__AppController__GT__ {
            const AppScope({
              super.key,
              required AppController controller,
              required super.child,
            }) : super(notifier: controller);

            static AppController of(BuildContext context) {
              final scope = context.dependOnInheritedWidgetOfExactType__LT__AppScope__GT__();
              return scope!.notifier!;
            }
          }

          class StudyDzApp extends StatelessWidget {
            final AppController controller;

            const StudyDzApp({super.key, required this.controller});

            @override
            Widget build(BuildContext context) {
              return AppScope(
                controller: controller,
                child: AnimatedBuilder(
                  animation: controller,
                  builder: (context, _) {
                    final isAr = controller.languageCode == 'ar';
                    const primaryGreen = Color(0xFF147A42);
                    const accentGold = Color(0xFFF5B800);

                    final lightScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: primaryGreen,
                      secondary: accentGold,
                      brightness: Brightness.light,
                      surface: const Color(0xFFF3F6F3),
                    );

                    final darkScheme = ColorScheme.fromSeed(
                      seedColor: primaryGreen,
                      primary: const Color(0xFF2ECC71),
                      secondary: accentGold,
                      brightness: Brightness.dark,
                      surface: const Color(0xFF121A15),
                    );

                    return MaterialApp(
                      debugShowCheckedModeBanner: false,
                      title: 'Study DZ • ستدي دي زد',
                      themeMode: controller.isDarkMode ? ThemeMode.dark : ThemeMode.light,
                      theme: ThemeData(
                        useMaterial3: true,
                        colorScheme: lightScheme,
                        scaffoldBackgroundColor: const Color(0xFFF1F4F1),
                        cardTheme: CardTheme(
                          elevation: 0.8,
                          color: const Color(0xFFF9F9F5),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(22),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: primaryGreen,
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      darkTheme: ThemeData(
                        useMaterial3: true,
                        colorScheme: darkScheme,
                        scaffoldBackgroundColor: const Color(0xFF0D1410),
                        cardTheme: CardTheme(
                          elevation: 1,
                          color: const Color(0xFF19241D),
                          shape: RoundedRectangleBorder(
                            borderRadius: BorderRadius.circular(22),
                          ),
                        ),
                        appBarTheme: const AppBarTheme(
                          backgroundColor: Color(0xFF0A4F29),
                          foregroundColor: Colors.white,
                          centerTitle: true,
                          elevation: 0,
                        ),
                      ),
                      builder: (context, child) {
                        return Directionality(
                          textDirection: isAr ? TextDirection.rtl : TextDirection.ltr,
                          child: child ?? const SizedBox.shrink(),
                        );
                      },
                      home: controller.hasCompletedOnboarding
                          ? const HomeShell()
                          : const OnboardingScreen(),
                    );
                  },
                ),
              );
            }
          }

          class StudentProfile {
            String id;
            String name;
            String gender; // 'male' or 'female'
            String levelCode;
            String streamCode;

            StudentProfile({
              required this.id,
              required this.name,
              this.gender = 'male',
              this.levelCode = '3AS',
              this.streamCode = 'SE',
            });

            String get cycle {
              if (levelCode.endsWith('AP')) return 'primaire';
              if (levelCode.endsWith('AM')) return 'moyen';
              return 'secondaire';
            }

            Map__LT__String, dynamic__GT__ toJson() =__GT__ {
                  'id': id,
                  'name': name,
                  'gender': gender,
                  'levelCode': levelCode,
                  'streamCode': streamCode,
                };

            factory StudentProfile.fromJson(Map__LT__String, dynamic__GT__ json) {
              return StudentProfile(
                id: json['id']?.toString() ?? 'p1',
                name: json['name']?.toString() ?? 'الوليد',
                gender: json['gender']?.toString() ?? 'male',
                levelCode: json['levelCode']?.toString() ?? '3AS',
                streamCode: json['streamCode']?.toString() ?? 'SE',
              );
            }
          }

          class AppController extends ChangeNotifier {
            bool hasCompletedOnboarding = false;
            bool isGuest = true;
            bool isGoogleSignedIn = false;
            String accountName = '';
            String accountEmail = '';
            String languageCode = 'ar'; // 'ar', 'fr', 'en'
            bool isDarkMode = false;

            List__LT__StudentProfile__GT__ profiles = [];
            int activeProfileIndex = 0;

            static const List__LT__Map__LT__String, String__GT____GT__ allLevels = [
              {'code': '1AP', 'ar': 'السنة الأولى ابتدائي (1AP)', 'fr': '1ère Année Primaire (1AP)', 'en': '1st Year Primary (1AP)', 'cycle': 'primaire'},
              {'code': '2AP', 'ar': 'السنة الثانية ابتدائي (2AP)', 'fr': '2ème Année Primaire (2AP)', 'en': '2nd Year Primary (2AP)', 'cycle': 'primaire'},
              {'code': '3AP', 'ar': 'السنة الثالثة ابتدائي (3AP)', 'fr': '3ème Année Primaire (3AP)', 'en': '3rd Year Primary (3AP)', 'cycle': 'primaire'},
              {'code': '4AP', 'ar': 'السنة الرابعة ابتدائي (4AP)', 'fr': '4ème Année Primaire (4AP)', 'en': '4th Year Primary (4AP)', 'cycle': 'primaire'},
              {'code': '5AP', 'ar': 'السنة الخامسة ابتدائي - السانكيام (5AP)', 'fr': '5ème Année Primaire (5AP)', 'en': '5th Year Primary - 5ème (5AP)', 'cycle': 'primaire'},
              {'code': '1AM', 'ar': 'السنة الأولى متوسط (1AM)', 'fr': '1ère Année Moyenne (1AM)', 'en': '1st Year Middle School (1AM)', 'cycle': 'moyen'},
              {'code': '2AM', 'ar': 'السنة الثانية متوسط (2AM)', 'fr': '2ème Année Moyenne (2AM)', 'en': '2nd Year Middle School (2AM)', 'cycle': 'moyen'},
              {'code': '3AM', 'ar': 'السنة الثالثة متوسط (3AM)', 'fr': '3ème Année Moyenne (3AM)', 'en': '3rd Year Middle School (3AM)', 'cycle': 'moyen'},
              {'code': '4AM', 'ar': 'السنة الرابعة متوسط - البيام (4AM)', 'fr': '4ème Année Moyenne - BEM (4AM)', 'en': '4th Year Middle School - BEM (4AM)', 'cycle': 'moyen'},
              {'code': '1AS', 'ar': 'السنة الأولى ثانوي (1AS)', 'fr': '1ère Année Secondaire (1AS)', 'en': '1st Year High School (1AS)', 'cycle': 'secondaire'},
              {'code': '2AS', 'ar': 'السنة الثانية ثانوي (2AS)', 'fr': '2ème Année Secondaire (2AS)', 'en': '2nd Year High School (2AS)', 'cycle': 'secondaire'},
              {'code': '3AS', 'ar': 'السنة الثالثة ثانوي - البكالوريا (3AS)', 'fr': '3ème Année Secondaire - BAC (3AS)', 'en': '3rd Year High School - BAC (3AS)', 'cycle': 'secondaire'},
            ];

            static const List__LT__Map__LT__String, String__GT____GT__ streams1AS = [
              {'code': 'TC_ST', 'ar': 'جذع مشترك علوم وتكنولوجيا', 'fr': 'Tronc Commun Sciences et Tech.', 'en': 'Common Core Science & Tech'},
              {'code': 'TC_L', 'ar': 'جذع مشترك آداب', 'fr': 'Tronc Commun Lettres', 'en': 'Common Core Literature'},
            ];

            static const List__LT__Map__LT__String, String__GT____GT__ streams2AS3AS = [
              {'code': 'SE', 'ar': 'علوم تجريبية', 'fr': 'Sciences Expérimentales', 'en': 'Experimental Sciences'},
              {'code': 'MATH', 'ar': 'رياضيات', 'fr': 'Mathématiques', 'en': 'Mathematics'},
              {'code': 'TM', 'ar': 'تقني رياضي', 'fr': 'Technique Mathématique', 'en': 'Technical Mathematics'},
              {'code': 'GE', 'ar': 'تسيير واقتصاد', 'fr': 'Gestion et Économie', 'en': 'Management & Economics'},
              {'code': 'LP', 'ar': 'آداب وفلسفة', 'fr': 'Lettres et Philosophie', 'en': 'Literature & Philosophy'},
              {'code': 'LE', 'ar': 'لغات أجنبية', 'fr': 'Langues Étrangères', 'en': 'Foreign Languages'},
            ];

            static const Map__LT__String, Map__LT__String, String__GT____GT__ subjectCatalog = {
              'arabic': {'ar': 'اللغة العربية', 'fr': 'Langue Arabe', 'en': 'Arabic Language', 'emoji': '📖'},
              'math': {'ar': 'الرياضيات', 'fr': 'Mathématiques', 'en': 'Mathematics', 'emoji': '🧮'},
              'physics': {'ar': 'العلوم الفيزيائية والتكنولوجيا', 'fr': 'Sciences Physiques', 'en': 'Physical Sciences', 'emoji': '⚗️'},
              'science': {'ar': 'علوم الطبيعة والحياة', 'fr': 'Sciences de la Nature et de la Vie', 'en': 'Natural & Life Sciences', 'emoji': '🌿'},
              'islamic': {'ar': 'التربية الإسلامية', 'fr': 'Éducation Islamique', 'en': 'Islamic Education', 'emoji': '🕌'},
              'hisgeo': {'ar': 'التاريخ والجغرافيا', 'fr': 'Histoire et Géographie', 'en': 'History & Geography', 'emoji': '🌍'},
              'civics': {'ar': 'التربية المدنية', 'fr': 'Éducation Civique', 'en': 'Civic Education', 'emoji': '⚖️'},
              'french': {'ar': 'اللغة الفرنسية', 'fr': 'Langue Française', 'en': 'French Language', 'emoji': '🗼'},
              'english': {'ar': 'اللغة الإنجليزية', 'fr': 'Langue Anglaise', 'en': 'English Language', 'emoji': '🇬🇧'},
              'cs': {'ar': 'الإعلام الآلي', 'fr': 'Informatique', 'en': 'Computer Science', 'emoji': '💻'},
              'philo': {'ar': 'الفلسفة', 'fr': 'Philosophie', 'en': 'Philosophy', 'emoji': '🤔'},
              'accounting': {'ar': 'التسيير المحاسبي والمالي', 'fr': 'Gestion Comptable et Financière', 'en': 'Accounting & Finance', 'emoji': '📊'},
              'economy': {'ar': 'الاقتصاد والمناجمنت', 'fr': 'Économie et Management', 'en': 'Economics & Management', 'emoji': '📈'},
              'law': {'ar': 'القانون', 'fr': 'Droit', 'en': 'Law', 'emoji': '📜'},
              'engineering': {'ar': 'الهندسة والتكنولوجيا', 'fr': 'Génie & Technologie', 'en': 'Engineering & Tech', 'emoji': '⚙️'},
              'third_lang': {'ar': 'اللغة الأجنبية الثالثة (إسبانية/ألمانية/إيطالية)', 'fr': '3ème Langue Étrangère', 'en': 'Third Foreign Language', 'emoji': '🗣️'},
              'amazigh': {'ar': 'اللغة الأمازيغية', 'fr': 'Langue Amazighe', 'en': 'Amazigh Language', 'emoji': 'ⵣ'},
            };

            StudentProfile get currentProfile {
              if (profiles.isEmpty) {
                profiles.add(StudentProfile(
                  id: 'default_1',
                  name: 'الوليد',
                  gender: 'male',
                  levelCode: '3AS',
                  streamCode: 'SE',
                ));
              }
              if (activeProfileIndex __LT__ 0 || activeProfileIndex __GT__= profiles.length) {
                activeProfileIndex = 0;
              }
              return profiles[activeProfileIndex];
            }

            String tr(String ar, String fr, [String? en]) {
              if (languageCode == 'fr' && fr.isNotEmpty) return fr;
              if (languageCode == 'en' && en != null && en.isNotEmpty) return en;
              return ar;
            }

            String levelLabel(String code) {
              for (final lvl in allLevels) {
                if (lvl['code'] == code) {
                  return tr(lvl['ar']!, lvl['fr']!, lvl['en']);
                }
              }
              return code;
            }

            String streamLabel(String code) {
              for (final s in [...streams1AS, ...streams2AS3AS]) {
                if (s['code'] == code) {
                  return tr(s['ar']!, s['fr']!, s['en']);
                }
              }
              return '';
            }

            String subjectTitle(String id) {
              final meta = subjectCatalog[id];
              if (meta == null) return id;
              return tr(meta['ar']!, meta['fr']!, meta['en']);
            }

            String subjectEmoji(String id) {
              return subjectCatalog[id]?['emoji'] ?? '📘';
            }

            // Returns the exact map of {subjectId: coefficient} for any level and stream
            Map__LT__String, int__GT__ getCoefficientsForLevel(String levelCode, String streamCode) {
              switch (levelCode) {
                case '1AP':
                case '2AP':
                  return {
                    'arabic': 1,
                    'math': 1,
                    'islamic': 1,
                    'science': 1,
                    'civics': 1,
                  };
                case '3AP':
                  return {
                    'arabic': 2,
                    'math': 2,
                    'french': 1,
                    'english': 1,
                    'islamic': 1,
                    'science': 1,
                    'hisgeo': 1,
                    'civics': 1,
                  };
                case '4AP':
                  return {
                    'arabic': 3,
                    'math': 3,
                    'french': 2,
                    'english': 1,
                    'science': 2,
                    'islamic': 1,
                    'hisgeo': 1,
                    'civics': 1,
                  };
                case '5AP':
                  return {
                    'arabic': 4,
                    'math': 4,
                    'french': 2,
                    'english': 1,
                    'science': 2,
                    'islamic': 1,
                    'hisgeo': 2,
                    'civics': 1,
                  };
                case '1AM':
                  return {
                    'arabic': 2,
                    'math': 2,
                    'physics': 1,
                    'science': 1,
                    'french': 1,
                    'english': 1,
                    'hisgeo': 2,
                    'islamic': 1,
                    'civics': 1,
                    'cs': 1,
                  };
                case '2AM':
                case '3AM':
                  return {
                    'arabic': 3,
                    'math': 3,
                    'physics': 2,
                    'science': 2,
                    'french': 2,
                    'english': 1,
                    'hisgeo': 2,
                    'islamic': 1,
                    'civics': 1,
                    'cs': 1,
                  };
                case '4AM':
                  return {
                    'arabic': 5,
                    'math': 4,
                    'french': 3,
                    'hisgeo': 3,
                    'physics': 2,
                    'science': 2,
                    'english': 2,
                    'islamic': 2,
                    'civics': 1,
                    'cs': 1,
                  };
                case '1AS':
                  if (streamCode == 'TC_L') {
                    return {
                      'arabic': 5,
                      'hisgeo': 3,
                      'french': 3,
                      'english': 3,
                      'islamic': 2,
                      'math': 2,
                      'science': 1,
                      'cs': 1,
                    };
                  }
                  return {
                    'math': 5,
                    'physics': 4,
                    'science': 4,
                    'arabic': 3,
                    'french': 2,
                    'english': 2,
                    'hisgeo': 2,
                    'islamic': 2,
                    'cs': 2,
                  };
                case '2AS':
                case '3AS':
                default:
                  final is3AS = levelCode == '3AS';
                  if (streamCode == 'MATH') {
                    return {
                      'math': 7,
                      'physics': 6,
                      'arabic': 3,
                      'science': 2,
                      'hisgeo': 2,
                      'french': 2,
                      'english': 2,
                      'islamic': 2,
                      if (is3AS) 'philo': 2,
                    };
                  }
                  if (streamCode == 'TM') {
                    return {
                      'engineering': 6,
                      'math': 6,
                      'physics': 6,
                      'arabic': 3,
                      'hisgeo': 2,
                      'french': 2,
                      'english': 2,
                      'islamic': 2,
                      if (is3AS) 'philo': 2,
                    };
                  }
                  if (streamCode == 'GE') {
                    return {
                      'accounting': is3AS ? 6 : 5,
                      'economy': 5,
                      'math': 5,
                      'hisgeo': 4,
                      'arabic': 3,
                      'law': 2,
                      'french': 2,
                      'english': 2,
                      'islamic': 2,
                      if (is3AS) 'philo': 2,
                    };
                  }
                  if (streamCode == 'LP') {
                    return {
                      'arabic': 6,
                      'philo': is3AS ? 6 : 5,
                      'hisgeo': 4,
                      'french': 3,
                      'english': 3,
                      'islamic': 2,
                      'math': 2,
                    };
                  }
                  if (streamCode == 'LE') {
                    return {
                      'arabic': 5,
                      'french': 5,
                      'english': 5,
                      'third_lang': is3AS ? 5 : 4,
                      'hisgeo': 2,
                      'islamic': 2,
                      'math': 2,
                      if (is3AS) 'philo': 2,
                    };
                  }
                  // Default: SE (علوم تجريبية)
                  return {
                    'science': 6,
                    'math': 5,
                    'physics': 5,
                    'arabic': 3,
                    'hisgeo': 2,
                    'french': 2,
                    'english': 2,
                    'islamic': 2,
                    if (is3AS) 'philo': 2,
                  };
              }
            }

            // Generates structured items for any level, subject, trimester (1..3), and category
            List__LT__Map__LT__String, String__GT____GT__ getStudyItems({
              required String levelCode,
              required String subjectId,
              required int trimester,
              required String category, // 'lessons', 'summaries', 'tests', 'exams'
            }) {
              final subjAr = subjectCatalog[subjectId]?['ar'] ?? subjectId;
              final lvlName = levelCode;
              final trimName = trimester == 1
                  ? 'الفصل الأول'
                  : trimester == 2
                      ? 'الفصل الثاني'
                      : 'الفصل الثالث';

              if (category == 'lessons') {
                return [
                  {
                    'title': 'الدرس 1 في $subjAr - $trimName ($lvlName)',
                    'subtitle': 'شرح مفصل للوحدة الأولى مع أمثلة تطبيقية وفق المنهاج الوزاري',
                    'body': '📚 الدرس الأول: مدخل ومفاهيم أساسية في مادة $subjAr ($lvlName - $trimName)\n\n'
                        '1. تعريف ومفاهيم قاعدية:\n'
                        'يتناول هذا الدرس القواعد الأساسية المقررة في التدرج السنوي الرسمي لوزارة التربية الوطنية الجزائرية للمستوى $lvlName.\n\n'
                        '2. القوانين والخطوات المنهجية:\n'
                        '• قراءة المعطيات بدقة واستخراج الكلمات المفتاحية.\n'
                        '• تطبيق القاعدة أو العلاقة الأساسية خطوة بخطوة.\n'
                        '• كتابة الاستنتاج النهائي بلغة سليمة ومنظمة.\n\n'
                        '3. تمرين تطبيقي محلول:\n'
                        'سؤال: طبّق ما درسته في هذه الوحدة على وضعية نموذجية.\n'
                        'الإجابة النموذجية: نكتب المعطيات أولاً ثم نبرهن على النتيجة باستعمال خواص الدرس.',
                  },
                  {
                    'title': 'الدرس 2 في $subjAr - $trimName ($lvlName)',
                    'subtitle': 'تعمق وتطبيقات شاملة حول المقطع الثاني',
                    'body': '📚 الدرس الثاني في $subjAr ($lvlName - $trimName)\n\n'
                        '• عناصر الدرس:\n'
                        '1) التحليل والاستنتاج المنهجي.\n'
                        '2) الربط بين المفاهيم النظرية والتمارين التطبيقية.\n'
                        '3) أهم الأسئلة المتكررة في الفروض والاختبارات الفصلية حول هذا المقطع.',
                  },
